<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - EC1375 Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF;
            --accent: #FFD700; --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 60px;
        }
        .container { max-width: 560px; margin: 0 auto; padding: 24px 20px; }
        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
        }
        .top-bar-inner { max-width: 560px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .hero { text-align: center; padding: 30px 0; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.6rem; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.95rem; color: var(--text); }
        .card { background: var(--dark-light); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.85rem; color: var(--text); margin-bottom: 6px; font-weight: 600; }
        .field-group input {
            width: 100%; padding: 14px; background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            color: var(--text-bright); font-size: 1rem; font-family: inherit;
        }
        .btn {
            padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease; text-align: center; text-decoration: none;
            display: block;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-top: 10px; }
        .btn-full { width: 100%; }
        .msg { font-size: 0.88rem; margin-top: 14px; text-align: center; }
        .msg.error { color: var(--danger); }
        .msg.success { color: var(--success); }
        .spinner { text-align: center; color: var(--text); font-size: 0.88rem; }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">🔑 Restablecer contraseña</div></div>
    <div class="container">
        <div class="hero">
            <div class="hero-icon">🔑</div>
            <h1 class="hero-title" id="heroTitle">Pon tu nueva contraseña</h1>
            <p class="hero-subtitle" id="heroSubtitle">Verificando tu liga de restablecimiento...</p>
        </div>
        <div class="card" id="app"></div>
    </div>

    <script>
    let recoveryReady = false;

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function renderForm(message) {
        const errorHtml = message ? `<p class="msg error">${escapeHtml(message)}</p>` : '';
        document.getElementById('app').innerHTML = `
            <div class="field-group">
                <label>Nueva contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="newPasswordInput" placeholder="Tu nueva contraseña">
            </div>
            <div class="field-group">
                <label>Confirma tu nueva contraseña</label>
                <input type="password" id="newPasswordConfirmInput" placeholder="Repite tu nueva contraseña">
            </div>
            ${errorHtml}
            <button class="btn btn-primary btn-full" onclick="handleSetPassword()">Guardar contraseña</button>
        `;
    }

    function renderInvalidLink() {
        document.getElementById('heroTitle').textContent = 'Esta liga ya no es válida';
        document.getElementById('heroSubtitle').textContent = 'Las ligas de restablecimiento expiran después de un rato, o esta página se abrió sin una.';
        document.getElementById('app').innerHTML = `
            <a class="btn btn-primary btn-full" href="recuperar.html" style="display:block;">Pedir una liga nueva</a>
        `;
    }

    async function handleSetPassword() {
        const pInput = document.getElementById('newPasswordInput');
        const cInput = document.getElementById('newPasswordConfirmInput');
        const password = pInput.value || '';
        const confirm = cInput.value || '';
        if (password.length < 6) { renderForm('La contraseña debe tener al menos 6 caracteres.'); return; }
        if (password !== confirm) { renderForm('Las contraseñas no coinciden.'); return; }

        document.getElementById('app').innerHTML = `<p class="spinner">Guardando...</p>`;
        try {
            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) { renderForm('No se pudo guardar tu contraseña. Pide una liga nueva desde "Iniciar sesión".'); return; }
        } catch (e) {
            renderForm('No se pudo guardar tu contraseña. Intenta de nuevo.');
            return;
        }

        document.getElementById('heroTitle').textContent = '¡Listo!';
        document.getElementById('heroSubtitle').textContent = 'Tu contraseña quedó guardada.';
        const row = await Auth.pullMyRow();
        const restored = Auth.restoreLocalStorageFromRow(row);
        if (restored.length > 0) {
            document.getElementById('app').innerHTML = `
                <p class="msg success">✅ Recuperamos tu avance en este dispositivo.</p>
                <a class="btn btn-primary btn-full" href="autodiagnostico.html" style="display:block;margin-top:14px;">Continuar mi proceso →</a>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <p class="msg success">✅ Ya puedes continuar tu proceso.</p>
                <a class="btn btn-primary btn-full" href="autodiagnostico.html" style="display:block;margin-top:14px;">Ir al Autodiagnóstico →</a>
            `;
        }
    }

    /* Supabase detecta el token de recuperación en la URL al cargar el
       cliente y dispara PASSWORD_RECOVERY — ahí, y solo ahí, se muestra
       el formulario. Si el evento nunca llega (liga vencida, o alguien
       abrió esta página directo sin liga), el timeout de respaldo muestra
       el mensaje de "liga inválida" en vez de dejar la pantalla de carga
       para siempre. */
    supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
            recoveryReady = true;
            document.getElementById('heroSubtitle').textContent = 'Escribe tu nueva contraseña.';
            renderForm();
        }
    });

    setTimeout(() => { if (!recoveryReady) renderInvalidLink(); }, 3500);
    </script>
</body>
</html>
