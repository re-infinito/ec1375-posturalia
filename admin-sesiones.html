<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sesiones de Alineación - Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/es.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }

        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar-inner { font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .top-bar a { color: var(--primary); font-size: 0.82rem; text-decoration: none; }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary-light);
            border-bottom-color: var(--primary-light);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--dark-light);
            border: 1px solid rgba(0,136,255,0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-bright);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: var(--text-bright);
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0,136,255,0.2);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: #000; }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .sesion-item {
            background: rgba(0,136,255,0.1);
            border-left: 4px solid var(--primary);
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sesion-info {
            flex: 1;
        }

        .sesion-meta {
            font-size: 0.9rem;
            color: var(--text);
            margin-top: 4px;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .alert-success { background: rgba(0,255,136,0.1); border: 1px solid var(--success); color: var(--success); }
        .alert-error { background: rgba(255,51,51,0.1); border: 1px solid var(--danger); color: var(--danger); }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .sesion-item { flex-direction: column; align-items: flex-start; }
        }

        /* Flatpickr — selector visual de fecha/hora, integrado al tema oscuro */
        .form-group input.flatpickr-input,
        .form-group input[readonly] {
            cursor: pointer;
            background: rgba(0,0,0,0.3);
        }
        .flatpickr-calendar {
            background: var(--dark-light);
            border: 1px solid rgba(0,136,255,0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .flatpickr-calendar.arrowTop:before,
        .flatpickr-calendar.arrowTop:after { border-bottom-color: var(--dark-light); }
        .flatpickr-months .flatpickr-month,
        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-weekdays { background: var(--dark-light); color: var(--text-bright); fill: var(--text-bright); }
        .flatpickr-day { color: var(--text); }
        .flatpickr-day.today { border-color: var(--primary); }
        .flatpickr-day.selected,
        .flatpickr-day.selected:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .flatpickr-day:hover { background: rgba(0,136,255,0.2); }
        .flatpickr-day.flatpickr-disabled { color: rgba(255,255,255,0.15); }
        .flatpickr-time input,
        .flatpickr-time .flatpickr-time-separator,
        .flatpickr-time .flatpickr-am-pm { color: var(--text-bright); }
        .flatpickr-time input:hover,
        .flatpickr-time input:focus { background: rgba(0,136,255,0.15); }
        .numInputWrapper span.arrowUp:after { border-bottom-color: var(--text); }
        .numInputWrapper span.arrowDown:after { border-top-color: var(--text); }
        .numInputWrapper:hover { background: transparent; }
        .numInputWrapper span:hover { background: rgba(0,136,255,0.15); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">⚙️ Admin - Sesiones de Alineación</div>
        <a href="admin-index.html">🗂️ Índice</a>
    </div>
    <div class="container">
        <div id="app"></div>
    </div>

    <script>
    let sesiones = [];
    let fpFecha, fpHoraInicio, fpHoraFin;
    let sesionEditandoId = null;

    function initSelectoresFechaHora() {
        fpFecha = flatpickr('#fecha', {
            locale: 'es',
            altInput: true,
            altFormat: 'j \\d\\e F, Y',
            dateFormat: 'Y-m-d',
            minDate: 'today'
        });

        fpHoraInicio = flatpickr('#horaInicio', {
            locale: 'es',
            enableTime: true,
            noCalendar: true,
            dateFormat: 'H:i',
            time_24hr: true,
            minuteIncrement: 15,
            onChange: (selectedDates, dateStr) => {
                if (fpHoraFin) fpHoraFin.set('minTime', dateStr);
            }
        });

        fpHoraFin = flatpickr('#horaFin', {
            locale: 'es',
            enableTime: true,
            noCalendar: true,
            dateFormat: 'H:i',
            time_24hr: true,
            minuteIncrement: 15
        });
    }

    async function init() {
        try {
            if (typeof window.supabase === 'undefined') {
                throw new Error('El CDN de Supabase (@supabase/supabase-js) no cargó. Revisa tu conexión o bloqueadores de script.');
            }
            if (typeof window.Auth === 'undefined' || typeof window.supabaseClient === 'undefined') {
                throw new Error('auth.js no se inicializó correctamente (window.Auth / window.supabaseClient no definidos).');
            }

            const session = await Auth.getSession();
            if (!session) {
                document.getElementById('app').innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p>Necesitas iniciar sesión</p>
                        <a href="recuperar.html" class="btn btn-primary">Ir a login</a>
                    </div>
                `;
                return;
            }

            // TODO: Verificar que sea admin (Auth.isAdmin) — pendiente de
            // confirmar que el email del usuario esté registrado como admin
            // antes de activar este gate. Ver PROYECTO_MEMORIA.md.
            render();
        } catch (error) {
            console.error('Error al iniciar el panel admin-sesiones:', error);
            document.getElementById('app').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <p style="color: var(--danger); font-weight: 600;">⚠️ Error al cargar el panel</p>
                    <p style="margin-top: 8px; font-size: 0.85rem; color: var(--text);">${(error && error.message) || 'Error desconocido'}</p>
                    <button class="btn btn-primary" style="margin-top: 16px;" onclick="location.reload()">Recargar</button>
                </div>
            `;
        }
    }

    async function cargarSesiones() {
        try {
            const { data, error } = await supabaseClient
                .from('sesiones_alineacion')
                .select(`
                    id,
                    fecha,
                    hora_inicio,
                    hora_fin,
                    capacidad_maxima,
                    instructor_nombre,
                    estado,
                    google_meet_link,
                    google_event_id,
                    descripcion
                `)
                .order('fecha', { ascending: true });

            if (error) throw error;
            sesiones = data || [];
            actualizarListaSesiones();
        } catch (error) {
            mostrarError('Error cargando sesiones: ' + error.message);
        }
    }

    function actualizarListaSesiones() {
        const lista = document.getElementById('sesiones-lista');
        if (!lista) return;

        if (sesiones.length === 0) {
            lista.innerHTML = '<p style="text-align: center; color: #888;">No hay sesiones creadas</p>';
            return;
        }

        lista.innerHTML = sesiones.map(s => `
            <div class="sesion-item">
                <div class="sesion-info">
                    <div style="font-weight: 600; color: var(--text-bright);">
                        ${s.fecha} • ${s.hora_inicio} - ${s.hora_fin}
                    </div>
                    <div class="sesion-meta">
                        👨‍🏫 ${s.instructor_nombre || '(sin instructor)'} •
                        📊 ${s.capacidad_maxima} cupos •
                        ${s.google_meet_link ? '✓ Google Meet listo' : '⚠️ Sin Google Meet'}
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-primary" style="padding: 8px 12px; font-size: 0.85rem;"
                            onclick="editarSesion('${s.id}')">Editar</button>
                    <button class="btn btn-danger" style="padding: 8px 12px; font-size: 0.85rem;"
                            onclick="eliminarSesion('${s.id}')">Eliminar</button>
                </div>
            </div>
        `).join('');
    }

    async function crearSesion(event) {
        event.preventDefault();
        if (sesionEditandoId) return actualizarSesion(event);

        const fecha = document.getElementById('fecha').value;
        const horaInicio = document.getElementById('horaInicio').value;
        const horaFin = document.getElementById('horaFin').value;
        const capacidad = parseInt(document.getElementById('capacidad').value);
        const instructor = document.getElementById('instructor').value;
        const googleMeetLink = document.getElementById('googleMeetLink').value.trim() || null;
        const descripcion = document.getElementById('descripcion').value;

        if (!fecha || !horaInicio || !horaFin || !capacidad) {
            mostrarError('Completa todos los campos requeridos');
            return;
        }

        const btn = event.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = '⏳ Creando...';

        try {
            // Crear evento en Google Calendar
            const googleResult = await crearEventoGoogleCalendar(
                fecha, horaInicio, horaFin, instructor, googleMeetLink
            );

            if (!googleResult || !googleResult.google_event_id) {
                mostrarError('No se pudo crear el evento en Google Calendar');
                return;
            }

            // Guardar en Supabase. El evento de Google Calendar ya se creó
            // en el paso anterior — si esto falla, ese evento queda
            // huérfano (sin fila en sesiones_alineacion). No hay rollback
            // automático del lado de Calendar, así que el mensaje de error
            // incluye el link directo al evento para borrarlo a mano.
            try {
                const { error } = await supabaseClient
                    .from('sesiones_alineacion')
                    .insert([{
                        fecha,
                        hora_inicio: horaInicio,
                        hora_fin: horaFin,
                        capacidad_maxima: capacidad,
                        instructor_nombre: instructor,
                        descripcion,
                        estado: 'abierta',
                        google_event_id: googleResult.google_event_id,
                        google_meet_link: googleResult.google_meet_link
                    }])
                    .select();

                if (error) throw error;
            } catch (dbError) {
                const linkEvento = googleResult.event_url
                    ? ` Borra el evento huérfano en Calendar: ${googleResult.event_url}`
                    : '';
                mostrarError(
                    `El evento SÍ se creó en Google Calendar, pero no se pudo guardar en la base de datos: ${dbError.message}.${linkEvento}`
                );
                return;
            }

            mostrarExito('Sesión creada exitosamente en Google Calendar y Supabase');
            document.getElementById('formCrearSesion').reset();
            document.getElementById('capacidad').value = 30;
            fpFecha.clear();
            fpHoraInicio.clear();
            fpHoraFin.clear();
            await cargarSesiones();
        } catch (error) {
            mostrarError('Error: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Crear Sesión';
        }
    }

    async function crearEventoGoogleCalendar(fecha, horaInicio, horaFin, instructor, googleMeetLink) {
        try {
            const resp = await fetch('/api/crear-evento-google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fecha, horaInicio, horaFin, instructor, googleMeetLink })
            });

            if (!resp.ok) {
                const bodyText = await resp.text();
                let mensaje = `Error del servidor (${resp.status})`;
                try {
                    const error = JSON.parse(bodyText);
                    // Mostrar ambos: el mensaje genérico Y el detalle específico
                    // (antes solo se mostraba error.error, ocultando la causa real
                    // que viene en error.message).
                    mensaje = [error.error, error.message].filter(Boolean).join(' — ') || mensaje;
                } catch (parseErr) {
                    // La respuesta no fue JSON (p.ej. un crash de la función
                    // serverless) — mostrar el texto crudo en vez de romper
                    // con "Unexpected token" sin decir nada útil.
                    if (bodyText) mensaje = bodyText.slice(0, 200);
                }
                throw new Error(mensaje);
            }

            const data = await resp.json();
            return {
                google_event_id: data.google_event_id,
                google_meet_link: data.google_meet_link
            };
        } catch (e) {
            console.error('Error en crearEventoGoogleCalendar:', e);
            throw e;
        }
    }

    async function eliminarSesion(sesionId) {
        if (!confirm('¿Eliminar esta sesión?')) return;

        const sesion = sesiones.find(s => s.id === sesionId);

        // Borrar primero el evento de Google Calendar (si existe) para no
        // dejarlo huérfano — si esto falla por algo que no sea "ya no
        // existe", se avisa pero se continúa con el borrado en Supabase de
        // todas formas: la fila de la app es lo que importa para que deje
        // de aparecer en el panel/grilla de usuarios.
        if (sesion && sesion.google_event_id) {
            try {
                const resp = await fetch('/api/eliminar-evento-google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ eventId: sesion.google_event_id })
                });
                if (!resp.ok) {
                    const bodyText = await resp.text();
                    console.warn('No se pudo borrar el evento de Google Calendar:', bodyText);
                }
            } catch (e) {
                console.warn('No se pudo borrar el evento de Google Calendar:', e);
            }
        }

        try {
            const { error } = await supabaseClient
                .from('sesiones_alineacion')
                .delete()
                .eq('id', sesionId);

            if (error) throw error;
            mostrarExito('Sesión eliminada (y su evento en Google Calendar)');
            await cargarSesiones();
        } catch (error) {
            mostrarError('Error: ' + error.message);
        }
    }

    // Editar solo cambia capacidad/instructor/Meet link/descripción — no
    // fecha/hora, porque eso movería el evento ya creado en Google Calendar
    // y este formulario no tiene forma de actualizar un evento existente
    // (solo de crear uno nuevo). Para cambiar fecha/hora hay que eliminar
    // la sesión y crearla de nuevo.
    function editarSesion(id) {
        const sesion = sesiones.find(s => s.id === id);
        if (!sesion) { mostrarError('No se encontró la sesión'); return; }

        sesionEditandoId = id;
        switchTab('crear', document.querySelector('.tab-btn[data-tab="crear"]'));

        fpFecha.setDate(sesion.fecha, true);
        fpHoraInicio.setDate(sesion.hora_inicio, true, 'H:i:S');
        fpHoraFin.setDate(sesion.hora_fin, true, 'H:i:S');
        document.getElementById('fecha').disabled = true;
        document.getElementById('horaInicio').disabled = true;
        document.getElementById('horaFin').disabled = true;
        fpFecha.set('clickOpens', false);
        fpHoraInicio.set('clickOpens', false);
        fpHoraFin.set('clickOpens', false);

        document.getElementById('capacidad').value = sesion.capacidad_maxima;
        document.getElementById('instructor').value = sesion.instructor_nombre || '';
        document.getElementById('googleMeetLink').value = sesion.google_meet_link || '';
        document.getElementById('descripcion').value = sesion.descripcion || '';

        document.getElementById('formCrearSesionTitulo').textContent = 'Editar Sesión';
        document.getElementById('editandoNota').style.display = 'block';
        document.getElementById('cancelarEdicionBtn').style.display = 'inline-block';
        document.querySelector('#formCrearSesion button[type="submit"]').textContent = '✓ Actualizar Sesión';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function actualizarSesion(event) {
        const capacidad = parseInt(document.getElementById('capacidad').value);
        const instructor = document.getElementById('instructor').value;
        const googleMeetLink = document.getElementById('googleMeetLink').value.trim() || null;
        const descripcion = document.getElementById('descripcion').value;

        if (!capacidad) {
            mostrarError('Completa la capacidad');
            return;
        }

        const btn = event.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = '⏳ Actualizando...';

        try {
            const { error } = await supabaseClient
                .from('sesiones_alineacion')
                .update({
                    capacidad_maxima: capacidad,
                    instructor_nombre: instructor,
                    google_meet_link: googleMeetLink,
                    descripcion
                })
                .eq('id', sesionEditandoId);

            if (error) throw error;

            mostrarExito('Sesión actualizada');
            cancelarEdicion();
            await cargarSesiones();
        } catch (error) {
            mostrarError('Error actualizando: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = sesionEditandoId ? '✓ Actualizar Sesión' : '✓ Crear Sesión';
        }
    }

    function cancelarEdicion() {
        sesionEditandoId = null;
        document.getElementById('formCrearSesion').reset();
        document.getElementById('capacidad').value = 30;
        document.getElementById('fecha').disabled = false;
        document.getElementById('horaInicio').disabled = false;
        document.getElementById('horaFin').disabled = false;
        fpFecha.set('clickOpens', true);
        fpHoraInicio.set('clickOpens', true);
        fpHoraFin.set('clickOpens', true);
        fpFecha.clear();
        fpHoraInicio.clear();
        fpHoraFin.clear();
        document.getElementById('formCrearSesionTitulo').textContent = 'Crear Nueva Sesión';
        document.getElementById('editandoNota').style.display = 'none';
        document.getElementById('cancelarEdicionBtn').style.display = 'none';
        document.querySelector('#formCrearSesion button[type="submit"]').textContent = '✓ Crear Sesión';
    }

    function mostrarExito(msg) {
        const app = document.getElementById('app');
        const alert = document.createElement('div');
        alert.className = 'alert alert-success';
        alert.textContent = '✓ ' + msg;
        app.insertBefore(alert, app.firstChild);
        setTimeout(() => alert.remove(), 3000);
    }

    function mostrarError(msg) {
        const app = document.getElementById('app');
        const alert = document.createElement('div');
        alert.className = 'alert alert-error';
        alert.textContent = '✗ ' + msg;
        app.insertBefore(alert, app.firstChild);
        setTimeout(() => alert.remove(), 5000);
    }

    function render() {
        document.getElementById('app').innerHTML = `
            <!-- TABS -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="crear" onclick="switchTab('crear')">➕ Crear Sesión</button>
                <button class="tab-btn" data-tab="listar" onclick="switchTab('listar')">📋 Listar Sesiones</button>
                <button class="tab-btn" data-tab="reportes" onclick="switchTab('reportes')">📊 Reportes</button>
            </div>

            <!-- TAB: CREAR -->
            <div id="tab-crear" class="tab-content active">
                <div class="card">
                    <h2 id="formCrearSesionTitulo" style="margin-bottom: 20px;">Crear Nueva Sesión</h2>
                    <p id="editandoNota" style="display:none; font-size: 0.82rem; color: var(--accent); margin-top: -12px; margin-bottom: 16px;">
                        Fecha y hora no se pueden editar aquí (moverían el evento en Google Calendar) — elimina la sesión y créala de nuevo si necesitas cambiarlas.
                    </p>
                    <form id="formCrearSesion" onsubmit="crearSesion(event)">
                        <div class="grid-2">
                            <div class="form-group">
                                <label>Fecha *</label>
                                <input type="text" id="fecha" placeholder="Selecciona una fecha" readonly required>
                            </div>
                            <div class="form-group">
                                <label>Capacidad (máximo de asistentes) *</label>
                                <input type="number" id="capacidad" value="30" min="1" max="100" required>
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="form-group">
                                <label>Hora Inicio *</label>
                                <input type="text" id="horaInicio" placeholder="Selecciona una hora" readonly required>
                            </div>
                            <div class="form-group">
                                <label>Hora Fin *</label>
                                <input type="text" id="horaFin" placeholder="Selecciona una hora" readonly required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Instructor</label>
                            <input type="text" id="instructor" placeholder="Nombre del instructor">
                        </div>

                        <div class="form-group">
                            <label>Link de Google Meet</label>
                            <input type="url" id="googleMeetLink" placeholder="https://meet.google.com/xxx-xxxx-xxx">
                            <p style="font-size: 0.78rem; color: var(--text); margin-top: 6px;">
                                Créalo en <a href="https://meet.google.com/new" target="_blank" rel="noopener" style="color: var(--primary-light);">meet.google.com/new</a> y pega el link aquí — Google no permite generarlo automáticamente para este calendario. Puedes dejarlo vacío y agregarlo después.
                            </p>
                        </div>

                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea id="descripcion" rows="3" placeholder="Notas adicionales para los participantes"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">✓ Crear Sesión</button>
                        <button type="button" id="cancelarEdicionBtn" class="btn" style="display:none; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text);" onclick="cancelarEdicion()">Cancelar edición</button>
                    </form>
                </div>
            </div>

            <!-- TAB: LISTAR -->
            <div id="tab-listar" class="tab-content">
                <div class="card">
                    <h2 style="margin-bottom: 20px;">Sesiones Programadas</h2>
                    <div id="sesiones-lista"></div>
                </div>
            </div>

            <!-- TAB: REPORTES -->
            <div id="tab-reportes" class="tab-content">
                <div class="card">
                    <h2 style="margin-bottom: 20px;">📊 Reportes de Asistencia</h2>
                    <p style="color: #888;">Reportes de inscritos por sesión — próximamente</p>
                </div>
            </div>
        `;

        initSelectoresFechaHora();
        cargarSesiones();
    }

    function switchTab(tab, clickedBtn) {
        // Actualizar botones. clickedBtn se pasa explícitamente cuando se
        // llama desde código (p.ej. editarSesion) — depender del `event`
        // global implícito solo funciona si vino de un onclick real.
        const btnActivo = clickedBtn
            || (typeof event !== 'undefined' && event && event.target)
            || document.querySelector(`.tab-btn[data-tab="${tab}"]`);
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (btnActivo) btnActivo.classList.add('active');

        // Actualizar contenido
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
    }

    window.addEventListener('load', init);
    window.switchTab = switchTab;
    window.crearSesion = crearSesion;
    window.eliminarSesion = eliminarSesion;
    window.editarSesion = editarSesion;
    window.actualizarSesion = actualizarSesion;
    window.cancelarEdicion = cancelarEdicion;
    </script>
</body>
</html>
