<html lang="es">
<head>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .container { max-width: 760px; margin: 0 auto; padding: 24px 20px; }

        /* HEADER / PROGRESS */
        .top-bar {
            position: sticky;
            top: 0;
            background: var(--dark);
            border-bottom: 1px solid var(--dark-light);
            padding: 14px 20px;
            z-index: 100;
        }

        .top-bar-inner { max-width: 760px; margin: 0 auto; }

        .top-bar-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text);
        }

        .top-bar-title strong { color: var(--text-bright); }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: var(--dark-light);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.3s ease;
        }

        /* HERO / INTRO */
        .intro-hero { text-align: center; padding: 30px 0; }
        .intro-icon { font-size: 3.5rem; margin-bottom: 16px; }
        .intro-title { font-size: 1.8rem; font-weight: 700; color: var(--text-bright); margin-bottom: 12px; }
        .intro-subtitle { font-size: 1rem; color: var(--text); margin-bottom: 28px; }

        .info-box {
            background: var(--dark-light);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .info-box h3 { color: var(--text-bright); font-size: 1rem; margin-bottom: 10px; }
        .info-box ul { padding-left: 20px; color: var(--text); font-size: 0.92rem; }
        .info-box li { margin-bottom: 6px; }

        .resume-box {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* CARD SECTIONS */
        .card {
            background: var(--dark-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card h2 { font-size: 1.2rem; color: var(--text-bright); margin-bottom: 16px; }

        /* FORM FIELDS */
        .field-group { margin-bottom: 18px; }
        .field-group label {
            display: block;
            font-size: 0.88rem;
            color: var(--text);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .field-group input,
        .field-group textarea,
        .field-group select {
            width: 100%;
            padding: 12px 14px;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: var(--text-bright);
            font-size: 0.95rem;
            font-family: inherit;
        }

        .field-group input:focus,
        .field-group textarea:focus,
        .field-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .field-hint { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-top: 4px; }

        /* CERTIFICACIONES ACCORDION */
        .cert-accordion {
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        .cert-category {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .cert-category:last-child { border-bottom: none; }

        .cert-category summary {
            padding: 14px 16px;
            background: var(--dark);
            color: var(--text-bright);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .cert-category summary::-webkit-details-marker { display: none; }

        .cert-category summary::after {
            content: '▾';
            color: var(--primary);
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .cert-category[open] summary::after { content: '▴'; }

        .cert-count {
            background: var(--primary);
            color: white;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
            margin-right: 8px;
        }

        .cert-items {
            padding: 8px 16px 14px;
            background: rgba(0,0,0,0.15);
        }

        .cert-item-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
        }

        .cert-item-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
            accent-color: var(--primary);
        }

        .cert-items input[type="text"] {
            padding: 10px 12px;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            color: var(--text-bright);
            font-size: 0.85rem;
            font-family: inherit;
        }

        .cert-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .cert-chip {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .cert-empty-hint {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
            font-style: italic;
            margin-top: 10px;
        }

        /* ELEMENTO STEP */
        .elemento-header {
            background: linear-gradient(135deg, rgba(0,136,255,0.15), rgba(0,204,255,0.06));
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }

        .elemento-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .elemento-titulo { color: var(--text-bright); font-size: 1rem; line-height: 1.5; }

        .categoria-block { margin-bottom: 22px; }
        .categoria-title {
            font-size: 0.95rem;
            color: var(--accent);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
        }

        .grupo-block { margin-bottom: 16px; }
        .grupo-titulo {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 8px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--dark);
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid transparent;
        }

        .item-row.answered { border-color: rgba(0,255,136,0.2); }

        .item-text { font-size: 0.85rem; color: var(--text); flex: 1; }

        .item-toggle { display: flex; gap: 6px; flex-shrink: 0; }

        .toggle-btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active-si { background: var(--success); border-color: var(--success); color: var(--dark); }
        .toggle-btn.active-no { background: var(--danger); border-color: var(--danger); color: white; }

        .step-counter {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 16px;
            padding: 10px;
            background: var(--dark);
            border-radius: 8px;
        }

        .step-counter strong { color: var(--primary-light); }

        /* SIGNATURE */
        .signature-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .sig-tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .sig-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        #signatureCanvas {
            width: 100%;
            max-width: 500px;
            height: 160px;
            background: #fff;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.15);
            touch-action: none;
            display: block;
            margin: 0 auto 12px;
        }

        .clear-sig-btn {
            display: block;
            margin: 0 auto 16px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px;
            background: var(--dark);
            border-radius: 8px;
            margin-top: 12px;
        }

        .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
        .checkbox-row label { font-size: 0.85rem; color: var(--text); }

        /* RESULTADO */
        .resultado-hero { text-align: center; padding: 20px 0; }
        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 6px solid var(--primary);
        }
        .score-circle.high { border-color: var(--success); }
        .score-circle.low { border-color: var(--accent); }
        .score-percent { font-size: 2.2rem; font-weight: 700; color: var(--text-bright); }
        .score-label { font-size: 0.75rem; color: var(--text); }

        .recomendacion-box {
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        .recomendacion-box.evaluate { background: rgba(0,255,136,0.1); border: 1px solid var(--success); color: var(--success); }
        .recomendacion-box.assess { background: rgba(255,215,0,0.1); border: 1px solid var(--accent); color: var(--accent); }

        .download-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

        /* BUTTONS */
        .btn {
            padding: 15px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }

        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-secondary:hover { background: rgba(0,136,255,0.1); }

        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #20ba5a; transform: translateY(-2px); }

        .btn-full { width: 100%; }

        /* NAV BAR (bottom) */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark-light);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 14px 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            z-index: 100;
        }

        .nav-bar-inner { max-width: 760px; width: 100%; display: flex; gap: 12px; }
        .nav-bar .btn { flex: 1; }

        .whatsapp-note {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            text-align: center;
            margin-top: -6px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .item-row { flex-direction: column; align-items: flex-start; }
            .item-toggle { align-self: flex-end; }
            .intro-title { font-size: 1.4rem; }
            .score-circle { width: 130px; height: 130px; }
            .score-percent { font-size: 1.8rem; }
        }
    </style>
</head>

    const TOTAL_REACTIVOS = 142;

    /* =========================================================
       STATE
    ========================================================= */
    let currentStepIndex = 0; // 0=intro, 1=personal, 2-5=elementos 1-4, 6=firma, 7=resultado
    const STEPS = ['intro', 'personal', 'e1', 'e2', 'e3', 'e4', 'firma', 'resultado'];

    let personalData = { nombre: '', curp: '', domicilio: '', escolaridad: '', telefonoCasa: '', telefonoCelular: '', email: '', fecha: todayISO() };
    let selectedCertificaciones = [];
    let otraCertificacionText = '';
    let openCertCategories = new Set();
    let answers = {};
    let signatureMode = 'draw'; // 'draw' | 'type'
    let signatureDataUrl = null;
    let signatureTypedName = '';
    let triptychAccepted = false;
    let hasSignature = false;
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    /* =========================================================
       PERSISTENCE
    ========================================================= */
    function loadProgress() {
        try {
            const saved = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null');
            if (saved) {
                personalData = Object.assign(personalData, saved.personalData || {});
                selectedCertificaciones = saved.selectedCertificaciones || [];
                otraCertificacionText = saved.otraCertificacionText || '';
                answers = saved.answers || {};
                signatureDataUrl = saved.signatureDataUrl || null;
                signatureTypedName = saved.signatureTypedName || '';
                signatureMode = saved.signatureMode || 'draw';
                triptychAccepted = saved.triptychAccepted || false;
                hasSignature = !!signatureDataUrl;
                return true;
            }
        } catch (e) { console.warn('No se pudo cargar progreso previo'); }
        return false;
    }

    function saveProgress() {
        localStorage.setItem('autodiagnosticoData', JSON.stringify({
            personalData, selectedCertificaciones, otraCertificacionText, answers,
            signatureDataUrl, signatureTypedName, signatureMode, triptychAccepted
        }));
    }

    /* =========================================================
       SCORING
    ========================================================= */
    function calculateScore() {
        let si = 0, no = 0;
        Object.values(answers).forEach(v => { if (v === 'SI') si++; else if (v === 'NO') no++; });
        const percentage = Math.round((si / TOTAL_REACTIVOS) * 100);
        return { si, no, percentage, total: TOTAL_REACTIVOS };
    }

    function countAnsweredInElemento(elementoIdx) {
        const elemento = AUTODIAGNOSTICO_DATA[elementoIdx];
        let total = 0, answered = 0;
        elemento.categorias.forEach((cat, cIdx) => {
            cat.grupos.forEach((grupo, gIdx) => {
                grupo.items.forEach((item, iIdx) => {
                    total++;
                    const id = `e${elemento.elemento}_c${cIdx}_g${gIdx}_i${iIdx}`;
                    if (answers[id]) answered++;
                });
            });
        });
        return { total, answered };
    }

    /* =========================================================
       RENDER
    ========================================================= */
    function renderStep() {
        const app = document.getElementById('app');
        const step = STEPS[currentStepIndex];
        const navBar = document.getElementById('navBar');
        const topBarStep = document.getElementById('topBarStep');

        window.scrollTo(0, 0);

        if (step === 'intro') {
            navBar.style.display = 'none';
            topBarStep.textContent = 'Inicio';
            app.innerHTML = renderIntro();
        } else if (step === 'personal') {
            navBar.style.display = 'flex';
            topBarStep.textContent = 'Datos personales';
            app.innerHTML = renderPersonalForm();
            attachPersonalFormListeners();
        } else if (step.startsWith('e')) {
            const elementoIdx = parseInt(step.substring(1)) - 1;
            navBar.style.display = 'flex';
            topBarStep.textContent = `Elemento ${elementoIdx + 1} de 4`;
            app.innerHTML = renderElementoStep(elementoIdx);
        } else if (step === 'firma') {
            navBar.style.display = 'flex';
            topBarStep.textContent = 'Firma';
            app.innerHTML = renderFirmaStep();
            setTimeout(initSignatureCanvas, 50);
        } else if (step === 'resultado') {
            navBar.style.display = 'none';
            topBarStep.textContent = 'Resultado';
            app.innerHTML = renderResultado();
        }

        updateProgressBar();
        updateNavButtons();
    }

    function updateProgressBar() {
        const pct = Math.round((currentStepIndex / (STEPS.length - 1)) * 100);
        document.getElementById('progressBarFill').style.width = pct + '%';
    }

    function resumeDiagnostico() {
        for (let i = 1; i < STEPS.length - 1; i++) {
            if (!isStepValid(STEPS[i])) {
                currentStepIndex = i;
                renderStep();
                return;
            }
        }
        currentStepIndex = STEPS.length - 1;
        renderStep();
    }

    function restartDiagnostico() {
        if (!confirm('¿Seguro que quieres empezar de nuevo? Se borrará tu avance guardado.')) return;
        localStorage.removeItem('autodiagnosticoData');

        hasSignature = false;
        goNext();
    }

    /* =========================================================
       CERTIFICACIONES EC1375 - Selector acordeón
    ========================================================= */
    function renderCertAccordion() {
        let html = '<div class="cert-accordion">';
        CERTIFICACIONES_EC1375.forEach((cat, catIdx) => {
            const count = cat.items.filter(item => selectedCertificaciones.includes(item)).length;
            const isOpen = openCertCategories.has(catIdx);
            html += `
                <details class="cert-category" ${isOpen ? 'open' : ''} ontoggle="onCertDetailsToggle(${catIdx}, this)">
                    <summary>${cat.categoria} ${count > 0 ? `<span class="cert-count">${count}</span>` : ''}</summary>
                    <div class="cert-items">`;
            cat.items.forEach((item, itemIdx) => {
                const checked = selectedCertificaciones.includes(item);
                html += `
                        <label class="cert-item-row">
                            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCertificacion(${catIdx}, ${itemIdx})">
                            <span>${item}</span>
                        </label>`;
            });
            html += `</div></details>`;
        });
        html += `
                <details class="cert-category" ${openCertCategories.has('otra') ? 'open' : ''} ontoggle="onCertDetailsToggle('otra', this)">
                    <summary>🔹 Otra especialidad no listada</summary>
                    <div class="cert-items">
                        <input type="text" id="f_otraCertificacion" value="${escapeHtml(otraCertificacionText)}" placeholder="Escribe tu especialidad" oninput="updateOtraCertificacion(this.value)" style="width:100%;">
                    </div>
                </details>
            </div>`;
        return html;
    }

    function onCertDetailsToggle(catIdx, el) {
        if (el.open) openCertCategories.add(catIdx);
        else openCertCategories.delete(catIdx);
    }

    function toggleCertificacion(catIdx, itemIdx) {

    function initSignatureCanvas() {
        const canvas = document.getElementById('signatureCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';

        if (signatureDataUrl) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = signatureDataUrl;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            if (e.touches && e.touches.length) {
                return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
            }
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
        }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x; lastY = pos.y;
            hasSignature = true;
        }
        function stopDraw() {
            if (isDrawing) {
                isDrawing = false;
                signatureDataUrl = canvas.toDataURL('image/png');
                saveProgress();
                updateNavButtons();
            }
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);
    }

    function clearSignature() {
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        signatureDataUrl = null;
        hasSignature = false;
        saveProgress();
        updateNavButtons();
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */
    function isStepValid(step) {
        if (step === 'personal') {
            return personalData.nombre && personalData.curp && personalData.domicilio &&
                   personalData.escolaridad && personalData.telefonoCelular && personalData.email && personalData.fecha;
        }
        if (step.startsWith('e')) {
            const elementoIdx = parseInt(step.substring(1)) - 1;
            const progress = countAnsweredInElemento(elementoIdx);
            return progress.answered === progress.total;
        }
        if (step === 'firma') {
            const hasSig = signatureMode === 'draw' ? hasSignature : (signatureTypedName && signatureTypedName.trim().length > 3);
            return triptychAccepted && hasSig;
        }
        return true;
    }

    function updateNavButtons() {
        const btnBack = document.getElementById('btnBack');
        const btnNext = document.getElementById('btnNext');
        if (!btnBack || !btnNext) return;

        btnBack.style.visibility = currentStepIndex <= 1 ? 'hidden' : 'visible';

        const step = STEPS[currentStepIndex];
        const valid = isStepValid(step);
        btnNext.disabled = !valid;
        btnNext.textContent = step === 'firma' ? 'Ver mi resultado →' : 'Siguiente →';
    }

    function goNext() {
        const step = STEPS[currentStepIndex];
        if (!isStepValid(step)) return;
        if (currentStepIndex < STEPS.length - 1) {
            currentStepIndex++;
            renderStep();
        }
    }

    function goBack() {
        if (currentStepIndex > 0) {
            currentStepIndex--;
            renderStep();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function todayISO() {
        const d = new Date();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${d.getFullYear()}-${m}-${day}`;
    }

    /* =========================================================
       PDF GENERATION
    ========================================================= */
    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const pd = personalData;
        const score = calculateScore();

        doc.setFontSize(15);
        doc.setFont(undefined, 'bold');
        doc.text('AUTODIAGNÓSTICO EC1375', 105, 15, { align: 'center' });
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text('Prestación de servicios auxiliares en la contribución tradicional y complementaria de la', 105, 21, { align: 'center' });
        doc.text('recuperación de las condiciones físicas y socioemocionales de las personas.', 105, 26, { align: 'center' });

        doc.autoTable({
            startY: 32,
            theme: 'plain',
            styles: { fontSize: 9, cellPadding: 1.5 },
            body: [
                ['Nombre completo:', pd.nombre || ''],
                ['CURP:', pd.curp || ''],
                ['Domicilio:', pd.domicilio || ''],
                ['Último grado de estudios:', pd.escolaridad || ''],
                ['Teléfono:', pd.telefonoCelular || (pd.telefonoCasa || '')],
                ['Correo electrónico:', pd.email || ''],
                ['Fecha de aplicación:', pd.fecha || '']
            ]
        });

        let y = doc.lastAutoTable.finalY + 6;

        AUTODIAGNOSTICO_DATA.forEach(elemento => {
            if (y > 260) { doc.addPage(); y = 15; }
            doc.setFillColor(0, 136, 255);
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(11);
            doc.setFont(undefined, 'bold');
            doc.rect(14, y, 182, 8, 'F');
            doc.text(`ELEMENTO ${elemento.elemento} DE 4`, 17, y + 5.5);
            y += 11;
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(8.5);
            doc.setFont(undefined, 'italic');
            const lines = doc.splitTextToSize(elemento.titulo, 180);
            doc.text(lines, 14, y);
            y += lines.length * 3.8 + 3;

            elemento.categorias.forEach((categoria, cIdx) => {
                const rows = [];
                categoria.grupos.forEach((grupo, gIdx) => {
                    rows.push([{ content: grupo.titulo, colSpan: 3, styles: { fontStyle: 'bold', fillColor: [235, 235, 235], textColor: [0, 0, 0] } }]);
                    grupo.items.forEach((item, iIdx) => {
                        const id = `e${elemento.elemento}_c${cIdx}_g${gIdx}_i${iIdx}`;
                        const answer = answers[id];
                        rows.push([item, answer === 'SI' ? 'X' : '', answer === 'NO' ? 'X' : '']);
                    });
                });

                if (y > 270) { doc.addPage(); y = 15; }
                doc.autoTable({
                    startY: y,
                    head: [[categoria.tipo, 'SI', 'NO']],
                    body: rows,
                    styles: { fontSize: 7.5, cellPadding: 1.3 },
                    columnStyles: { 0: { cellWidth: 152 }, 1: { cellWidth: 15, halign: 'center' }, 2: { cellWidth: 15, halign: 'center' } },
                    headStyles: { fillColor: [15, 20, 40], textColor: [255, 255, 255] },
                    margin: { left: 14, right: 14 }
                });
                y = doc.lastAutoTable.finalY + 4;
            });
        });

        if (y > 240) { doc.addPage(); y = 15; }
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text('RESULTADO DEL AUTODIAGNÓSTICO', 14, y); y += 8;
        doc.setFontSize(10);
        doc.setFont(undefined, 'normal');
        doc.text(`Respuestas afirmativas (SI): ${score.si} de ${score.total}`, 14, y); y += 6;
        doc.text(`Respuestas negativas (NO): ${score.no} de ${score.total}`, 14, y); y += 6;
        doc.text(`Porcentaje obtenido: ${score.percentage}%`, 14, y); y += 6;
        doc.setFont(undefined, 'bold');
        doc.text(`Recomendación: ${score.percentage >= 90 ? 'PROCEDE A EVALUARSE' : 'SE SUGIERE ASESORARSE PREVIAMENTE'}`, 14, y);
        y += 12;

        doc.setFont(undefined, 'normal');
        doc.setFontSize(9);
        doc.text('Firma del candidato/a:', 14, y);
        if (signatureMode === 'draw' && signatureDataUrl) {
            doc.addImage(signatureDataUrl, 'PNG', 14, y + 3, 55, 20);
        } else if (signatureTypedName) {
            doc.setFont(undefined, 'italic');
            doc.setFontSize(13);
            doc.text(signatureTypedName, 14, y + 12);
        }

        const filename = `Autodiagnostico_EC1375_${(pd.nombre || 'candidato').replace(/\s+/g, '_')}.pdf`;
        doc.save(filename);
    }

        const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Autodiagnóstico EC1375</title></head><body>";
        const postHtml = "</body></html>";
        const fullHtml = preHtml + bodyHtml + postHtml;

        const blob = new Blob(['﻿', fullHtml], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');

        document.body.appendChild(a);
