<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Admin — Precios EC1375 - Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="flow-status.js"></script>
    <script src="crm-shell.js" data-crm-mode="admin" data-crm-page="admin-precios"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF;
            --accent: #FFD700; --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
            --border: rgba(255,255,255,0.12); --surface-2: rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 60px;
        }

        .container { max-width: 980px; margin: 0 auto; padding: 24px 20px; }
        .container.narrow { max-width: 420px; }
        .top-bar {
            position: sticky; top: 0; background: var(--dark); border-bottom: 1px solid var(--dark-light);
            padding: 16px 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar-inner { font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .top-bar a { color: var(--primary); font-size: 0.82rem; text-decoration: none; }

        .card { background: var(--dark-light); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; color: var(--text-bright); margin-bottom: 10px; }
        .hero { text-align: center; padding: 30px 0; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.5rem; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; }

        .blocked-box { background: rgba(255, 215, 0, 0.08); border: 1px solid var(--accent); border-radius: 12px; padding: 24px; text-align: center; }

        .field-group { margin-bottom: 14px; }
        .field-group label { display: block; font-size: 0.82rem; color: var(--text); margin-bottom: 5px; font-weight: 600; }
        .field-group input {
            width: 100%; padding: 11px 13px; background: var(--dark);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-bright); font-size: 0.9rem; font-family: inherit;
        }

        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 0.88rem; border: none; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-primary:disabled { background: var(--border); color: var(--text); cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
        .btn-small { padding: 4px 8px; font-size: 0.65rem; }
        .btn-full { width: 100%; }

        /* ===== LISTA DE CANDIDATOS (rediseñada 22 sep) =====
           Antes era una <table> de 11 columnas con scroll lateral: en
           celular había que arrastrar de lado para ver una fila completa, y
           en computadora tampoco cabía. Ahora es una rejilla que se adapta:

           · Cada FASE es UNA sola celda con sus tres cosas juntas —
             liberada (badge), precio y cobrado. Antes el precio vivía en una
             columna y su badge en otra ("Fases pagadas") al otro extremo de
             la fila: para saber si los $2,000 de Registro ya entraron había
             que cruzar la pantalla con la vista. Eso eliminó 4 columnas.
           · "Motivo" solo aparece cuando el estado lo pide (desistió /
             cambio de lote). En un candidato activo era una columna vacía.
           · En celular cada candidato es una TARJETA, no una fila. Cero
             scroll horizontal en ningún ancho. */

        .lista { display: flex; flex-direction: column; gap: 8px; }
        .lista-head {
            display: grid; gap: 8px; align-items: end; padding: 0 12px 6px;
            grid-template-columns: var(--cols);
            color: var(--primary-light); font-size: 0.6rem;
            text-transform: uppercase; letter-spacing: 0.3px; font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        .fila {
            display: grid; gap: 8px; align-items: start;
            grid-template-columns: var(--cols);
            padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface-2);
        }
        /* El estado tiñe la fila, pero con transparencias sobre el fondo del
           tema — no con hex oscuros fijos. Aquellos se veían como una banda
           negra encima del tema claro y dejaban los correos ilegibles. */
        .fila.e-activo       { background: color-mix(in srgb, var(--success) 9%, transparent); border-color: color-mix(in srgb, var(--success) 28%, transparent); }
        .fila.e-desistio     { background: color-mix(in srgb, var(--danger)  9%, transparent); border-color: color-mix(in srgb, var(--danger)  28%, transparent); }
        .fila.e-cambio_lote  { background: color-mix(in srgb, var(--accent)  10%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
        .fila.e-administrador{ background: color-mix(in srgb, var(--primary) 8%, transparent); border-color: color-mix(in srgb, var(--primary) 25%, transparent); }
        .fila.destacada      { outline: 2px solid var(--primary); }

        .cel-label { display: none; }          /* solo se usa en celular */
        .fase-box .cel-label { display: none !important; }  /* el badge ya dice el nombre de la fase */
        .nombre-cell { color: var(--text-bright); font-weight: 600; font-size: 0.82rem; min-width: 0; }
        .nombre-cell .email-sub { font-size: 0.72rem; color: var(--text); font-weight: 400; margin-top: 2px; word-break: break-all; }
        .nombre-cell input { width: 100%; margin-top: 4px; padding: 6px 8px; background: var(--dark); border: 1px solid var(--border); border-radius: 6px; color: var(--text-bright); font-size: 0.78rem; font-family: inherit; }

        /* --- bloque de una fase: badge + precio + cobrado --- */
        .fase-box { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .fase-box input { width: 100%; padding: 5px 6px; background: var(--dark); border: 1px solid var(--border); border-radius: 5px; color: var(--text-bright); font-size: 0.72rem; font-family: inherit; }
        .fase-box input.cobrado { border-color: color-mix(in srgb, var(--success) 45%, transparent); color: var(--success); }
        .fase-box input.cobrado.parcial { border-color: var(--accent); color: var(--accent); }
        .fase-box input:focus { border-color: var(--primary); outline: none; }

        .badge { font-size: 0.6rem; padding: 3px 5px; border-radius: 5px; font-weight: 700; border: 1px solid transparent; cursor: pointer; font-family: inherit; width: 100%; text-align: center; }
        .badge.on-mp { background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
        .badge.on-manual { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
        .badge.on-anticipo { background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
        .badge.off { background: var(--surface-2); color: var(--text); border-color: var(--border); opacity: 0.75; }
        .badge:hover { filter: brightness(1.15); }
        .badge:disabled { cursor: wait; opacity: 0.5; }

        .total-cell { color: var(--accent); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
        .meta-cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .meta-cell select, .meta-cell input { width: 100%; padding: 5px 6px; background: var(--dark); border: 1px solid var(--border); border-radius: 5px; color: var(--text-bright); font-size: 0.72rem; font-family: inherit; }
        .acciones-cell { display: flex; flex-direction: column; gap: 4px; }
        .btn-borrar { background: transparent; border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }
        .btn-borrar:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
        .row-status { font-size: 0.68rem; text-align: center; }
        .row-status.ok { color: var(--success); }
        .row-status.err { color: var(--danger); }
        .aviso-fila { color: var(--accent); font-weight: 400; font-size: 0.68rem; margin-top: 4px; }

        /* --- celular: cada candidato es una tarjeta --- */
        @media (max-width: 860px) {
            .lista-head { display: none; }
            .fila { grid-template-columns: 1fr 1fr; padding: 12px; gap: 10px; }
            .fila > .nombre-cell,
            .fila > .acciones-cell { grid-column: 1 / -1; }
            .acciones-cell { flex-direction: row; align-items: center; gap: 8px; }
            .acciones-cell .btn { flex: 1; }
            .cel-label { display: block; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--primary-light); font-weight: 700; margin-bottom: 2px; }
        }
        @media (max-width: 360px) {
            .fila { grid-template-columns: 1fr; }
        }

        .filtros { display: grid; grid-template-columns: 2fr 1fr 1fr 1.4fr; gap: 8px; margin-bottom: 12px; }
        .filtros input, .filtros select { padding: 8px; background: var(--dark); border: 1px solid var(--border); border-radius: 6px; color: var(--text-bright); font-size: 0.78rem; font-family: inherit; width: 100%; }
        @media (max-width: 700px) { .filtros { grid-template-columns: 1fr 1fr; } }

        .add-form { display: grid; grid-template-columns: 1.6fr 1.6fr repeat(4, 1fr) auto; gap: 8px; align-items: end; }
        @media (max-width: 800px) { .add-form { grid-template-columns: 1fr 1fr; } }
        .nombre-cell { color: var(--text-bright); font-weight: 600; }
        .nombre-cell .email-sub { font-size: 0.72rem; color: var(--text); font-weight: 400; margin-top: 2px; }
        .nombre-cell input { width: 100%; margin-top: 4px; padding: 6px 8px; background: var(--dark); border: 1px solid var(--border); border-radius: 6px; color: var(--text-bright); font-size: 0.78rem; font-family: inherit; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .stat-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
        .stat-card .n { font-size: 1.35rem; font-weight: 700; color: var(--text-bright); }
        .stat-card .l { font-size: 0.68rem; color: var(--text); text-transform: uppercase; margin-top: 2px; }
        .stat-card.ok .n { color: var(--success); }
        .stat-card.bad .n { color: var(--danger); }
        .stat-card.warn .n { color: var(--accent); }
        .stat-card.muted .n { color: var(--text); }
            body.crm-active .top-bar { display: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">💰 Admin — Precios EC1375</div>
        <div style="display:flex;gap:16px;">
            <a href="admin-index.html">🗂️ Índice</a>
            <a href="#" id="logoutLink" onclick="handleLogout()" style="display:none;">Cerrar sesión</a>
        </div>
    </div>
    <div class="container" id="app"></div>

    <script>
    const FASES = ['registro', 'alineacion', 'evaluacion', 'entrega'];
    const FASE_LABEL = { registro: 'Registro', alineacion: 'Alineación', evaluacion: 'Evaluación', entrega: 'Entrega' };
    /* El color de estado ya no se inyecta como hex: lo pone la clase
       .fila.e-<estado>, con transparencias sobre el fondo del tema. Los hex
       oscuros de antes (#1a4d2e y compañía) se veían como una banda negra
       encima del tema claro y dejaban los correos casi ilegibles. */

    /* Mismo valor que AdminData.ORIGEN_ANTICIPO y que el RPC
       autorizar_registro_inicial() (docs/sql/2026-09-20-...): fase abierta por
       la liga de registro, con un anticipo cuyo monto nadie ha capturado. */
    const ORIGEN_ANTICIPO = 'registro-50';
    /* Anchos de la rejilla: candidato · 4 fases · total · estado/lote · acciones.
       Las fases van en minmax(0,1fr) para que se encojan en vez de desbordar
       — con `1fr` a secas el contenido marca un mínimo y reaparece el scroll
       horizontal que esto vino a quitar. */
    const COLS = 'minmax(0,1.7fr) repeat(4, minmax(0,1fr)) minmax(0,0.7fr) minmax(0,0.9fr) minmax(0,0.75fr)';
    let candidatos = []; // filas de candidatos_precio
    let cobradoPorEmail = {}; // cobradoPorEmail[email][fase] = acumulado cobrado (o null)
    let pagosPorEmail = {}; // { email: Set(fases autorizadas) }
    let nombresAutoPorEmail = {}; // { email: nombre } — real, cruzado desde candidatos_ec1375 (ya hizo su Autodiagnóstico)
    let filtroEstado = ''; // '' = todos, 'activo', 'desistió', 'cambio_lote'
    let filtroBusqueda = ''; // búsqueda por email/nombre
    let filtroLote = '';     // '' = todos, o el número de lote
    let filtroPendiente = ''; // '' = todos | 'sin_cobrado' | 'sin_precio' | 'sin_liberar'
    let destacado = '';      // correo a resaltar (llega de ?alta=)

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    /* FUNCIÓN PURA (sin DOM ni red): recibe el estado de los filtros y
       devuelve las filas que pasan. Vive aparte para poder probarla —
       tests/admin-precios-filtros.test.js. `ctx` trae los índices que ya
       arma cargarDatos(): nombres cruzados, fases liberadas y cobrados. */
    function filtrar(filas, f, ctx) {
        const nombres = (ctx && ctx.nombres) || {};
        const pagos = (ctx && ctx.pagos) || {};
        const cobrado = (ctx && ctx.cobrado) || {};
        return filas.filter(c => {
            const email = (c.email || '').toLowerCase();
            const estado = c.estado || 'activo';

            if (f.estado && estado !== f.estado) return false;
            if (f.lote && String(c.lote || 1) !== String(f.lote)) return false;

            if (f.busqueda) {
                const q = String(f.busqueda).toLowerCase();
                const nombre = (nombres[c.email] || c.nombre || c.email || '').toLowerCase();
                if (!nombre.includes(q) && !email.includes(q)) return false;
            }

            if (f.pendiente) {
                const fases = pagos[c.email] || {};
                const cob = cobrado[c.email] || {};
                const liberadas = FASES.filter(fa => !!fases[fa]);
                if (f.pendiente === 'sin_precio') {
                    /* Nadie le ha capturado precio: o no tiene fila en
                       candidatos_precio, o la tiene con todo en cero. */
                    if (!c._sinPrecio && FASES.some(fa => Number(c['monto_' + fa]) > 0)) return false;
                } else if (f.pendiente === 'sin_cobrado') {
                    /* Tiene fases liberadas cuyo monto real nadie capturó. */
                    if (!liberadas.some(fa => cob[fa] === null || cob[fa] === undefined)) return false;
                } else if (f.pendiente === 'sin_liberar') {
                    if (liberadas.length > 0) return false;
                }
            }
            return true;
        });
    }

    function aplicarFiltros(filas) {
        return filtrar(filas,
            { estado: filtroEstado, busqueda: filtroBusqueda, lote: filtroLote, pendiente: filtroPendiente },
            { nombres: nombresAutoPorEmail, pagos: pagosPorEmail, cobrado: cobradoPorEmail });
    }

    /* Cuánto entró DE VERDAD de un candidato. Misma regla que
       AdminData.montoCobrado() — si las dos difieren, este panel y los KPIs
       dirían números distintos del mismo dinero, y no habría forma de saber
       cuál creer:
         · hay cifra capturada  → esa (es el dato duro);
         · fase abierta por la liga sin capturar → 0, no el precio de lista
           (sabemos que dejaron un anticipo, no cuánto);
         · liberada a mano o por Mercado Pago sin capturar → precio de lista.
           Si el equipo la liberó, es porque cobró esa fase.
       El caso a vigilar es 'registro' liberada a mano: son dos abonos de
       50%, así que ahí el precio de lista puede ser el doble de lo que
       entró. Para eso está el campo "cobrado". */
    function montoCobradoLocal(c) {
        const fases = pagosPorEmail[c.email] || {};
        const cob = cobradoPorEmail[c.email] || {};
        return FASES.reduce((total, f) => {
            if (!fases[f]) return total;
            const real = cob[f];
            if (typeof real === 'number' && isFinite(real) && real >= 0) return total + real;
            if (fases[f] === ORIGEN_ANTICIPO) return total;
            return total + (Number(c[`monto_${f}`]) || 0);
        }, 0);
    }

    function calcularEstadisticas(filas) {
        try {
            // "administrador" no cuenta en NADA (ni inscritos, ni ingresos, ni proyectado).
            const visibles = filas.filter(c => c.estado !== 'administrador');
            const administrador = filas.filter(c => c.estado === 'administrador');
            const activos = visibles.filter(c => (c.estado || 'activo') === 'activo');
            const desistieron = visibles.filter(c => c.estado === 'desistió');
            const cambioLote = visibles.filter(c => c.estado === 'cambio_lote');
            // Proyectado: solo lo que se espera cobrar de candidatos activos.
            const proyectado = activos.reduce((sum, c) => sum + (c.total_acordado || 0), 0);
            // Realizado: dinero YA cobrado, sin importar si después desistió o
            // cambió de lote — si pagó, ese ingreso ya ocurrió y cuenta.
            const realizado = visibles.reduce((sum, c) => sum + montoCobradoLocal(c), 0);
            return {
                activos: activos.length, desistieron: desistieron.length, cambioLote: cambioLote.length,
                administrador: administrador.length, proyectado, realizado
            };
        } catch (e) {
            console.error('Error calculando estadísticas:', e);
            return { activos: 0, desistieron: 0, cambioLote: 0, administrador: 0, proyectado: 0, realizado: 0 };
        }
    }

    function renderGateShell() {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="container narrow">
                <div class="hero"><div class="hero-icon">🔐</div><h1 class="hero-title">Panel de Precios</h1></div>
                <div class="card" id="adminGateContainer"></div>
            </div>`;
        Auth.renderAdminGate(document.getElementById('adminGateContainer'), { onVerified: boot });
    }

    async function handleLogout() {
        await Auth.signOut();
        window.location.reload();
    }

    async function cargarDatos() {
        const [precios, pagos, nombres] = await Promise.all([
            supabaseClient.from('candidatos_precio').select('*').order('email'),
            supabaseClient.from('candidatos_fase_pagos').select('email,fase,origen,monto'),
            supabaseClient.rpc('admin_lista_nombres')
        ]);
        candidatos = precios.data || [];
        // pagosPorEmail[email][fase] = 'mercadopago' | 'manual' | undefined (no liberada)
        pagosPorEmail = {};
        cobradoPorEmail = {};
        (pagos.data || []).forEach(row => {
            if (!pagosPorEmail[row.email]) { pagosPorEmail[row.email] = {}; cobradoPorEmail[row.email] = {}; }
            pagosPorEmail[row.email][row.fase] = row.origen || 'manual';
            /* Acumulado cobrado de esa fase. null = nadie lo capturó todavía. */
            cobradoPorEmail[row.email][row.fase] = (row.monto === null || row.monto === undefined || row.monto === '') ? null : Number(row.monto);
        });
        // Nombre real (candidato ya hizo su Autodiagnóstico) — manda sobre
        // cualquier nombre capturado a mano en candidatos_precio.nombre.
        // Si la función no existe todavía (SQL no corrido) falla en
        // silencio y el panel sigue funcionando solo con nombres manuales.
        nombresAutoPorEmail = {};
        if (!nombres.error) {
            (nombres.data || []).forEach(row => { nombresAutoPorEmail[row.email] = row.nombre; });
        } else {
            console.warn('No se pudo cargar nombres automáticos (¿falta correr add_nombres_admin_precios.sql?):', nombres.error);
        }
    }

    // Liberación/revocación manual con un clic — el origen 'mercadopago' solo
    // lo escribe el webhook (service_role, no pasa por aquí); esto solo
    // toca liberaciones manuales, aunque también puede revocar una que llegó
    // por Mercado Pago (p.ej. un pago que hay que anular).
    /* Captura cuánto se lleva COBRADO de una fase (acumulado, no el abono).
       El registro se paga en dos partes de 50%: tras la primera intervención
       aquí va 1000, tras la segunda 2000. De este número salen los ingresos
       reales (AdminData.montoCobrado); vacío = nadie lo capturó y se usa el
       precio de lista, salvo las fases abiertas por la liga de registro, que
       cuentan 0 hasta que alguien escriba la cifra. */
    async function guardarCobrado(email, fase, inputEl) {
        const crudo = (inputEl.value || '').trim();
        const monto = crudo === '' ? null : Number(crudo);
        if (monto !== null && (!isFinite(monto) || monto < 0)) {
            alert('Escribe un monto válido (o déjalo vacío).');
            inputEl.value = (cobradoPorEmail[email] || {})[fase] ?? '';
            return;
        }
        inputEl.disabled = true;
        try {
            const { error } = await supabaseClient.from('candidatos_fase_pagos')
                .update({ monto }).eq('email', email).eq('fase', fase);
            if (error) throw error;
            if (!cobradoPorEmail[email]) cobradoPorEmail[email] = {};
            cobradoPorEmail[email][fase] = monto;
            renderPanel();
        } catch (e) {
            console.error(e);
            /* Si RLS no deja actualizar esta tabla, hay que verlo de inmediato:
               en silencio el equipo creería haber capturado el cobro. */
            alert('No se pudo guardar el monto cobrado. Revisa la consola; puede faltar el permiso de UPDATE sobre candidatos_fase_pagos (ver docs/sql/2026-09-20-autorizar-registro-inicial.sql).');
            inputEl.disabled = false;
            inputEl.value = (cobradoPorEmail[email] || {})[fase] ?? '';
        }
    }

    async function toggleFase(email, fase, badgeEl) {
        const origen = (pagosPorEmail[email] || {})[fase];
        const liberada = !!origen;
        if (liberada) {
            const motivo = origen === 'mercadopago' ? ' (llegó por Mercado Pago)' : ' (liberada a mano)';
            if (!confirm(`¿Revocar la fase "${FASE_LABEL[fase]}" para ${email}${motivo}?`)) return;
        } else {
            if (!confirm(`¿Liberar manualmente la fase "${FASE_LABEL[fase]}" para ${email}?`)) return;
        }
        badgeEl.disabled = true;
        try {
            if (liberada) {
                const { error } = await supabaseClient.from('candidatos_fase_pagos')
                    .delete().eq('email', email).eq('fase', fase);
                if (error) throw error;
                delete pagosPorEmail[email][fase];
            } else {
                const { error } = await supabaseClient.from('candidatos_fase_pagos')
                    .insert({ email, fase, origen: 'manual' });
                if (error) throw error;
                if (!pagosPorEmail[email]) pagosPorEmail[email] = {};
                pagosPorEmail[email][fase] = 'manual';
            }
            renderPanel();
        } catch (e) {
            console.error(e);
            alert('No se pudo actualizar. Revisa la consola.');
            badgeEl.disabled = false;
        }
    }

    /* ---------- Borrar ----------
       Tres tablas distintas guardan pedazos de una persona, y RLS puede
       dejar borrar en unas y no en otras. Por eso cada delete lleva
       .select(): PostgREST devuelve las filas que DE VERDAD se borraron, y
       si una política lo impide el resultado llega vacío SIN error — sin
       esto el panel diría "borrado" y al recargar la persona seguiría ahí.

       La cuenta de Supabase Auth NO se puede borrar desde el navegador
       (hace falta la service_role). Se dice, no se esconde: si no, el
       correo quedaría "ocupado" y nadie entendería por qué. */
    async function borrarCandidato(email) {
        const nombre = nombresAutoPorEmail[email] || email;
        const tienePrecio = candidatos.some(c => c.email === email);
        const fases = Object.keys(pagosPorEmail[email] || {});
        const detalle = [
            tienePrecio ? '· sus precios, lote y estado (Precios y pagos)' : null,
            fases.length ? `· sus ${fases.length} fase(s) liberada(s) — PIERDE EL ACCESO al contenido` : null,
            '· su avance del flujo (Autodiagnóstico, documentos, evidencias)'
        ].filter(Boolean).join('\n');
        if (!confirm(`¿Borrar a ${nombre}?\n\n${detalle}\n\nEsto NO se puede deshacer.`)) return;
        if (!confirm(`Confirma otra vez: se borra TODO el expediente de ${email}.`)) return;

        const hecho = [];
        const fallo = [];
        try {
            if (tienePrecio) {
                const { data, error } = await supabaseClient.from('candidatos_precio')
                    .delete().eq('email', email).select();
                if (error) throw error;
                (data && data.length) ? hecho.push('precios') : fallo.push('candidatos_precio');
            }
            if (fases.length) {
                const { data, error } = await supabaseClient.from('candidatos_fase_pagos')
                    .delete().eq('email', email).select();
                if (error) throw error;
                (data && data.length) ? hecho.push('fases liberadas') : fallo.push('candidatos_fase_pagos');
            }
            /* El avance vive en candidatos_ec1375, que no tiene columna de
               correo: se localiza por user_id vía el RPC de admin. Si ese
               RPC no existe, se avisa en vez de dar por hecho el borrado. */
            const { data: borradoFlujo, error: errFlujo } =
                await supabaseClient.rpc('admin_borrar_candidato', { correo: email });
            if (errFlujo) fallo.push('avance del flujo (falta el RPC admin_borrar_candidato)');
            else if (borradoFlujo) hecho.push('avance del flujo');

            await cargarDatos();
            renderPanel();
            if (fallo.length) {
                alert(`Se borró: ${hecho.join(', ') || 'nada'}.\n\nNO se pudo borrar: ${fallo.join(', ')}.\nFalta el permiso o la función en Supabase (ver docs/sql/2026-09-22-borrar-candidato.sql).`);
            } else {
                alert(`Listo: ${nombre} quedó borrado.\n\nSu cuenta de acceso (correo y contraseña) sigue existiendo en Supabase → Authentication → Users; bórrala ahí si quieres liberar el correo.`);
            }
        } catch (e) {
            console.error(e);
            alert('No se pudo borrar: ' + (e.message || e) + '\n\nNo se borró nada a medias que el panel no te esté mostrando: recarga para ver el estado real.');
        }
    }

    /* El campo "Motivo" solo aparece donde significa algo (desistió /
       cambio de lote). Se enseña y se esconde EN EL SITIO, sin re-pintar el
       panel: un re-pintado completo borraría lo que otras filas tengan
       tecleado y todavía sin guardar. */
    function mostrarMotivoSiHaceFalta(prefix, selectEl) {
        const motivo = document.getElementById(prefix + '_motivo');
        if (!motivo) return;
        const v = selectEl.value;
        motivo.hidden = !(v === 'desistió' || v === 'cambio_lote');
    }

    function calcularTotal(prefix) {
        let total = 0;
        FASES.forEach(fase => {
            const el = document.getElementById(`${prefix}_${fase}`);
            total += Number(el && el.value ? el.value : 0);
        });
        const totalEl = document.getElementById(`${prefix}_total`);
        if (totalEl) totalEl.textContent = `$${total.toLocaleString('es-MX')}`;
        return total;
    }

    async function guardarFila(email) {
        const prefix = `row_${btoa(email).replace(/=/g, '')}`;
        const montos = {};
        FASES.forEach(fase => {
            const el = document.getElementById(`${prefix}_${fase}`);
            montos[`monto_${fase}`] = el.value === '' ? null : Number(el.value);
        });
        const total = FASES.reduce((sum, fase) => sum + (montos[`monto_${fase}`] || 0), 0);
        const estadoEl = document.getElementById(`${prefix}_estado`);
        const loteEl = document.getElementById(`${prefix}_lote`);
        const motivoEl = document.getElementById(`${prefix}_motivo`);
        const statusEl = document.getElementById(`${prefix}_status`);
        // El input de nombre manual solo existe en el DOM cuando ese
        // candidato no tiene todavía un nombre "real" auto-cruzado.
        const nombreEl = document.getElementById(`${prefix}_nombre`);
        const row = { email, total_acordado: total, ...montos, updated_at: new Date().toISOString() };
        if (nombreEl) row.nombre = nombreEl.value.trim() || null;
        if (estadoEl) row.estado = estadoEl.value || 'activo';
        if (loteEl) row.lote = Number(loteEl.value) || 1;
        if (motivoEl && motivoEl.value.trim()) row.motivo_cambio = motivoEl.value.trim();
        try {
            const { error } = await supabaseClient
                .from('candidatos_precio')
                .upsert(row, { onConflict: 'email' });
            if (error) throw error;
            if (statusEl) { statusEl.textContent = '✅ Guardado'; statusEl.className = 'row-status ok'; }
        } catch (e) {
            console.error(e);
            if (statusEl) { statusEl.textContent = '❌ Error al guardar'; statusEl.className = 'row-status err'; }
        }
    }

    async function agregarCandidato() {
        const email = (document.getElementById('newEmail').value || '').trim().toLowerCase();
        if (!email || !email.includes('@')) { alert('Escribe un correo válido.'); return; }
        const nombre = (document.getElementById('newNombre').value || '').trim();
        const estado = (document.getElementById('newEstado').value || 'activo');
        const lote = Number(document.getElementById('newLote').value || 1);
        const montos = {};
        FASES.forEach(fase => { montos[`monto_${fase}`] = Number(document.getElementById(`newMonto_${fase}`).value || 0); });
        const total = FASES.reduce((sum, fase) => sum + montos[`monto_${fase}`], 0);
        try {
            const { error } = await supabaseClient
                .from('candidatos_precio')
                .upsert({ email, nombre: nombre || null, total_acordado: total, estado, lote, ...montos }, { onConflict: 'email' });
            if (error) throw error;
            await cargarDatos();
            renderPanel();
        } catch (e) {
            console.error(e);
            alert('No se pudo agregar el candidato. Revisa la consola.');
        }
    }

    function renderPanel() {
        const app = document.getElementById('app');
        // Un candidato puede tener fases pagadas/liberadas (candidatos_fase_pagos,
        // incluido lo que llega solo del webhook de Mercado Pago) antes de que
        // nadie lo haya dado de alta en candidatos_precio — se le arma una fila
        // "sin precio capturado" para que no desaparezca del panel (monitoreo).
        const emailsConPagoSinPrecio = Object.keys(pagosPorEmail)
            .filter(email => !candidatos.some(c => c.email === email))
            .sort();
        const filasOriginales = candidatos.concat(emailsConPagoSinPrecio.map(email => ({ email, _sinPrecio: true })));
        const filas = aplicarFiltros(filasOriginales);
        const stats = calcularEstadisticas(filasOriginales);
        const lotesDisponibles = [...new Set(filasOriginales.map(c => c.lote || 1))].sort((a, b) => a - b);
        const rowsHtml = filas.map(c => {
            const prefix = `row_${btoa(c.email).replace(/=/g, '')}`;
            const fasesOrigen = pagosPorEmail[c.email] || {};
            /* Cada fase es UN bloque: si está liberada (y por quién), cuánto
               se acordó y cuánto entró de verdad. Antes el precio y su badge
               vivían en columnas opuestas de la fila. */
            const faseBoxes = FASES.map(fase => {
                const origen = fasesOrigen[fase];
                const anticipo = origen === ORIGEN_ANTICIPO;
                const cls = origen === 'mercadopago' ? 'on-mp' : anticipo ? 'on-anticipo' : (origen ? 'on-manual' : 'off');
                const marca = origen === 'mercadopago' ? '💳' : anticipo ? '🪪' : (origen ? '✋' : '—');
                const title = origen === 'mercadopago' ? 'Pagada por Mercado Pago — clic para revocar'
                    : anticipo ? 'Abierta sola al registrarse (anticipo) — falta capturar el monto real; clic para revocar'
                    : origen ? 'Liberada a mano — clic para revocar'
                    : 'No liberada — clic para liberar manualmente';
                const liberada = !!origen;
                const cobrado = (cobradoPorEmail[c.email] || {})[fase];
                const precio = Number(c[`monto_${fase}`]) || 0;
                const falta = liberada && typeof cobrado === 'number' && cobrado < precio;
                return `<div class="fase-box">
                    <div class="cel-label">${FASE_LABEL[fase]}</div>
                    <button type="button" class="badge ${cls}" title="${title}" onclick="toggleFase('${c.email}','${fase}',this)">${marca} ${FASE_LABEL[fase]}</button>
                    <input type="number" id="${prefix}_${fase}" value="${c[`monto_${fase}`] ?? ''}" placeholder="precio" oninput="calcularTotal('${prefix}')" title="Precio acordado de ${FASE_LABEL[fase]}">
                    ${liberada ? `<input type="number" class="cobrado${falta ? ' parcial' : ''}" value="${cobrado ?? ''}" placeholder="cobrado"
                        title="Cuánto se lleva COBRADO de ${FASE_LABEL[fase]} (acumulado). Vacío = nadie lo ha capturado y se cuenta el precio de lista."
                        onchange="guardarCobrado('${c.email}','${fase}',this)">` : ''}
                </div>`;
            }).join('');
            const nombreAuto = nombresAutoPorEmail[c.email];
            const nombreCell = nombreAuto
                ? `<div class="nombre-cell">${escapeHtml(nombreAuto)}<div class="email-sub">${escapeHtml(c.email)}</div>`
                : `<div class="nombre-cell"><div class="email-sub" style="margin-top:0;">${escapeHtml(c.email)}</div>
                     <input type="text" id="${prefix}_nombre" placeholder="Nombre (aún sin Autodiagnóstico)" value="${escapeHtml(c.nombre || '')}">`;
            const estadoActual = c.estado || 'activo';
            const loteActual = c.lote || 1;
            const motivoActual = c.motivo_cambio || '';
            /* "Motivo" solo donde significa algo: en un activo era una
               columna vacía ocupando ancho en las 26 filas. */
            const pideMotivo = estadoActual === 'desistió' || estadoActual === 'cambio_lote';
            const claseEstado = 'e-' + estadoActual.replace('ó', 'o');
            const resaltar = destacado && c.email.toLowerCase() === destacado ? ' destacada' : '';
            return `
                <div class="fila ${claseEstado}${resaltar}">
                    ${nombreCell}${c._sinPrecio ? '<div class="aviso-fila">Sin precio capturado — escribe sus montos y Guardar para darlo de alta</div>' : ''}</div>
                    ${faseBoxes}
                    <div><div class="cel-label">Total</div><span class="total-cell" id="${prefix}_total">$${Number(c.total_acordado || 0).toLocaleString('es-MX')}</span></div>
                    <div class="meta-cell">
                        <div class="cel-label">Estado y lote</div>
                        <select id="${prefix}_estado" onchange="mostrarMotivoSiHaceFalta('${prefix}', this)">
                            <option value="activo" ${estadoActual === 'activo' ? 'selected' : ''}>Activo</option>
                            <option value="desistió" ${estadoActual === 'desistió' ? 'selected' : ''}>Desistió</option>
                            <option value="cambio_lote" ${estadoActual === 'cambio_lote' ? 'selected' : ''}>Cambio de lote</option>
                            <option value="administrador" ${estadoActual === 'administrador' ? 'selected' : ''}>Administrador</option>
                        </select>
                        <input type="number" id="${prefix}_lote" min="1" max="10" value="${loteActual}" title="Lote">
                        <input type="text" id="${prefix}_motivo" placeholder="Motivo del cambio" value="${escapeHtml(motivoActual)}" ${pideMotivo ? '' : 'hidden'}>
                    </div>
                    <div class="acciones-cell">
                        <button class="btn btn-primary btn-small" onclick="guardarFila('${c.email}')">Guardar</button>
                        <button class="btn btn-small btn-borrar" onclick="borrarCandidato('${c.email}')" title="Borrar a esta persona y todo su expediente">Borrar</button>
                        <span class="row-status" id="${prefix}_status"></span>
                    </div>
                </div>`;
        }).join('');

        const addFormFields = FASES.map(fase => `
            <div class="field-group"><label>${FASE_LABEL[fase]}</label><input type="number" id="newMonto_${fase}" placeholder="0"></div>
        `).join('');

        app.innerHTML = `
            <div class="card">
                <h2>📊 Estadísticas</h2>
                <div class="stats-grid">
                    <div class="stat-card ok"><div class="n">${stats.activos}</div><div class="l">Activos</div></div>
                    <div class="stat-card bad"><div class="n">${stats.desistieron}</div><div class="l">Desistieron</div></div>
                    <div class="stat-card warn"><div class="n">${stats.cambioLote}</div><div class="l">Cambio de lote</div></div>
                    <div class="stat-card muted"><div class="n">${stats.administrador}</div><div class="l">Administrador</div></div>
                    <div class="stat-card"><div class="n">$${stats.proyectado.toLocaleString('es-MX')}</div><div class="l">Proyectado</div></div>
                    <div class="stat-card ok"><div class="n">$${stats.realizado.toLocaleString('es-MX')}</div><div class="l">Realizado</div></div>
                </div>
                <p style="font-size:0.72rem;color:var(--text);margin-top:10px;">
                    "Realizado" incluye pagos de candidatos que ya desistieron o cambiaron de lote (el dinero ya se cobró) · "Proyectado" solo considera activos · "Administrador" no se contempla en ninguna suma.
                </p>
            </div>
            <div class="card">
                <h2>➕ Agregar candidato</h2>
                <div class="add-form">
                    <div class="field-group"><label>Correo</label><input type="email" id="newEmail" placeholder="correo@ejemplo.com"></div>
                    <div class="field-group"><label>Nombre</label><input type="text" id="newNombre" placeholder="Nombre completo"></div>
                    ${addFormFields}
                    <div class="field-group"><label>Estado</label><select id="newEstado" style="width:100%;padding:11px 13px;background:var(--dark);border:1px solid var(--border);border-radius:8px;color:var(--text-bright);font-size:0.9rem;">
                        <option value="activo">Activo</option>
                        <option value="desistió">Desistió</option>
                        <option value="cambio_lote">Cambio de lote</option>
                        <option value="administrador">Administrador</option>
                    </select></div>
                    <div class="field-group"><label>Lote</label><input type="number" id="newLote" placeholder="1" value="1" min="1" max="10"></div>
                    <button class="btn btn-primary" onclick="agregarCandidato()">Agregar</button>
                </div>
            </div>
            <div class="card">
                <h2>💰 Candidatos (${filas.length}${filas.length !== filasOriginales.length ? ` de ${filasOriginales.length}` : ''})</h2>
                <div class="filtros">
                    <input type="text" id="filtroBusqueda" placeholder="🔍 Buscar nombre o correo..." value="${escapeHtml(filtroBusqueda)}"
                           oninput="filtroBusqueda = this.value; renderPanel(); const i = document.getElementById('filtroBusqueda'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }">
                    <select id="filtroEstado" onchange="filtroEstado = this.value; renderPanel()">
                        <option value="">Todos los estados</option>
                        <option value="activo" ${filtroEstado === 'activo' ? 'selected' : ''}>Activo</option>
                        <option value="desistió" ${filtroEstado === 'desistió' ? 'selected' : ''}>Desistió</option>
                        <option value="cambio_lote" ${filtroEstado === 'cambio_lote' ? 'selected' : ''}>Cambio de lote</option>
                        <option value="administrador" ${filtroEstado === 'administrador' ? 'selected' : ''}>Administrador</option>
                    </select>
                    <select id="filtroLote" onchange="filtroLote = this.value; renderPanel()">
                        <option value="">Todos los lotes</option>
                        ${lotesDisponibles.map(l => `<option value="${l}" ${String(filtroLote) === String(l) ? 'selected' : ''}>Lote ${l}</option>`).join('')}
                    </select>
                    <select id="filtroPendiente" onchange="filtroPendiente = this.value; renderPanel()">
                        <option value="">Sin filtro de pendientes</option>
                        <option value="sin_cobrado" ${filtroPendiente === 'sin_cobrado' ? 'selected' : ''}>Falta capturar lo cobrado</option>
                        <option value="sin_precio" ${filtroPendiente === 'sin_precio' ? 'selected' : ''}>Sin precio capturado</option>
                        <option value="sin_liberar" ${filtroPendiente === 'sin_liberar' ? 'selected' : ''}>Sin ninguna fase liberada</option>
                    </select>
                </div>

                <p style="font-size:0.75rem;color:var(--text);margin-bottom:14px;">
                    En cada fase: <strong>💳</strong> pagada por Mercado Pago · <strong>✋</strong> liberada a mano · <strong>🪪</strong> abierta sola al registrarse · <strong>—</strong> no liberada. Clic en la fase para liberarla o revocarla.<br>
                    Debajo va el <strong>precio</strong> y, si ya está liberada, lo <strong>cobrado</strong> de verdad (acumulado): el registro se paga en dos abonos de 50%, así que tras la primera intervención va <strong>1000</strong> y tras la segunda <strong>2000</strong>. En <span style="color:var(--accent);">ámbar</span> mientras falte, en <span style="color:var(--success);">verde</span> cuando esté completo.
                </p>
                <div class="lista" style="--cols: ${COLS};">
                    <div class="lista-head" style="--cols: ${COLS};">
                        <div>Candidato</div>${FASES.map(f => `<div>${FASE_LABEL[f]}</div>`).join('')}<div>Total</div><div>Estado / Lote</div><div></div>
                    </div>
                    ${rowsHtml || '<p style="text-align:center;color:var(--text);padding:20px;">Ningún candidato coincide con estos filtros.</p>'}
                </div>
            </div>
        `;
        document.getElementById('logoutLink').style.display = 'inline';
    }

    async function boot() {
        const app = document.getElementById('app');
        app.innerHTML = `<div class="container narrow"><p style="text-align:center;margin-top:60px;">Cargando...</p></div>`;
        await cargarDatos();
        renderPanel();
        precargarAlta();
    }

    /* Llegó desde admin-candidatos.html con ?alta=<correo>&nombre=<nombre>:
       alguien se registró por la liga (registro.html) y falta capturarle sus
       datos financieros. Se deja el formulario de alta listo y enfocado en el
       primer monto, para que el admin solo teclee cifras. Si ese correo YA
       está dado de alta, no se prellena nada: se le avisa y se resalta su
       fila, que es lo que en realidad quiere ver. */
    function precargarAlta() {
        const params = new URLSearchParams(location.search);
        const email = (params.get('alta') || '').trim().toLowerCase();
        if (!email) return;
        const form = document.querySelector('.add-form');
        if (!form) return;
        if (candidatos.some(c => (c.email || '').toLowerCase() === email)) {
            filtroBusqueda = email;
            destacado = email;
            renderPanel();
            const aviso = document.createElement('p');
            aviso.style.cssText = 'font-size:0.8rem;color:var(--success);margin-top:10px;';
            aviso.textContent = email + ' ya está dado de alta — aquí abajo puedes ajustar sus montos.';
            document.querySelector('.add-form').after(aviso);
            return;
        }
        document.getElementById('newEmail').value = email;
        const nombre = (params.get('nombre') || '').trim();
        if (nombre) document.getElementById('newNombre').value = nombre;
        form.scrollIntoView({ block: 'center' });
        const primerMonto = document.getElementById('newMonto_' + FASES[0]);
        if (primerMonto) primerMonto.focus();
    }

    window.addEventListener('load', async () => {
        try {
            const session = await Auth.getSession();
            if (session) {
                const esAdmin = await Auth.isAdmin(session.user.email);
                if (esAdmin) { boot(); return; }
                await Auth.signOut();
            }
            renderGateShell();
        } catch (e) {
            console.error('Error al iniciar el panel:', e);
            document.getElementById('app').innerHTML = `
                <div class="container narrow">
                    <div class="hero"><div class="hero-icon">⚠️</div><h1 class="hero-title">Algo salió mal</h1></div>
                    <div class="blocked-box"><p>No pudimos cargar el panel. Recarga la página.</p></div>
                </div>`;
        }
    });
    </script>
</body>
</html>
