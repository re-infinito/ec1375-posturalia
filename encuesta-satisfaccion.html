<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción EC1375 - Posturalia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF;
            --accent: #FFD700; --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 60px;
        }

        .container { max-width: 760px; margin: 0 auto; padding: 24px 20px; }
        .top-bar { position: sticky; top: 0; background: var(--dark); border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100; }
        .top-bar-inner { max-width: 760px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }

        .card { background: var(--dark-light); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 1.15rem; color: var(--text-bright); margin-bottom: 14px; }
        .card p.desc { font-size: 0.88rem; color: var(--text); margin-bottom: 16px; }

        .hero { text-align: center; padding: 20px 0 30px; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.7rem; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.98rem; color: var(--text); }

        .blocked-box { background: rgba(255, 215, 0, 0.08); border: 1px solid var(--accent); border-radius: 12px; padding: 28px; text-align: center; }
        .blocked-box p { color: var(--text); margin-bottom: 18px; }

        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.85rem; color: var(--text); margin-bottom: 6px; font-weight: 600; }
        .field-group input, .field-group textarea {
            width: 100%; padding: 12px 14px; background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            color: var(--text-bright); font-size: 0.92rem; font-family: inherit;
        }

        .likert-item { padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .likert-item:last-child { border-bottom: none; }
        .likert-question { font-size: 0.9rem; color: var(--text-bright); margin-bottom: 12px; font-weight: 600; }
        .likert-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .likert-btn {
            padding: 9px 4px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);
            background: var(--dark); color: var(--text); font-size: 0.68rem; font-weight: 600;
            cursor: pointer; text-align: center; line-height: 1.25;
        }
        .likert-btn.active-neg { background: var(--danger); border-color: var(--danger); color: white; }
        .likert-btn.active-mid { background: var(--accent); border-color: var(--accent); color: var(--dark); }
        .likert-btn.active-pos { background: var(--success); border-color: var(--success); color: var(--dark); }

        .signature-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .sig-tab-btn { flex: 1; padding: 10px; background: var(--dark); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer; }
        .sig-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        #signatureCanvas { width: 100%; max-width: 500px; height: 150px; background: #fff; border-radius: 8px; border: 2px solid rgba(255,255,255,0.15); touch-action: none; display: block; margin: 0 auto 12px; }
        .clear-sig-btn { display: block; margin: 0 auto 16px; padding: 8px 16px; background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

        .btn { padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #20ba5a; transform: translateY(-2px); }
        .btn-full { width: 100%; margin-bottom: 12px; }

        .success-box { background: rgba(0,255,136,0.08); border: 1px solid var(--success); border-radius: 12px; padding: 24px; text-align: center; }
        .success-box h3 { color: var(--success); margin-bottom: 10px; }

        @media (max-width: 600px) {
            .likert-options { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">📝 Encuesta de Satisfacción</div></div>
    <div class="container" id="app"></div>

    <script>
    const PREGUNTAS = [
        '¿La presentación del Estándar de Competencia y la aplicación del diagnóstico fue realizada sin costo para usted?',
        '¿La información proporcionada fue suficiente para iniciar sin dudas su proceso de evaluación?',
        '¿Recibió un trato digno y respetuoso durante las etapas del proceso de evaluación?',
        '¿Fue condicionado/a a tomar un curso de capacitación previo a la evaluación?',
        '¿Le presentaron, explicaron y acordaron el Plan de Evaluación previo a la evaluación?',
        '¿Recibió retroalimentación detallada de las etapas y resultados de su evaluación?',
        '¿El evaluador atendió todas sus dudas?',
        '¿En caso de haber resultado competente, le informaron los tiempos de entrega del certificado?'
    ];
    const ESCALA = [
        { valor: 'Totalmente en desacuerdo', clase: 'active-neg' },
        { valor: 'Parcialmente en desacuerdo', clase: 'active-neg' },
        { valor: 'De acuerdo', clase: 'active-mid' },
        { valor: 'Muy de acuerdo', clase: 'active-pos' }
    ];

    let respuestas = {};
    let comentarios = '';
    let signatureMode = 'draw';
    let signatureDataUrl = null;
    let signatureTypedName = '';
    let hasSignature = false;
    let isDrawing = false, lastX = 0, lastY = 0;
    let generated = false;

    function loadAutodiagnosticoResult() {
        try {
            const saved = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null');
            if (!saved || !saved.personalData || !saved.personalData.nombre) return null;
            return { personalData: saved.personalData };
        } catch (e) { return null; }
    }

    function loadProgress() {
        try {
            const saved = JSON.parse(localStorage.getItem('encuestaSatisfaccionData') || 'null');
            if (saved) {
                respuestas = saved.respuestas || {};
                comentarios = saved.comentarios || '';
                signatureDataUrl = saved.signatureDataUrl || null;
                signatureTypedName = saved.signatureTypedName || '';
                signatureMode = saved.signatureMode || 'draw';
                hasSignature = !!signatureDataUrl;
            }
        } catch (e) {}
    }

    function saveProgress() {
        localStorage.setItem('encuestaSatisfaccionData', JSON.stringify({ respuestas, comentarios, signatureDataUrl, signatureTypedName, signatureMode }));
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function render() {
        const app = document.getElementById('app');
        const result = loadAutodiagnosticoResult();

        if (!result) {
            app.innerHTML = `
                <div class="hero">
                    <div class="hero-icon">📝</div>
                    <h1 class="hero-title">Encuesta de Satisfacción</h1>
                    <p class="hero-subtitle">Tu opinión es muy importante</p>
                </div>
                <div class="blocked-box">
                    <p><strong>Primero necesitas completar tu Autodiagnóstico</strong><br>Esto nos permite identificarte para tu encuesta.</p>
                    <a href="autodiagnostico.html" class="btn btn-primary">📋 Ir al Autodiagnóstico</a>
                </div>`;
            return;
        }

        if (generated) { renderGeneratedState(app, result); return; }

        app.innerHTML = `
            <div class="hero">
                <div class="hero-icon">📝</div>
                <h1 class="hero-title">Encuesta de Satisfacción</h1>
                <p class="hero-subtitle">Su opinión es muy importante para mejorar nuestro servicio</p>
            </div>

            <div class="card">
                <h2>Conteste marcando la opción que considere adecuada</h2>
                ${PREGUNTAS.map((p, idx) => `
                    <div class="likert-item">
                        <div class="likert-question">${idx + 1}. ${p}</div>
                        <div class="likert-options">
                            ${ESCALA.map(e => `<button class="likert-btn ${respuestas[idx] === e.valor ? e.clase : ''}" onclick="setRespuesta(${idx}, '${e.valor.replace(/'/g, "\\'")}', this)">${e.valor}</button>`).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>

            <div class="card">
                <h2>💬 Comentarios y/o sugerencias</h2>
                <div class="field-group">
                    <textarea id="f_comentarios" rows="3" placeholder="Opcional">${escapeHtml(comentarios)}</textarea>
                </div>
            </div>

            <div class="card">
                <h2>✍️ Firma</h2>
                <div class="signature-tabs">
                    <button class="sig-tab-btn ${signatureMode === 'draw' ? 'active' : ''}" onclick="setSignatureMode('draw')">✍️ Dibujar firma</button>
                    <button class="sig-tab-btn ${signatureMode === 'type' ? 'active' : ''}" onclick="setSignatureMode('type')">⌨️ Escribir mi nombre</button>
                </div>
                <div id="signaturePad" style="${signatureMode === 'draw' ? '' : 'display:none;'}">
                    <canvas id="signatureCanvas" width="500" height="150"></canvas>
                    <button class="clear-sig-btn" onclick="clearSignature()">Borrar firma</button>
                </div>
                <div id="signatureTyped" style="${signatureMode === 'type' ? '' : 'display:none;'}">
                    <div class="field-group">
                        <label>Escribe tu nombre completo como firma</label>
                        <input type="text" id="f_signatureTyped" value="${escapeHtml(signatureTypedName)}" placeholder="Nombre completo" oninput="updateTypedSignature(this.value)">
                    </div>
                </div>
            </div>

            <button class="btn btn-primary btn-full" id="btnGenerate" onclick="generateEncuesta()" disabled>Enviar mi Encuesta →</button>
        `;

        const comentariosEl = document.getElementById('f_comentarios');
        if (comentariosEl) comentariosEl.addEventListener('input', () => { comentarios = comentariosEl.value; saveProgress(); });

        if (signatureMode === 'draw') setTimeout(initSignatureCanvas, 50);
        updateGenerateButton();
    }

    function setRespuesta(idx, valor, btnEl) {
        respuestas[idx] = valor;
        saveProgress();
        const row = btnEl.closest('.likert-options');
        row.querySelectorAll('.likert-btn').forEach(b => b.classList.remove('active-neg', 'active-mid', 'active-pos'));
        const escalaItem = ESCALA.find(e => e.valor === valor);
        btnEl.classList.add(escalaItem.clase);
        updateGenerateButton();
    }

    function setSignatureMode(mode) { signatureMode = mode; saveProgress(); render(); }
    function updateTypedSignature(value) { signatureTypedName = value; saveProgress(); updateGenerateButton(); }

    function updateGenerateButton() {
        const btn = document.getElementById('btnGenerate');
        if (!btn) return;
        const hasSig = signatureMode === 'draw' ? hasSignature : (signatureTypedName && signatureTypedName.trim().length > 3);
        const allAnswered = PREGUNTAS.every((_, idx) => respuestas[idx]);
        btn.disabled = !(allAnswered && hasSig);
    }

    function initSignatureCanvas() {
        const canvas = document.getElementById('signatureCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        if (signatureDataUrl) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = signatureDataUrl;
        }
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            if (e.touches && e.touches.length) return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }
        function startDraw(e) { e.preventDefault(); isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
            lastX = p.x; lastY = p.y; hasSignature = true;
        }
        function stopDraw() {
            if (isDrawing) { isDrawing = false; signatureDataUrl = canvas.toDataURL('image/png'); saveProgress(); updateGenerateButton(); }
        }
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);
    }

    function clearSignature() {
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        signatureDataUrl = null; hasSignature = false; saveProgress(); updateGenerateButton();
    }

    function generateEncuesta() { generated = true; saveProgress(); render(); }

    function renderGeneratedState(app, result) {
        app.innerHTML = `
            <div class="success-box">
                <h3>🎉 ¡Gracias por completar tu proceso EC1375!</h3>
                <p style="color:var(--text);margin-bottom:20px;">Tu encuesta fue registrada. Tu evaluador armará tu Portafolio de Evidencias final y tu certificado se emitirá en un plazo de 60-90 días.</p>
                <button class="btn btn-primary btn-full" onclick="generatePDF()">📄 Descargar Encuesta (PDF)</button>
                <button class="btn btn-whatsapp btn-full" onclick="notifyWhatsApp()">📱 AVISAR AL EQUIPO POR WHATSAPP</button>
            </div>
            <div class="card" style="text-align:center;margin-top:20px;">
                <a href="evidencias.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">← Volver a mis Evidencias</a>
            </div>
        `;
    }

    function notifyWhatsApp() {
        const result = loadAutodiagnosticoResult();
        const nombre = result ? result.personalData.nombre : 'Candidato';
        const message = encodeURIComponent(`Hola, completé mi Encuesta de Satisfacción EC1375. Soy ${nombre}. ¡Gracias por acompañarme en todo el proceso!`);
        window.open(`https://wa.me/528136071342?text=${message}`, '_blank');
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const result = loadAutodiagnosticoResult();
        const pd = result.personalData;

        doc.setFontSize(15);
        doc.setFont(undefined, 'bold');
        doc.text('ENCUESTA DE SATISFACCIÓN', 105, 15, { align: 'center' });
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text('Proceso de Evaluación de Competencia EC1375', 105, 21, { align: 'center' });

        doc.autoTable({
            startY: 30, theme: 'plain', styles: { fontSize: 9, cellPadding: 1.5 },
            body: [['Candidato/a:', pd.nombre || ''], ['Fecha:', new Date().toLocaleDateString('es-MX')]]
        });

        let y = doc.lastAutoTable.finalY + 8;
        doc.autoTable({
            startY: y,
            head: [['#', 'Pregunta', 'Respuesta']],
            body: PREGUNTAS.map((p, idx) => [idx + 1, p, respuestas[idx] || '']),
            styles: { fontSize: 8, cellPadding: 3 },
            columnStyles: { 0: { cellWidth: 8 }, 1: { cellWidth: 130 }, 2: { cellWidth: 44 } },
            headStyles: { fillColor: [0, 136, 255] }
        });
        y = doc.lastAutoTable.finalY + 10;

        if (comentarios) {
            doc.setFontSize(10); doc.setFont(undefined, 'bold');
            doc.text('Comentarios y/o sugerencias:', 14, y); y += 6;
            doc.setFont(undefined, 'normal');
            const comentariosLines = doc.splitTextToSize(comentarios, 180);
            doc.text(comentariosLines, 14, y);
            y += comentariosLines.length * 5 + 8;
        }

        if (y > 260) { doc.addPage(); y = 15; }
        doc.setFontSize(9); doc.setFont(undefined, 'normal');
        doc.text('Firma:', 14, y);
        if (signatureMode === 'draw' && signatureDataUrl) {
            doc.addImage(signatureDataUrl, 'PNG', 14, y + 3, 55, 20);
        } else if (signatureTypedName) {
            doc.setFont(undefined, 'italic'); doc.setFontSize(13);
            doc.text(signatureTypedName, 14, y + 12);
        }

        doc.save(`Encuesta_Satisfaccion_EC1375_${(pd.nombre || 'candidato').replace(/\s+/g, '_')}.pdf`);
    }

    window.addEventListener('load', () => { loadProgress(); render(); });
    </script>
</body>
</html>
