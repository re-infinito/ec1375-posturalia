<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Mi Cédula de Evaluación - Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="protect.js"></script>
    <script src="flow-status.js"></script>
    <script src="crm-shell.js" data-crm-page="cedula"></script>
    <script src="evaluacion.js"></script>
    <script src="firma-candidato.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF; --accent: #FFD700;
            --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
            --border: rgba(255,255,255,0.12); --surface-2: rgba(255,255,255,0.05);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--dark); color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 60px; }
        .container { max-width: 760px; margin: 0 auto; padding: 24px 20px; }
        .top-bar { position: sticky; top: 0; background: var(--dark); border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100; }
        .top-bar-inner { max-width: 760px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .card { background: var(--dark-light); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 18px; }
        .card h2 { font-size: 1.1rem; color: var(--text-bright); margin-bottom: 10px; }
        h1 { font-size: 1.45rem; color: var(--text-bright); margin-bottom: 6px; }
        .sub { font-size: 0.92rem; margin-bottom: 18px; }
        .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 0.9rem; }
        .kv dt { opacity: 0.8; } .kv dd { color: var(--text-bright); }
        @media (max-width: 520px) { .kv { grid-template-columns: 1fr; gap: 0; } .kv dd { margin-bottom: 8px; } }
        .juicio { display: inline-block; font-weight: 800; letter-spacing: 0.04em; padding: 6px 14px; border-radius: 999px; margin: 6px 0 2px; }
        .juicio.ok { background: rgba(0,255,136,0.12); color: var(--success); border: 1px solid var(--success); }
        .juicio.no { background: rgba(255,51,51,0.1); color: var(--danger); border: 1px solid var(--danger); }
        .campo { margin-top: 14px; }
        .campo strong { display: block; font-size: 0.86rem; color: var(--text-bright); margin-bottom: 4px; }
        .campo p { white-space: pre-wrap; font-size: 0.92rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
        .btn { padding: 14px 22px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; min-height: 44px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:disabled { background: var(--surface-2); color: var(--text); cursor: not-allowed; }
        .btn-sec { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-full { width: 100%; }
        .acuerdo { font-size: 0.95rem; color: var(--text-bright); font-weight: 600; margin-bottom: 12px; }
        .sig-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
        .sig-tab-btn { flex: 1; min-height: 42px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-bright); font-weight: 700; cursor: pointer; font-family: inherit; padding: 8px 12px; }
        .sig-tab-btn.active { border-color: var(--primary); color: var(--primary); }
        #firmaCanvas { width: 100%; height: 160px; background: #fff; border-radius: 10px; border: 1px solid var(--border); touch-action: none; display: block; }
        .input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--dark); color: var(--text-bright); font-size: 1rem; font-family: inherit; min-height: 44px; }
        .link-sec { background: none; border: none; color: var(--text); text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 0.85rem; margin-top: 6px; }
        .ok-box { background: rgba(0,255,136,0.08); border: 1px solid var(--success); border-radius: 12px; padding: 16px; color: var(--text-bright); }
        .firma-vista { background: #fff; border-radius: 8px; padding: 8px; display: inline-block; margin-top: 8px; color: #111; font-style: italic; font-size: 1.3rem; }
        .firma-vista img { max-height: 70px; display: block; }
        .msg-error { color: var(--danger); font-size: 0.88rem; margin-top: 10px; }
        .siguiente { display: flex; flex-wrap: wrap; gap: 10px; }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">Mi Cédula de Evaluación</div></div>
    <div class="container" id="app"><p>Cargando…</p></div>

    <script>
    const E = Evaluacion;
    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }
    function fecha(iso) {
        if (!iso) return '';
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
        const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(iso);
        return isNaN(d) ? '' : d.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    let ev = null, row = null, fases = {}, firma = { mode: 'draw', dataUrl: null, typedName: '' };

    function vistaFirma(f) {
        if (!f) return '';
        if (f.mode === 'draw' && /^data:image\//.test(f.dataUrl || '')) return `<div class="firma-vista"><img src="${f.dataUrl}" alt="Tu firma"></div>`;
        return `<div class="firma-vista">${escapeHtml(f.typedName || '')}</div>`;
    }

    function cedulaHtml(c, nombre) {
        const comp = c.juicio === 'COMPETENTE';
        return `
            <section class="card">
                <h2>Cédula de Evaluación</h2>
                <dl class="kv">
                    <dt>Evaluador(a)</dt><dd>${escapeHtml(c.firmaEvaluadorNombre || c.evaluadora || '')}</dd>
                    <dt>Candidato/a</dt><dd>${escapeHtml(nombre)}</dd>
                    <dt>Estándar</dt><dd>EC1375 · Prestación de servicios auxiliares en la contribución tradicional y complementaria de la recuperación de las condiciones físicas y socioemocionales de las personas</dd>
                    <dt>Fecha</dt><dd>${escapeHtml(fecha(c.fecha))}</dd>
                </dl>
                <div class="campo"><strong>Juicio de evaluación</strong><span class="juicio ${comp ? 'ok' : 'no'}">${escapeHtml(c.juicio)}</span></div>
                ${E.CAMPOS_CEDULA.filter(k => (c[k.id] || '').trim()).map(k => `<div class="campo"><strong>${escapeHtml(k.label)}</strong><p>${escapeHtml(c[k.id])}</p></div>`).join('')}
                ${(c.observaciones || '').trim() ? `<div class="campo"><strong>Observaciones de tu evaluador(a)</strong><p>${escapeHtml(c.observaciones)}</p></div>` : ''}
            </section>`;
    }

    function siguienteHtml(dictamen) {
        if (dictamen === 'no_competente') return `
            <section class="card"><h2>¿Qué sigue?</h2>
                <p style="margin-bottom:12px;">Revisa los comentarios de tu evaluador(a) y sube una nueva evidencia. Cuando la revise, te llega una Cédula nueva.</p>
                <div class="siguiente"><a class="btn btn-primary" href="evidencias.html">Subir nueva evidencia</a><a class="btn btn-sec" href="panel.html">Ir a mi panel</a></div></section>`;
        if (!fases.entrega) return `
            <section class="card"><h2>¿Qué sigue?</h2>
                <p style="margin-bottom:12px;">Con tu resultado <strong>COMPETENTE</strong>, el último paso es el pago de Entrega para tramitar tu certificado ante la SEP.</p>
                <div class="siguiente"><a class="btn btn-primary" href="entrega.html">Pagar Entrega</a><a class="btn btn-sec" href="panel.html">Ir a mi panel</a></div></section>`;
        return `<section class="card"><h2>¿Qué sigue?</h2><p style="margin-bottom:12px;">Tu evaluador(a) envía tu portafolio a la SEP. Sigue el avance en tu panel.</p><a class="btn btn-sec" href="panel.html">Ir a mi panel</a></section>`;
    }

    function formularioFirmaHtml() {
        return `
            <section class="card">
                <h2>Tu firma</h2>
                <p class="acuerdo">${escapeHtml(E.TEXTO_ACUERDO)}</p>
                <div id="usarFirmaAuto"></div>
                <div class="sig-tabs">
                    <button type="button" class="sig-tab-btn ${firma.mode !== 'type' ? 'active' : ''}" data-modo="draw">✍️ Dibujar firma</button>
                    <button type="button" class="sig-tab-btn ${firma.mode === 'type' ? 'active' : ''}" data-modo="type">⌨️ Escribir mi nombre</button>
                </div>
                <div id="firmaDraw" ${firma.mode === 'type' ? 'hidden' : ''}><canvas id="firmaCanvas" aria-label="Recuadro para dibujar tu firma"></canvas>
                    <button type="button" class="link-sec" id="btnBorrar">Borrar firma</button></div>
                <div id="firmaType" ${firma.mode === 'type' ? '' : 'hidden'}><input class="input" id="firmaTyped" maxlength="120" placeholder="Escribe tu nombre completo" value="${escapeHtml(firma.typedName || '')}"></div>
                <button type="button" class="btn btn-primary btn-full" id="btnFirmar" style="margin-top:14px;">Firmar mi Cédula</button>
                <div class="msg-error" id="errorFirma" role="alert"></div>
            </section>`;
    }

    function prepararLienzo() {
        const cv = document.getElementById('firmaCanvas');
        if (!cv) return;
        const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
        cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
        const ctx = cv.getContext('2d');
        ctx.scale(dpr, dpr); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
        if (firma.mode === 'draw' && firma.dataUrl) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = firma.dataUrl; }
        let on = false;
        const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
        cv.addEventListener('pointerdown', e => { on = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); });
        cv.addEventListener('pointermove', e => { if (!on) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
        const fin = () => { if (!on) return; on = false; firma = { mode: 'draw', dataUrl: cv.toDataURL('image/png'), typedName: '' }; };
        cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
    }

    function conectarFirma() {
        document.querySelectorAll('.sig-tab-btn[data-modo]').forEach(b => b.addEventListener('click', () => {
            const modo = b.dataset.modo;
            document.querySelectorAll('.sig-tab-btn[data-modo]').forEach(x => x.classList.toggle('active', x === b));
            document.getElementById('firmaDraw').hidden = modo !== 'draw';
            document.getElementById('firmaType').hidden = modo !== 'type';
            firma = modo === 'type' ? { mode: 'type', dataUrl: null, typedName: document.getElementById('firmaTyped').value } : { mode: 'draw', dataUrl: null, typedName: '' };
            if (modo === 'draw') prepararLienzo();
        }));
        document.getElementById('btnBorrar').addEventListener('click', () => { firma = { mode: 'draw', dataUrl: null, typedName: '' }; prepararLienzo(); });
        document.getElementById('firmaTyped').addEventListener('input', e => { firma = { mode: 'type', dataUrl: null, typedName: e.target.value }; });
        if (firma.mode !== 'type') prepararLienzo();
        FirmaCandidato.ofrecer(document.getElementById('usarFirmaAuto'), {
            onUsar: f => { firma = f; render(); }
        });
        document.getElementById('btnFirmar').addEventListener('click', firmar);
    }

    async function firmar() {
        const err = document.getElementById('errorFirma'), btn = document.getElementById('btnFirmar');
        err.textContent = '';
        if (!FirmaCandidato.firmaValida(firma) || (firma.mode === 'type' && firma.typedName.trim().length < 3)) {
            err.textContent = 'Dibuja tu firma o escribe tu nombre completo.';
            return;
        }
        btn.disabled = true; btn.textContent = 'Guardando tu firma…';
        try {
            const r = await Auth.firmarCedula({ mode: firma.mode, dataUrl: firma.mode === 'draw' ? firma.dataUrl : null, typedName: firma.mode === 'type' ? firma.typedName.trim() : null });
            ev.firma_candidato = r;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            err.textContent = 'No se pudo guardar tu firma: ' + (e.message || e) + '. Intenta de nuevo.';
            btn.disabled = false; btn.textContent = 'Firmar mi Cédula';
        }
    }

    function render() {
        const app = document.getElementById('app');
        const c = ev.cedula;
        const nombre = (row && row.nombre) || (row && row.autodiagnostico_data && row.autodiagnostico_data.personalData && row.autodiagnostico_data.personalData.nombre) || '';
        const dictamen = E.dictamenDe(ev);
        const firmada = ev.firma_candidato;
        app.innerHTML = `
            <h1>Tu resultado de evaluación</h1>
            <p class="sub">${firmada ? 'Ya firmaste tu Cédula de Evaluación.' : 'Lee tu Cédula de Evaluación y fírmala al final.'}</p>
            ${firmada ? `<div class="ok-box" style="margin-bottom:18px;">✓ Firmaste de acuerdo el ${escapeHtml(fecha(firmada.fecha))}.${vistaFirma(firmada)}</div>` : ''}
            ${cedulaHtml(c, nombre)}
            ${firmada ? siguienteHtml(dictamen) : formularioFirmaHtml()}`;
        if (!firmada) conectarFirma();
    }

    async function boot() {
        const app = document.getElementById('app');
        const session = await Auth.getSession();
        if (!session) {
            try { sessionStorage.setItem('paideia-volver', location.pathname); } catch (e) {}
            app.innerHTML = `<section class="card"><h2>Inicia sesión</h2><p style="margin-bottom:12px;">Para ver tu Cédula de Evaluación necesitas iniciar sesión.</p><a class="btn btn-primary" href="panel.html">Iniciar sesión</a></section>`;
            return;
        }
        const [e, r, entrega] = await Promise.all([Auth.miEvaluacion(), FlowStatus.getRow(), Auth.isPhaseAuthorized(session.user.email, 'entrega')]);
        ev = e; row = r; fases = { entrega: !!entrega };
        if (!ev || !E.cedulaPublicada(ev)) {
            app.innerHTML = `<section class="card"><h2>Tu Cédula todavía no está lista</h2><p style="margin-bottom:12px;">Tu evaluador(a) la publica después de revisar tu video y tus evidencias. Sigue el avance en tu panel.</p><a class="btn btn-sec" href="panel.html">Ir a mi panel</a></section>`;
            return;
        }
        render();
    }

    window.addEventListener('load', () => {
        boot().catch(e => {
            console.error('Error en cedula.html:', e);
            document.getElementById('app').innerHTML = `<section class="card"><h2>Algo salió mal</h2><p style="margin-bottom:12px;">No pudimos cargar tu Cédula. Recarga la página.</p><button class="btn btn-primary" onclick="location.reload()">Recargar</button></section>`;
        });
    });
    </script>
</body>
</html>
