<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alineación (Capacitación) - Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container { max-width: 760px; margin: 0 auto; padding: 24px 20px; }

        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
        }
        .top-bar-inner { max-width: 760px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }

        .card { background: var(--dark-light); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 1.15rem; color: var(--text-bright); margin-bottom: 14px; }
        .card p.desc { font-size: 0.88rem; color: var(--text); margin-bottom: 16px; }

        .hero { text-align: center; padding: 20px 0 30px; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.7rem; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.98rem; color: var(--text); }

        .blocked-box {
            background: rgba(255, 215, 0, 0.08); border: 1px solid var(--accent);
            border-radius: 12px; padding: 28px; text-align: center;
        }
        .blocked-box p { color: var(--text); margin-bottom: 18px; }

        .pay-box {
            background: linear-gradient(135deg, rgba(0,136,255,0.15), rgba(0,204,255,0.05));
            border: 2px solid var(--primary); border-radius: 12px; padding: 28px; text-align: center;
        }
        .pay-box .monto { font-size: 2rem; font-weight: 700; color: var(--text-bright); margin: 10px 0; }

        video, iframe.embed { width: 100%; border-radius: 8px; border: none; background: #000; }
        video { max-height: 420px; }
        iframe.embed { height: 480px; }

        .btn {
            padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease; text-align: center;
            display: inline-block; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #20ba5a; transform: translateY(-2px); }
        .btn-full { width: 100%; margin-bottom: 12px; }

        .pending-note {
            font-size: 0.82rem; color: rgba(255,255,255,0.45); text-align: center;
            padding: 16px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px;
        }

        .calendar-cta-box {
            background: linear-gradient(135deg, rgba(0,136,255,0.15), rgba(0,204,255,0.05));
            border: 2px solid var(--primary); border-radius: 12px; padding: 22px; text-align: center;
        }
        #calendarFrameAlineacion { width: 100%; height: 600px; border: none; border-radius: 8px; margin-top: 4px; background: white; }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">🎓 Alineación (Capacitación)</div></div>
    <div class="container" id="app"></div>

    <script>
    /* =========================================================
       CONFIG — Diego pega aquí las ligas cuando estén listas.
       Vacío = la tarjeta correspondiente muestra un aviso de
       "disponible pronto" en vez de romperse.
    ========================================================= */
    const VIDEO_CAPACITACION_URL = ''; // video de capacitación (YouTube/Vimeo embed o mp4 directo)
    const VIDEO_MUESTRA_URL = ''; // video de muestra: cómo atender a un paciente según el estándar
    const MATERIAL_BONUS_URL = ''; // liga al portal con material adicional (bonus)

    // Widget de Google Calendar Appointment Schedule para agendar Alineación
    // (sesión grupal — activar "varias reservas por horario" al crearlo en
    // Google Calendar). Vacío = se muestra un aviso con opción de WhatsApp.
    const GOOGLE_CALENDAR_BOOKING_URL = 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ2kr0AWk-9zW-wx7xdNnQKS5gIreZ-YrMtlDpxOK07iavWx_Xxe27FGxjN7MCHSIerR_kqFnIzs';

    function loadAutodiagnosticoResult() {
        try {
            const saved = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null');
            if (!saved || !saved.personalData || !saved.personalData.nombre) return null;
            const answers = saved.answers || {};
            const total = 142;
            const answered = Object.keys(answers).length;
            return { personalData: saved.personalData, answered, total, completo: answered === total, ndaAccepted: !!saved.ndaAccepted };
        } catch (e) { return null; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Alternativa manual mientras se resuelven los rechazos de Mercado Pago.
    // El monto exacto es el mismo que ya se captura en admin-precios.html
    // (monto_alineacion, o % del total_acordado si no está capturado) —
    // api/monto-fase.js expone esa misma cuenta sin crear una Preferencia.
    async function fetchMontoFase(email, fase) {
        try {
            const resp = await fetch('/api/monto-fase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, fase })
            });
            if (!resp.ok) return null;
            const data = await resp.json();
            return typeof data.monto === 'number' ? data.monto : null;
        } catch (e) { return null; }
    }

    function renderTransferenciaCard(monto) {
        const montoTxt = typeof monto === 'number' ? `$${monto.toLocaleString('es-MX')} MXN` : null;
        return `
            <div class="card" style="margin-top:20px;">
                <h2>🏦 Transferencia Bancaria</h2>
                <p class="desc">${montoTxt ? `¿Prefieres transferir directamente? Transfiere <strong>${montoTxt}</strong> a:` : '¿Prefieres transferir directamente? Escríbenos por WhatsApp para confirmar el monto, y transfiere a:'}</p>
                <div style="background:var(--dark);border-radius:8px;padding:16px;font-size:0.9rem;line-height:1.9;margin-bottom:14px;">
                    <strong>Banco:</strong> BBVA<br>
                    <strong>Titular:</strong> Jose Fernando Villarreal Flores<br>
                    <strong>Cuenta:</strong> 1520824867<br>
                    <strong>CLABE:</strong> 012180015208248677
                </div>
                <button class="btn btn-secondary btn-full" onclick="copyClabeBBVA()">Copiar CLABE</button>
                <p style="font-size:0.8rem;color:rgba(255,255,255,0.5);margin-top:12px;">Después de transferir, envía tu comprobante de pago por <a href="https://wa.me/528115026729" style="color:var(--primary);" target="_blank">WhatsApp</a> para activar este paso.</p>
            </div>`;
    }

    function copyClabeBBVA() {
        navigator.clipboard.writeText('012180015208248677').then(() => alert('CLABE copiada al portapapeles'));
    }

    function requestAlineacionViaWhatsApp() {
        const result = loadAutodiagnosticoResult();
        const nombre = result ? result.personalData.nombre : 'Candidato';
        const message = encodeURIComponent(`Hola, quiero coordinar la fecha de mi sesión de Alineación EC1375.\n\nNombre: ${nombre}`);
        window.open(`https://wa.me/528115026729?text=${message}`, '_blank');
    }

    function renderReservaCard() {
        return `
            <div class="card">
                <h2>📅 Reserva tu sesión de Alineación</h2>
                <p class="desc">Es una sesión grupal en vivo — agenda directo en el calendario y te llega la confirmación con la liga de la sesión a tu correo.</p>
                ${GOOGLE_CALENDAR_BOOKING_URL ? `
                    <iframe id="calendarFrameAlineacion" src="${GOOGLE_CALENDAR_BOOKING_URL}"></iframe>
                ` : `
                    <div class="calendar-cta-box">
                        <p style="color:var(--text-bright);font-weight:600;margin-bottom:10px;">El calendario en línea se está configurando</p>
                        <p class="desc" style="margin-bottom:16px;">Mientras tanto, coordina tu fecha directamente por WhatsApp:</p>
                        <button class="btn btn-whatsapp" onclick="requestAlineacionViaWhatsApp()">📱 COORDINAR FECHA POR WHATSAPP</button>
                    </div>
                `}
            </div>`;
    }

    function embedBlock(url, label) {
        if (!url) {
            return `<p class="pending-note">📌 ${label} — disponible pronto. Te avisamos por WhatsApp en cuanto esté listo.</p>`;
        }
        if (/\.mp4($|\?)/i.test(url)) {
            return `<video controls src="${url}"></video>`;
        }
        return `<iframe class="embed" src="${url}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    }

    async function pagarFase() {
        const btn = document.getElementById('btnPagar');
        const session = await Auth.getSession();
        if (!session) { render(); return; }
        const email = session.user.email;
        if (btn) { btn.disabled = true; btn.textContent = 'Generando link de pago...'; }
        try {
            const resp = await fetch('/api/crear-preferencia', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, fase: 'alineacion' })
            });
            const data = await resp.json();
            if (!resp.ok || !data.init_point) throw new Error(data.error || 'sin init_point');
            window.location.href = data.init_point;
        } catch (e) {
            if (btn) { btn.disabled = false; btn.textContent = '💳 Pagar Alineación'; }
            alert('No se pudo generar el link de pago. Intenta de nuevo o escríbenos por WhatsApp.');
        }
    }

    async function render() {
        const app = document.getElementById('app');
        const result = loadAutodiagnosticoResult();

        if (!result || !result.completo) {
            app.innerHTML = `
                <div class="hero">
                    <div class="hero-icon">🎓</div>
                    <h1 class="hero-title">Alineación (Capacitación)</h1>
                    <p class="hero-subtitle">Prepárate para tu evaluación práctica</p>
                </div>
                <div class="blocked-box">
                    <p><strong>Primero necesitas completar tu Autodiagnóstico</strong><br>Es el primer paso del proceso — nos permite identificarte y habilitar el resto.</p>
                    <a href="autodiagnostico.html" class="btn btn-primary">📋 Ir al Autodiagnóstico</a>
                </div>`;
            return;
        }

        const session = await Auth.getSession();
        if (!session) {
            app.innerHTML = `
                <div class="hero">
                    <div class="hero-icon">🔐</div>
                    <h1 class="hero-title">Alineación (Capacitación)</h1>
                    <p class="hero-subtitle">Prepárate para tu evaluación práctica</p>
                </div>
                <div class="blocked-box">
                    <p><strong>Verifica tu correo para continuar</strong><br>Encontramos tu avance en este dispositivo, pero necesitas iniciar sesión para seguir.</p>
                    <a href="recuperar.html" class="btn btn-primary">🔐 Iniciar sesión</a>
                </div>`;
            return;
        }

        if (!result.ndaAccepted) {
            app.innerHTML = `
                <div class="hero">
                    <div class="hero-icon">🔒</div>
                    <h1 class="hero-title">Alineación (Capacitación)</h1>
                    <p class="hero-subtitle">Hola ${escapeHtml(result.personalData.nombre)}, falta un paso</p>
                </div>
                <div class="blocked-box">
                    <p><strong>Primero necesitas firmar tu Acuerdo de Confidencialidad (NDA)</strong><br>Es un paso corto dentro de tu Autodiagnóstico — protege tanto la información de otros candidatos como el material de Paideia Tech.</p>
                    <a href="autodiagnostico.html" class="btn btn-primary">🔒 Firmar mi Acuerdo de Confidencialidad</a>
                </div>`;
            return;
        }

        const email = session.user.email;
        const autorizado = await Auth.isPhaseAuthorized(email, 'alineacion');

        if (!autorizado) {
            const monto = await fetchMontoFase(email, 'alineacion');
            const montoTxt = typeof monto === 'number' ? `$${monto.toLocaleString('es-MX')} MXN` : null;
            app.innerHTML = `
                <div class="hero">
                    <div class="hero-icon">🎓</div>
                    <h1 class="hero-title">Alineación (Capacitación)</h1>
                    <p class="hero-subtitle">Hola ${escapeHtml(result.personalData.nombre)}, este es tu siguiente paso</p>
                </div>
                <div class="pay-box">
                    <p>Con tu Registro listo, el siguiente paso es la <strong>Alineación</strong>: capacitación en power point, video, y el video de muestra de cómo atender a un paciente según el estándar.</p>
                    ${montoTxt ? `<div class="monto">${montoTxt}</div>` : ''}
                    <button id="btnPagar" class="btn btn-primary btn-full" style="margin-top:16px;" onclick="pagarFase()">💳 Pagar Alineación</button>
                    <p style="font-size:0.8rem;color:rgba(255,255,255,0.5);">¿Dudas? <a href="https://wa.me/528115026729" style="color:var(--primary);" target="_blank">Escríbenos por WhatsApp</a></p>
                </div>
                ${renderTransferenciaCard(monto)}`;
            return;
        }

        app.innerHTML = `
            <div class="hero">
                <div class="hero-icon">🎓</div>
                <h1 class="hero-title">Alineación (Capacitación)</h1>
                <p class="hero-subtitle">Hola ${escapeHtml(result.personalData.nombre)} — este es tu material de preparación</p>
            </div>

            ${renderReservaCard()}

            <div class="card">
                <h2>📚 Ruta de Estudio (interactiva)</h2>
                <p class="desc">Curso a tu ritmo del EC1375 completo — repasa los puntos clave del estándar antes de tu evaluación práctica.</p>
                <a href="ruta-estudio.html" class="btn btn-secondary btn-full">📚 Abrir Ruta de Estudio</a>
            </div>

            <div class="card">
                <h2>🎬 Video de capacitación</h2>
                <p class="desc">Explicación a detalle de cómo se lleva a cabo el proceso de evaluación.</p>
                ${embedBlock(VIDEO_CAPACITACION_URL, 'Video de capacitación')}
            </div>

            <div class="card">
                <h2>🩺 Video de muestra</h2>
                <p class="desc">Cómo debes atender a un paciente durante tu evaluación, según el estándar oficial.</p>
                ${embedBlock(VIDEO_MUESTRA_URL, 'Video de muestra')}
            </div>

            <div class="card">
                <h2>🎁 Material adicional (bonus)</h2>
                <p class="desc">Liga al portal con material extra que puedes usar para prepararte.</p>
                ${MATERIAL_BONUS_URL
                    ? `<a href="${MATERIAL_BONUS_URL}" target="_blank" class="btn btn-secondary btn-full">Abrir material adicional</a>`
                    : `<p class="pending-note">📌 Disponible pronto.</p>`}
            </div>

            <a href="plan-evaluacion.html" class="btn btn-primary btn-full">Siguiente: Agenda tu Plan de Evaluación →</a>
        `;
    }

    window.addEventListener('load', () => {
        render().catch(e => {
            console.error('Error en render():', e);
            document.getElementById('app').innerHTML = `
                <div class="hero"><div class="hero-icon">⚠️</div><h1 class="hero-title">Algo salió mal</h1></div>
                <div class="blocked-box">
                    <p>No pudimos cargar esta página. Intenta recargarla — si el problema sigue, escríbenos por WhatsApp.</p>
                    <button class="btn btn-primary" onclick="window.location.reload()">🔄 Recargar</button>
                    <p style="margin-top:14px;font-size:0.85rem;"><a href="https://wa.me/528115026729" style="color:var(--primary);" target="_blank">Escribir por WhatsApp</a></p>
                </div>`;
        });
    });
    </script>
</body>
</html>
