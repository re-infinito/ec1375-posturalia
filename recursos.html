<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Recursos - Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="protect.js"></script>
    <script src="flow-status.js"></script>
    <script src="crm-shell.js" data-crm-page="recursos"></script>
    <script src="formatos-consultorio.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
            --border: rgba(255,255,255,0.12); --surface-2: rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
        }
        .top-bar-inner { max-width: 960px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }

        .intro h1 { font-size: 1.5rem; color: var(--text-bright); margin-bottom: 6px; }
        .intro p { font-size: 0.95rem; margin-bottom: 22px; }

        .seccion { margin-bottom: 34px; }
        .seccion-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
        .seccion-h h2 { font-size: 1.2rem; color: var(--text-bright); }
        .seccion-sub { font-size: 0.9rem; margin-bottom: 16px; }
        .chip { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); }
        .chip.ok { color: var(--success); border-color: var(--success); }
        .chip.lock { color: var(--accent); border-color: var(--accent); }

        .aviso-lock {
            background: rgba(255,215,0,0.08); border: 1px solid var(--accent); border-radius: 12px;
            padding: 16px 18px; margin-bottom: 16px; font-size: 0.9rem;
        }
        .aviso-lock strong { color: var(--text-bright); }
        .aviso-lock a { color: var(--primary); font-weight: 700; }

        .datos { background: var(--dark-light); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
        .datos h3 { font-size: 0.95rem; color: var(--text-bright); margin-bottom: 4px; }
        .datos p { font-size: 0.85rem; margin-bottom: 12px; }
        .datos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        .datos label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
        .datos input {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--dark); color: var(--text-bright); font-size: 0.9rem; min-height: 40px;
        }

        .formatos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
        .formato {
            background: var(--dark-light); border: 1px solid var(--border); border-radius: 12px;
            padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
        }
        .formato h3 { font-size: 1rem; color: var(--text-bright); }
        .formato p { font-size: 0.85rem; flex: 1; }
        .formato .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
        .formato.proximamente { border-style: dashed; opacity: 0.8; }

        .btn {
            padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 0.88rem; min-height: 40px;
            border: none; cursor: pointer; text-align: center; display: inline-flex; align-items: center;
            justify-content: center; gap: 6px; text-decoration: none; flex: 1;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-sec { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn:disabled { background: var(--surface-2); border-color: var(--border); color: var(--text); cursor: not-allowed; }

        .tutoriales { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
        .tutorial {
            display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; cursor: pointer;
            background: var(--dark-light); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font: inherit; min-width: 0;
        }
        .tutorial:hover, .tutorial:focus-visible { border-color: var(--primary); }
        .tutorial .poster { display: block; position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); }
        .tutorial .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .tutorial .play {
            position: absolute; left: 8px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%;
            background: rgba(5,10,26,0.72); color: #fff; display: flex; align-items: center; justify-content: center;
        }
        .tutorial .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(5,10,26,0.8); color: #fff; font-size: 0.75rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
        .tutorial .info { display: block; padding: 10px 12px 12px; }
        .tutorial .info strong { display: block; color: var(--text-bright); font-size: 0.95rem; margin-bottom: 2px; }
        .tutorial .info span { font-size: 0.82rem; }
        @media (max-width: 560px) {
            .tutoriales { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .tutorial .info { padding: 8px 10px 10px; }
            .tutorial .info strong { font-size: 0.88rem; }
            .tutorial .info span { display: none; }
        }
        .nota { font-size: 0.8rem; margin-top: 12px; }
        .toast {
            position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--dark-light);
            border: 1px solid var(--border); color: var(--text-bright); padding: 10px 16px; border-radius: 10px;
            font-size: 0.88rem; z-index: 300; max-width: calc(100vw - 32px); display: none;
        }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">Recursos</div></div>
    <div class="container" id="app"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
    const URL_JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    const URL_DOCX = 'https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';

    let desbloqueado = false;

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    function ico(nombre) {
        return (typeof CrmShell !== 'undefined' && CrmShell.icon) ? CrmShell.icon(nombre, 16) : '';
    }
    function aviso(txt) {
        const t = document.getElementById('toast');
        t.textContent = txt; t.style.display = 'block';
        clearTimeout(aviso._t); aviso._t = setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    const _scripts = {};
    function cargarScript(src) {
        if (!_scripts[src]) {
            _scripts[src] = new Promise((ok, falla) => {
                const s = document.createElement('script');
                s.src = src; s.onload = ok;
                s.onerror = () => { delete _scripts[src]; falla(new Error('No se pudo cargar ' + src)); };
                document.head.appendChild(s);
            });
        }
        return _scripts[src];
    }

    /* Datos del responsable: los que el candidato ya capturó para el Aviso
       de Privacidad en Documentos de Sesión; si no, los de su Autodiagnóstico.
       Siempre de la fila del candidato (FlowStatus.getRow), nunca del
       localStorage suelto: ese puede traer datos de otra cuenta. */
    function datosDeFila(row) {
        const pd = (row && row.autodiagnostico_data && row.autodiagnostico_data.personalData) || {};
        const s = (row && row.documentos_sesion_data && row.documentos_sesion_data.sessionData) || {};
        return {
            responsable: (s.avisoResponsable || pd.nombre || '').trim(),
            domicilio: (s.avisoDomicilio || pd.domicilio || '').trim(),
            contacto: (s.avisoContacto || [pd.telefonoCelular, pd.email].filter(Boolean).join(' · ')).trim()
        };
    }
    function datosResponsable() {
        const v = id => (document.getElementById(id) || {}).value || '';
        return { responsable: v('resp').trim(), domicilio: v('dom').trim(), contacto: v('cont').trim() };
    }

    async function descargar(id, formato, btn) {
        if (!desbloqueado) return;
        const texto = btn.innerHTML;
        btn.disabled = true; btn.textContent = 'Preparando…';
        try {
            const r = datosResponsable();
            let blob;
            if (formato === 'pdf') {
                await cargarScript(URL_JSPDF);
                blob = FormatosConsultorio.pdf(id, r);
            } else {
                await cargarScript(URL_DOCX);
                blob = await FormatosConsultorio.docx(id, r);
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = FormatosConsultorio.nombreArchivo(id, r, formato);
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 10000);
            aviso('Descargado: ' + a.download);
        } catch (e) {
            console.error('No se pudo generar el formato:', e);
            aviso('No se pudo generar el archivo. Revisa tu conexión e intenta de nuevo.');
        } finally {
            btn.disabled = false; btn.innerHTML = texto;
        }
    }

    /* Tutoriales: la lista vive en crm-shell.js (también la usa el botón
       «Ver cómo se hace» de cada paso). Disponibles siempre. */
    function tutorialesHtml() {
        const lista = (typeof CrmShell !== 'undefined' && CrmShell.TUTORIALES) || [];
        if (!lista.length) return '';
        const dur = t => CrmShell._helpers.duracionTexto(t.dur);
        return `
            <section class="seccion" id="tutoriales">
                <div class="seccion-h"><h2>Tutoriales de la plataforma</h2></div>
                <p class="seccion-sub">Videos cortos y sin audio que muestran cómo se hace cada paso, con datos de ejemplo.</p>
                <div class="tutoriales">
                    ${lista.map(t => `
                        <button type="button" class="tutorial" onclick="CrmShell.abrirTutorial('${t.id}', this)" aria-label="Ver tutorial: ${escapeHtml(t.titulo)}">
                            <span class="poster"><img src="tutoriales/${t.id}.jpg" alt="" loading="lazy"><span class="play">${ico('play')}</span>${t.dur ? `<span class="dur">${dur(t)}</span>` : ''}</span>
                            <span class="info"><strong>${escapeHtml(t.titulo)}</strong><span>${escapeHtml(t.desc)}</span></span>
                        </button>`).join('')}
                </div>
            </section>`;
    }

    function toolkitHtml(datos) {
        const dis = desbloqueado ? '' : ' disabled';
        const tarjetas = FormatosConsultorio.FORMATOS.map(f => `
            <div class="formato">
                <h3>${escapeHtml(f.titulo)}</h3>
                <p>${escapeHtml(f.desc)}</p>
                <div class="acciones">
                    <button class="btn btn-primary"${dis} onclick="descargar('${f.id}','pdf',this)">${ico('download')} PDF</button>
                    <button class="btn btn-sec"${dis} onclick="descargar('${f.id}','docx',this)">${ico('file')} Word editable</button>
                </div>
            </div>`).join('');
        return `
            <section class="seccion" id="toolkit">
                <div class="seccion-h">
                    <h2>Tu toolkit profesional</h2>
                    ${desbloqueado ? '<span class="chip ok">Disponible</span>' : '<span class="chip lock">Se desbloquea al terminar tu proceso</span>'}
                </div>
                <p class="seccion-sub">Formatos para tu consultorio basados en lo que el Estándar EC1375 pide: úsalos con cada paciente después de certificarte. El PDF sale con tus datos listo para imprimir; el Word lo puedes adaptar a tu gusto.</p>
                ${desbloqueado ? '' : `<div class="aviso-lock"><strong>Aún no disponible.</strong> Se desbloquea cuando termines tu proceso: el último paso es subir tus <a href="evidencias.html">Evidencias</a>.</div>`}
                <div class="datos">
                    <h3>Tus datos en los formatos</h3>
                    <p>Aparecen como responsable en el encabezado y en el Aviso de Privacidad. Puedes cambiarlos antes de descargar.</p>
                    <div class="datos-grid">
                        <div><label for="resp">Nombre del responsable</label><input id="resp" value="${escapeHtml(datos.responsable)}"${dis}></div>
                        <div><label for="dom">Domicilio del consultorio</label><input id="dom" value="${escapeHtml(datos.domicilio)}"${dis}></div>
                        <div><label for="cont">Contacto (teléfono · correo)</label><input id="cont" value="${escapeHtml(datos.contacto)}"${dis}></div>
                    </div>
                </div>
                <div class="formatos">
                    ${tarjetas}
                    <div class="formato proximamente">
                        <h3>Hoja terapéutica</h3>
                        <p>Registro terapéutico de cada paciente. Lo estamos terminando y aparecerá aquí.</p>
                        <div class="acciones"><button class="btn btn-sec" disabled>Próximamente</button></div>
                    </div>
                </div>
                <p class="nota">El Aviso de Privacidad es un texto modelo: revísalo con tu asesor antes de usarlo en tu consultorio.</p>
            </section>`;
    }

    async function render() {
        const app = document.getElementById('app');
        const session = await Auth.getSession();
        if (!session) {
            try { sessionStorage.setItem('paideia-volver', location.pathname + location.search + location.hash); } catch (e) {}
            app.innerHTML = `
                <div class="intro"><h1>Recursos</h1></div>
                <div class="aviso-lock"><strong>Inicia sesión</strong> para ver tus recursos. <a href="panel.html">Iniciar sesión</a></div>`;
            return;
        }
        const esBypass = await Auth.isBypassSession();
        if (esBypass) Auth.ensureAdminPlaceholderData();
        const [esAdmin, steps, row] = await Promise.all([
            esBypass ? Promise.resolve(false) : Auth.isAdmin(session.user.email),
            FlowStatus.getSteps(),
            FlowStatus.getRow()
        ]);
        const evidencias = (steps || []).find(s => s.id === 'evidencias');
        desbloqueado = esBypass || esAdmin || !!(evidencias && evidencias.done);

        app.innerHTML = `
            <div class="intro">
                <h1>Recursos</h1>
                <p>Tutoriales para usar la plataforma y formatos para tu práctica profesional.</p>
            </div>
            ${tutorialesHtml()}
            ${toolkitHtml(datosDeFila(row))}`;
        if (location.hash === '#tutoriales') { const el = document.getElementById('tutoriales'); if (el) el.scrollIntoView(); }
    }

    window.addEventListener('load', () => {
        render().catch(e => {
            console.error('Error en render():', e);
            document.getElementById('app').innerHTML = `
                <div class="aviso-lock"><strong>No pudimos cargar esta página.</strong> Intenta recargarla.
                <button class="btn btn-primary" style="margin-top:10px;" onclick="window.location.reload()">Recargar</button></div>`;
        });
    });
    </script>
</body>
</html>
