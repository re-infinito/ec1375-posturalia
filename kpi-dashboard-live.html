<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Dashboard — EC1375 Paideia Tech</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF;
      --text: #D0D0D0; --text-bright: #FFFFFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
      color: var(--text); line-height: 1.6; min-height: 100vh;
    }
    .container { max-width: 420px; margin: 0 auto; padding: 40px 20px; }
    .hero { text-align: center; margin-bottom: 30px; }
    .hero-icon { font-size: 3rem; margin-bottom: 14px; }
    .hero-title { font-size: 1.5rem; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; }
    .card { background: var(--dark-light); border-radius: 12px; padding: 24px; text-align: center; }
    .card p { font-size: 0.85rem; margin-bottom: 16px; }
    .card a.btn {
      display: inline-block; padding: 12px 24px; background: var(--primary); color: white;
      border-radius: 8px; font-weight: 700; font-size: 0.88rem; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
    // Este dashboard (público, sin auth.js) fue reemplazado por
    // admin-kpis.html — mismo cálculo de KPIs pero con más detalle
    // (estado de candidatos, reparto de utilidades, desglose por lote)
    // y protegido por login de administrador. Este archivo se conserva
    // como stub gateado para no romper enlaces/bookmarks viejos, pero
    // ya no expone ningún dato sin sesión de admin.
    function renderGateShell() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="hero"><div class="hero-icon">📊</div><h1 class="hero-title">KPI Dashboard</h1></div>
        <div class="card" id="adminGateContainer"></div>`;
      Auth.renderAdminGate(document.getElementById('adminGateContainer'), {
        onVerified: () => { window.location.href = 'admin-kpis.html'; }
      });
    }

    function renderRedirecting() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="hero"><div class="hero-icon">📊</div><h1 class="hero-title">KPI Dashboard</h1></div>
        <div class="card">
          <p>Este dashboard se movió al panel de administración con más detalle (estado de candidatos, utilidades, desglose por lote).</p>
          <a class="btn" href="admin-kpis.html">Ir al panel de KPIs →</a>
        </div>`;
    }

    window.addEventListener('load', async () => {
      try {
        const session = await Auth.getSession();
        if (session) {
          const esAdmin = await Auth.isAdmin(session.user.email);
          if (esAdmin) { renderRedirecting(); window.location.href = 'admin-kpis.html'; return; }
          await Auth.signOut();
        }
        renderGateShell();
      } catch (e) {
        console.error('Error:', e);
        renderGateShell();
      }
    });
  </script>
</body>
</html>
