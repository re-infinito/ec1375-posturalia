<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Dashboard — EC1375 Paideia Tech (En Vivo)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --dark: #050a1a;
      --dark-light: #0f1428;
      --primary: #0088FF;
      --accent: #FFD700;
      --text: #D0D0D0;
      --text-bright: #FFFFFF;
      --success: #00FF88;
      --danger: #FF3333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .dashboard { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 24px; font-weight: 700; color: var(--text-bright); }

    .refresh-btn {
      padding: 10px 18px;
      background: var(--dark-light);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--primary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .refresh-btn:hover { background: rgba(0, 136, 255, 0.1); }
    .refresh-btn.loading { opacity: 0.6; cursor: wait; }

    .last-update { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin-top: 4px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 2rem;
    }

    .kpi-card {
      background: var(--dark-light);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
    }

    .kpi-label { font-size: 11px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .kpi-value { font-size: 28px; font-weight: 700; color: var(--text-bright); font-family: 'Courier New', monospace; }
    .kpi-delta { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin-top: 6px; }
    .kpi-delta.positive { color: var(--success); }

    .section-title { font-size: 16px; font-weight: 700; color: var(--text-bright); margin: 2rem 0 1rem; }

    .chart-container {
      background: var(--dark-light);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      margin-bottom: 1.5rem;
    }

    .funnel-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .funnel-label { min-width: 140px; font-size: 13px; color: rgba(255, 255, 255, 0.5); }
    .funnel-fill {
      flex: 1;
      height: 36px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: white;
      font-size: 12px;
      font-weight: 500;
    }
    .funnel-meta { min-width: 80px; text-align: right; font-size: 12px; color: rgba(255, 255, 255, 0.3); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 1rem;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-box { width: 12px; height: 12px; border-radius: 2px; }

    .phase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .phase-card {
      background: var(--dark-light);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
    }

    .phase-name { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-bottom: 8px; }
    .progress-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .progress-fill { height: 100%; border-radius: 3px; }

    .phase-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
    }

    .stat-item { color: rgba(255, 255, 255, 0.4); }
    .stat-value { color: var(--text-bright); font-weight: 600; }

    .loading-text { text-align: center; color: rgba(255, 255, 255, 0.4); padding: 60px 20px; }
    .error-text { text-align: center; color: #FF6B6B; padding: 60px 20px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <div>
        <h1>📊 KPI Dashboard — EC1375 Paideia Tech</h1>
        <div class="last-update">Última actualización: <span id="lastUpdate">cargando...</span></div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">🔄 Actualizar</button>
    </div>
    <div id="content">
      <div class="loading-text">⏳ Cargando datos en vivo desde Supabase...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://numsuiuwrvpprhnxovmh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51bXN1aXV3cnZwcHJobnhvdm1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2OTg3MDAsImV4cCI6MjEwMzI3NDcwMH0.LA_MJzLcJyVtysxsJAmWwWzKwgynNm-f6ejGEaEpG1Y';

    let supabase = window.supabaseClient;
    if (!supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      window.supabaseClient = supabase;
    }
    let autoRefreshInterval = null;

    async function loadData() {
      try {
        document.getElementById('refreshBtn').classList.add('loading');

        const [precios, pagos, candidatos] = await Promise.all([
          supabase.from('candidatos_precio').select('*'),
          supabase.from('candidatos_fase_pagos').select('*'),
          supabase.from('candidatos_ec1375').select('*')
        ]);

        if (precios.error || pagos.error) throw new Error('Error cargando datos');

        const preciosData = precios.data || [];
        const pagosData = pagos.data || [];
        const candidatosData = candidatos.data || [];

        // Agrupar pagos por email y fase
        const pagosPorEmail = {};
        pagosData.forEach(p => {
          if (!pagosPorEmail[p.email]) pagosPorEmail[p.email] = {};
          pagosPorEmail[p.email][p.fase] = true;
        });

        // KPIs
        const totalInscritos = preciosData.length;
        const completados = preciosData.filter(p => pagosPorEmail[p.email]?.entrega).length;
        const enProgreso = totalInscritos - completados;

        // Ingresos por fase
        const ingresosPorFase = { registro: 0, alineacion: 0, evaluacion: 0, entrega: 0 };
        preciosData.forEach(p => {
          const email = p.email;
          const pagos = pagosPorEmail[email] || {};
          if (pagos.registro && p.monto_registro) ingresosPorFase.registro += p.monto_registro;
          if (pagos.alineacion && p.monto_alineacion) ingresosPorFase.alineacion += p.monto_alineacion;
          if (pagos.evaluacion && p.monto_evaluacion) ingresosPorFase.evaluacion += p.monto_evaluacion;
          if (pagos.entrega && p.monto_entrega) ingresosPorFase.entrega += p.monto_entrega;
        });

        const ingresosTotales = Object.values(ingresosPorFase).reduce((a, b) => a + b, 0);
        const proyectado = preciosData.reduce((sum, p) => sum + (p.total_acordado || 0), 0);

        // Candidatos por fase
        const porFase = {
          registro: preciosData.filter(p => pagosPorEmail[p.email]?.registro).length,
          alineacion: preciosData.filter(p => pagosPorEmail[p.email]?.alineacion).length,
          evaluacion: preciosData.filter(p => pagosPorEmail[p.email]?.evaluacion).length,
          entrega: preciosData.filter(p => pagosPorEmail[p.email]?.entrega).length
        };

        renderDashboard({
          totalInscritos,
          completados,
          enProgreso,
          ingresosTotales,
          proyectado,
          ingresosPorFase,
          porFase
        });

        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('refreshBtn').classList.remove('loading');
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('content').innerHTML = `
          <div class="error-text">⚠️ Error al cargar datos: ${error.message}</div>
        `;
        document.getElementById('refreshBtn').classList.remove('loading');
      }
    }

    function renderDashboard(data) {
      const {
        totalInscritos,
        completados,
        enProgreso,
        ingresosTotales,
        proyectado,
        ingresosPorFase,
        porFase
      } = data;

      const html = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Total Inscritos</div>
            <div class="kpi-value">${totalInscritos}</div>
            <div class="kpi-delta">${completados} completados</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Ingresos Realizados</div>
            <div class="kpi-value">$${(ingresosTotales / 1000).toFixed(1)}K</div>
            <div class="kpi-delta">${proyectado > 0 ? ((ingresosTotales / proyectado) * 100).toFixed(1) + '%' : '0%'} de proyectado</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">En Progreso</div>
            <div class="kpi-value">${enProgreso}</div>
            <div class="kpi-delta">${totalInscritos > 0 ? ((enProgreso / totalInscritos) * 100).toFixed(1) : 0}%</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Certificados</div>
            <div class="kpi-value">${completados}</div>
            <div class="kpi-delta">${totalInscritos > 0 ? ((completados / totalInscritos) * 100).toFixed(1) : 0}% entregados</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Valor Promedio</div>
            <div class="kpi-value">$${totalInscritos > 0 ? (proyectado / totalInscritos / 1000).toFixed(1) : 0}K</div>
            <div class="kpi-delta">Por candidato</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Proyección Total</div>
            <div class="kpi-value">$${(proyectado / 1000).toFixed(1)}K</div>
            <div class="kpi-delta">Si todos completan</div>
          </div>
        </div>

        <div class="chart-container">
          <h2 class="section-title">Flujo de Conversión por Fase</h2>
          <div>
            ${[
              { fase: 'registro', label: 'Registro', color: '#2a78d6' },
              { fase: 'alineacion', label: 'Alineación', color: '#eb6834' },
              { fase: 'evaluacion', label: 'Evaluación', color: '#1baf7a' },
              { fase: 'entrega', label: 'Entrega', color: '#eda100' }
            ].map(({ fase, label, color }) => {
              const cantidad = porFase[fase];
              const pct = totalInscritos > 0 ? (cantidad / totalInscritos) * 100 : 0;
              const monto = ingresosPorFase[fase];

              return `
                <div class="funnel-bar">
                  <div class="funnel-label">${label}</div>
                  <div class="funnel-fill" style="width: ${Math.max(pct, 5)}%; background: ${color};">
                    <span>${cantidad} candidatos (${pct.toFixed(1)}%)</span>
                  </div>
                  <div class="funnel-meta">$${(monto / 1000).toFixed(0)}K</div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="legend">
            <div class="legend-item"><div class="legend-box" style="background: #2a78d6;"></div><span>Registro</span></div>
            <div class="legend-item"><div class="legend-box" style="background: #eb6834;"></div><span>Alineación</span></div>
            <div class="legend-item"><div class="legend-box" style="background: #1baf7a;"></div><span>Evaluación</span></div>
            <div class="legend-item"><div class="legend-box" style="background: #eda100;"></div><span>Entrega</span></div>
          </div>
        </div>

        <h2 class="section-title">Progreso por Fase</h2>
        <div class="phase-grid">
          ${[
            { fase: 'registro', label: '1. Registro', color: '#2a78d6' },
            { fase: 'alineacion', label: '2. Alineación', color: '#eb6834' },
            { fase: 'evaluacion', label: '3. Evaluación', color: '#1baf7a' },
            { fase: 'entrega', label: '4. Entrega', color: '#eda100' }
          ].map(({ fase, label, color }) => {
            const cantidad = porFase[fase];
            const pct = totalInscritos > 0 ? (cantidad / totalInscritos) * 100 : 0;
            const monto = ingresosPorFase[fase];

            return `
              <div class="phase-card">
                <div class="phase-name">${label}</div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${pct}%; background: ${color};"></div>
                </div>
                <div class="phase-stats">
                  <div class="stat-item">Candidatos: <span class="stat-value">${cantidad}</span></div>
                  <div class="stat-item">Avance: <span class="stat-value">${pct.toFixed(1)}%</span></div>
                  <div class="stat-item">Ingresos: <span class="stat-value">$${(monto / 1000).toFixed(0)}K</span></div>
                  <div class="stat-item">Promedio: <span class="stat-value">${monto > 0 && cantidad > 0 ? '$' + (monto / cantidad / 1000).toFixed(1) + 'K' : '-'}</span></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      document.getElementById('content').innerHTML = html;
    }

    function refreshData() {
      loadData();
    }

    // Auto-refresh cada 30 segundos
    window.addEventListener('load', () => {
      loadData();
      autoRefreshInterval = setInterval(loadData, 30000);
    });

    window.addEventListener('beforeunload', () => {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    });
  </script>
</body>
</html>
