<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Registro de candidato — Paideia Tech">
    <meta name="theme-color" content="#050a1a">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Registro de candidato - EC1375 Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="firma-candidato.js"></script>
    <!-- Sin data-crm-page: el shell (sidebar de los 10 pasos) NO se monta aquí,
         porque todavía no hay proceso que recorrer. Se carga solo por el
         sistema visual: inyecta los tokens de tema antes del primer pintado
         (sin flash) y el <link> a crm-shell.css con .crm-iconbtn y los SVG. -->
    <script src="crm-shell.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Los 9 tokens compartidos (valores oscuros) + --border/--surface-2,
           igual que todas las páginas del flujo. html[data-theme="light"|"dark"]
           de crm-shell.js le gana a este :root y hace el modo claro. */
        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
            --border: rgba(255,255,255,0.12);
            --surface-2: rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* ---- Encabezado: mismo alto y tratamiento que .crm-topbar ---- */
        .top-bar {
            position: sticky; top: 0; z-index: 150;
            background: var(--dark-light);
            border-bottom: 1px solid var(--border);
        }
        .top-bar-inner {
            max-width: 560px; margin: 0 auto; padding: 0 20px;
            min-height: 56px; display: flex; align-items: center; gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: 1; min-width: 0; }
        /* Mismo tratamiento del logo que .crm-brand img del sidebar: teja blanca
           redondeada. El PNG trae fondo oscuro, así que sin la teja se ve como
           una calcomanía negra sobre el tema claro. */
        .brand img {
            height: 34px; width: auto; max-width: 120px; object-fit: contain; flex-shrink: 0;
            border-radius: 8px; background: #fff; padding: 3px 5px;
            border: 1px solid var(--border);
        }
        .brand-titles { min-width: 0; }
        .brand-title {
            display: block; font-size: 0.95rem; font-weight: 700; color: var(--text-bright);
            line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .brand-sub {
            display: block; font-size: 0.78rem; color: var(--text); line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* Barra de avance de 3px pegada al borde inferior, como .crm-topbar-progress */
        .top-bar-progress { height: 3px; background: transparent; }
        .top-bar-progress > span { display: block; height: 100%; width: 0; background: var(--primary); transition: width 0.3s ease; }

        .container { max-width: 560px; margin: 0 auto; padding: 24px 20px; }

        /* ---- Pasos ---- */
        .pasos { display: flex; align-items: center; gap: 6px; margin-bottom: 22px; }
        .paso {
            flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0;
            font-size: 0.74rem; color: var(--text); font-weight: 600;
        }
        .paso-num {
            width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); background: var(--surface-2);
            font-size: 0.72rem; font-weight: 700; color: var(--text);
        }
        .paso.is-done .paso-num { background: var(--success); border-color: var(--success); color: var(--dark); }
        .paso.is-current .paso-num { background: var(--primary); border-color: var(--primary); color: #fff; }
        .paso.is-current { color: var(--text-bright); }
        .paso-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 520px) { .paso-label { display: none; } .paso { flex: 0 0 auto; } .pasos { justify-content: center; gap: 10px; } }

        /* ---- Hero ---- */
        .hero { text-align: center; padding: 8px 0 24px; }
        .hero-icon {
            width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface-2); border: 1px solid var(--border); color: var(--primary);
        }
        .hero-title { font-size: 1.6rem; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.95rem; color: var(--text); }

        /* ---- Tarjetas y formularios (mismos componentes que panel.html) ---- */
        .card {
            background: var(--dark-light); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.15rem; color: var(--text-bright); margin-bottom: 10px;
            display: flex; align-items: center; gap: 9px;
        }
        .card h3 { font-size: 1rem; color: var(--text-bright); margin-bottom: 10px; }
        .card p { font-size: 0.92rem; }

        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.85rem; color: var(--text); margin-bottom: 6px; font-weight: 600; }
        .field-group input {
            width: 100%; padding: 14px; background: var(--dark);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-bright); font-size: 1rem; font-family: inherit;
        }
        .field-group input:focus { outline: none; border-color: var(--primary); }
        .field-group input:disabled { opacity: 0.65; cursor: not-allowed; }
        .field-hint { font-size: 0.8rem; color: var(--text); margin-top: 4px; }

        /* Mismo tratamiento que .info-box del Autodiagnóstico */
        .info-box {
            background: var(--dark); border-left: 4px solid var(--primary);
            border-radius: 8px; padding: 20px; margin-bottom: 20px; text-align: left;
        }
        .info-box h3 { color: var(--text-bright); font-size: 1rem; margin-bottom: 10px; }
        .info-box ul { padding-left: 20px; color: var(--text); font-size: 0.92rem; }
        .info-box li { margin-bottom: 6px; }
        .info-box p { color: var(--text); font-size: 0.92rem; }

        .checkbox-row {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 14px; background: var(--dark); border: 1px solid var(--border);
            border-radius: 8px; margin-top: 12px;
        }
        .checkbox-row.is-ok { border-color: var(--success); }
        .checkbox-row.is-pendiente { border-color: var(--danger); }
        .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
        .checkbox-row label { font-size: 0.85rem; color: var(--text); cursor: pointer; }

        /* ---- Firma: mismos controles que el paso 'nda' del Autodiagnóstico ---- */
        .sig-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
        .sig-estado { font-size: 0.75rem; color: var(--text); white-space: nowrap; }
        .sig-estado.is-ok { color: var(--success); }
        .sig-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .sig-tab-btn {
            flex: 1; padding: 10px; background: var(--dark); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer;
            font-family: inherit; font-weight: 600;
        }
        .sig-tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .sig-tab-btn.is-link { flex: 0 0 auto; margin-top: 10px; }
        #ndaSignatureCanvas {
            width: 100%; max-width: 500px; height: 160px;
            background: #fff; border-radius: 8px; border: 2px solid var(--border);
            touch-action: none; display: block; cursor: crosshair;
        }

        /* ---- Botones ---- */
        .btn {
            padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease; text-align: center;
            text-decoration: none; display: flex; align-items: center; justify-content: center;
            gap: 8px; font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-top: 10px; }
        .btn-secondary:hover { background: var(--surface-2); }
        .btn-ghost {
            background: var(--surface-2); border: 1px solid var(--border);
            color: var(--text-bright); margin-top: 10px; font-weight: 600;
        }
        .btn-ghost:hover { border-color: var(--primary); }
        .btn-full { width: 100%; }

        .msg { font-size: 0.88rem; margin: 12px 0; text-align: center; }
        .msg.error { color: var(--danger); }
        .msg.success { color: var(--success); }
        .spinner { text-align: center; color: var(--text); font-size: 0.9rem; padding: 10px 0; }

        /* ---- Resumen final ---- */
        .resumen { font-size: 0.9rem; }
        .resumen-fila {
            display: flex; justify-content: space-between; gap: 14px;
            padding: 10px 0; border-bottom: 1px solid var(--border);
        }
        .resumen-fila:last-child { border-bottom: 0; }
        .resumen-fila dt { color: var(--text); flex-shrink: 0; }
        .resumen-fila dd { color: var(--text-bright); font-weight: 600; text-align: right; min-width: 0; word-break: break-word; }
        /* El verde se usa como señal (el ✓), no como color de texto: --success
           sobre la tarjeta clara da 4.4:1, por debajo del 4.5:1 de AA para
           texto normal. El texto va en --text-bright (11.6:1). */
        .ok-check { color: var(--success); display: inline-flex; margin-right: 6px; vertical-align: -2px; }
        .card h2 .ok-check { margin-right: 0; }
        @media (max-width: 460px) {
            .resumen-fila { flex-direction: column; gap: 2px; }
            .resumen-fila dd { text-align: left; }
        }
        .firma-box {
            margin-top: 16px; padding: 14px; border: 1px dashed var(--border);
            border-radius: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .firma-box-label { font-size: 0.78rem; color: var(--text); }

        .pie { text-align: center; font-size: 0.78rem; color: var(--text); padding: 4px 0 0; }
        .pie a { color: var(--primary); }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <span class="brand">
                <img src="Logos/Logo Paideia Tech - trimmed.png" alt="Paideia Tech">
                <span class="brand-titles">
                    <span class="brand-title">Registro de candidato</span>
                    <span class="brand-sub" id="barraPaso"></span>
                </span>
            </span>
            <button type="button" class="crm-iconbtn" data-crm-theme-btn="icon"
                    title="Cambiar tema" aria-label="Cambiar tema" onclick="CrmShell.toggleTheme()"></button>
        </div>
        <div class="top-bar-progress"><span id="barraAvance"></span></div>
    </header>

    <main class="container">
        <div class="pasos" id="pasos" hidden></div>
        <div class="hero">
            <div class="hero-icon" id="heroIcono"></div>
            <h1 class="hero-title" id="heroTitulo">Regístrate en Paideia Tech</h1>
            <p class="hero-subtitle" id="heroSubtitulo">Tu nombre, tu correo y la firma del Acuerdo de Confidencialidad. Toma dos minutos.</p>
        </div>
        <div id="app"><p class="spinner">Cargando...</p></div>
        <p class="pie">¿Dudas? <a href="mailto:contacto@paideiatech.com">contacto@paideiatech.com</a></p>
    </main>

    <script>
    /* =========================================================
       registro.html — alta inicial del candidato (20 sep 2026).

       Liga que el equipo comparte con alguien que todavía no existe en
       ninguna parte del sistema: captura nombre + correo, le hace firmar
       el Acuerdo de Confidencialidad del EC1375 y crea su cuenta de
       Supabase Auth. Deliberadamente NO pasa por isEmailAuthorized(): este
       es el trámite con el que un correo empieza a existir, no una página
       gateada por fase pagada.

       Lo que se guarda y dónde: Auth.registrarCandidato() (auth.js) — el
       Acuerdo vive en las MISMAS llaves de autodiagnostico_data que usa el
       paso 'nda' de autodiagnostico.html, así que quien firma aquí NO lo
       vuelve a firmar allá. Ver el comentario de esa función.

       Sistema visual: los 9 tokens compartidos + --border/--surface-2, con
       el tema claro/oscuro de crm-shell.js (misma llave 'paideia-theme' que
       el resto del sitio). El shell NO se monta — su sidebar son los 10
       pasos del flujo, y aquí todavía no hay flujo. Los componentes
       (.card, .field-group, .info-box, .checkbox-row, .sig-tab-btn, el
       canvas de la firma) son los mismos de panel.html y del paso 'nda'
       del Autodiagnóstico, a propósito: quien vuelva a verlos allá los
       reconoce.
    ========================================================= */

    var PASOS = ['datos', 'nda', 'cuenta', 'listo'];
    var ETIQUETAS = { datos: 'Tus datos', nda: 'Confidencialidad', cuenta: 'Tu contraseña', listo: 'Listo' };
    var ICONOS_PASO = { datos: 'users', nda: 'shield', cuenta: 'lock', listo: 'check' };
    var BORRADOR_KEY = 'paideia-registro-borrador';

    var paso = 'datos';
    var sesionPrevia = false;      /* ya había sesión iniciada al abrir la liga */
    var datos = { nombre: '', email: '' };
    var nda = { aceptado: false, mode: 'draw', dataUrl: null, typedName: '' };
    var dibujando = false, ultX = 0, ultY = 0;

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = (str === null || str === undefined) ? '' : String(str);
        return div.innerHTML;
    }

    /* Iconografía oficial: los mismos SVG del shell, nunca un set aparte. */
    function ic(nombre, tam) { return CrmShell.icon(nombre, tam || 18); }

    function firmaActual() { return { mode: nda.mode, dataUrl: nda.dataUrl, typedName: nda.typedName }; }
    function firmaLista() { return FirmaCandidato.firmaValida(firmaActual()); }

    /* Borrador en sessionStorage: dibujar una firma y perderla por una
       recarga sería suficiente para que alguien abandone el registro. Se
       borra al terminar (y al cerrar el navegador, por ser sessionStorage). */
    function guardarBorrador() {
        try { sessionStorage.setItem(BORRADOR_KEY, JSON.stringify({ datos: datos, nda: nda })); } catch (e) { /* sin storage */ }
    }
    function cargarBorrador() {
        try {
            var b = JSON.parse(sessionStorage.getItem(BORRADOR_KEY) || 'null');
            if (!b) return;
            datos = Object.assign(datos, b.datos || {});
            nda = Object.assign(nda, b.nda || {});
            if (nda.mode !== 'draw' && nda.mode !== 'type') nda.mode = 'draw';
        } catch (e) { /* ignore */ }
    }
    function borrarBorrador() {
        try { sessionStorage.removeItem(BORRADOR_KEY); } catch (e) { /* ignore */ }
    }

    /* ---------- render ---------- */

    function irA(nuevo, mensaje) {
        paso = nuevo;
        render(mensaje);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* Los pasos visibles: con sesión ya iniciada no hay contraseña que crear,
       así que ese paso no se le enseña al candidato. */
    function pasosVisibles() {
        return sesionPrevia ? PASOS.filter(function (p) { return p !== 'cuenta'; }) : PASOS;
    }

    function pintarPasos() {
        var lista = pasosVisibles();
        var idx = lista.indexOf(paso);
        var cont = document.getElementById('pasos');
        cont.hidden = false;
        cont.innerHTML = lista.map(function (p, i) {
            var clase = i < idx ? 'is-done' : (i === idx ? 'is-current' : '');
            var num = i < idx ? ic('check', 13) : String(i + 1);
            return '<span class="paso ' + clase + '"><span class="paso-num">' + num + '</span>' +
                   '<span class="paso-label">' + ETIQUETAS[p] + '</span></span>';
        }).join('');
        document.getElementById('barraPaso').textContent = ETIQUETAS[paso] || '';
        document.getElementById('barraAvance').style.width =
            Math.round((idx / (lista.length - 1)) * 100) + '%';
        document.getElementById('heroIcono').innerHTML = ic(ICONOS_PASO[paso], 26);
    }

    function render(mensaje) {
        var app = document.getElementById('app');
        pintarPasos();
        var error = mensaje ? '<p class="msg error">' + escapeHtml(mensaje) + '</p>' : '';

        if (paso === 'datos') app.innerHTML = vistaDatos(error);
        /* initCanvas() va SÍNCRONO, no en un setTimeout: el canvas ya existe en
           cuanto se asigna innerHTML, y diferirlo abría una ventana en la que
           un trazo inmediato (tocar la casilla y firmar de corrido) se perdía
           porque los listeners todavía no estaban puestos. */
        else if (paso === 'nda') { app.innerHTML = vistaNda(error); initCanvas(); }
        else if (paso === 'cuenta') app.innerHTML = vistaCuenta(error);
        else if (paso === 'listo') app.innerHTML = vistaListo();
    }

    function vistaDatos(error) {
        return '' +
        '<div class="card">' +
            '<h2>' + ic('users', 20) + 'Quién eres</h2>' +
            '<p class="field-hint" style="margin-bottom:16px;">Escribe tu nombre <strong>como aparece en tu identificación oficial</strong>: es el que va a llevar tu expediente de certificación y el Acuerdo que vas a firmar en el siguiente paso.</p>' +
            '<div class="field-group">' +
                '<label for="f_nombre">Nombre completo</label>' +
                '<input type="text" id="f_nombre" value="' + escapeHtml(datos.nombre) + '" placeholder="Nombre(s) y apellidos" autocomplete="name">' +
            '</div>' +
            '<div class="field-group">' +
                '<label for="f_email">Correo electrónico</label>' +
                '<input type="email" id="f_email" value="' + escapeHtml(datos.email) + '" placeholder="tu@email.com" autocomplete="email"' + (sesionPrevia ? ' disabled' : '') + '>' +
                '<p class="field-hint">' + (sesionPrevia
                    ? 'Es el correo de la sesión que ya tienes abierta en este dispositivo.'
                    : 'Con este correo entras a la plataforma y recibes todos los avisos de tu proceso. Úsalo bien: cambiarlo después implica volver a empezar tu cuenta.') + '</p>' +
            '</div>' +
            error +
            '<button class="btn btn-primary btn-full" onclick="continuarDatos()">Continuar' + ic('arrow') + '</button>' +
        '</div>';
    }

    function vistaNda(error) {
        var nombre = escapeHtml(datos.nombre) || 'el/la candidato/a';
        var firmado = firmaLista();
        return '' +
        '<div class="card">' +
            '<h2>' + ic('shield', 20) + 'Acuerdo de Confidencialidad (NDA)</h2>' +
            '<p class="field-hint" style="margin-bottom:16px;">Antes de darte acceso a cualquier material necesitamos tu firma de este acuerdo — protege el contenido de evaluación del Estándar EC1375, el material de Paideia Tech y los datos de otros candidatos y pacientes que llegues a conocer.</p>' +
            '<div class="info-box" style="max-height:340px;overflow-y:auto;">' +
                '<h3>Acuerdo de Confidencialidad — Candidato/a EC1375</h3>' +
                '<p style="margin-bottom:10px;">Entre <strong>Paideia Tech</strong> (el Centro Evaluador) y <strong>' + nombre + '</strong>, con motivo de su registro y participación en el proceso de certificación del Estándar de Competencia EC1375.</p>' +
                '<h3 style="margin-top:14px;">1. Qué se considera información confidencial</h3>' +
                '<ul>' +
                    '<li>El contenido del Instrumento de Evaluación de Competencia (IEC), incluyendo las preguntas del Cuestionario y los criterios de la Guía de Observación y Lista de Cotejo.</li>' +
                    '<li>El material de capacitación de Paideia Tech: la Ruta de Estudio, videos, presentaciones y cualquier documento entregado durante la Alineación.</li>' +
                    '<li>Los datos personales de cualquier otro candidato, paciente o usuario que conozcas durante sesiones grupales, prácticas o videos de evaluación — nombre, condición de salud, información de contacto, o cualquier otro dato personal.</li>' +
                    '<li>Las grabaciones de las sesiones de evaluación, propias o de otros candidatos.</li>' +
                '</ul>' +
                '<h3 style="margin-top:14px;">2. Tus obligaciones como candidato/a</h3>' +
                '<ul>' +
                    '<li>No compartir, publicar, fotografiar, grabar ni distribuir el contenido del Cuestionario, el IEC o el material de capacitación, por ningún medio.</li>' +
                    '<li>No divulgar los datos personales de otros candidatos, pacientes o usuarios que conozcas durante el proceso.</li>' +
                    '<li>Usar el material de capacitación únicamente para tu propia preparación, y las grabaciones de tus propias sesiones únicamente para los fines de tu evaluación.</li>' +
                    '<li>Avisar de inmediato a Paideia Tech si detectas una fuga o uso indebido de esta información.</li>' +
                '</ul>' +
                '<h3 style="margin-top:14px;">3. Vigencia y consecuencias</h3>' +
                '<p>Esta confidencialidad aplica durante todo tu proceso de certificación y de forma indefinida respecto al contenido del Cuestionario y del IEC. Incumplirla puede resultar en la cancelación de tu proceso de certificación, sin perjuicio de cualquier otra acción que proceda conforme a la ley.</p>' +
            '</div>' +

            '<div class="checkbox-row ' + (nda.aceptado ? 'is-ok' : 'is-pendiente') + '">' +
                '<input type="checkbox" id="ndaCheck"' + (nda.aceptado ? ' checked' : '') + ' onchange="toggleNda(this)">' +
                '<label for="ndaCheck"' + (nda.aceptado ? ' style="color:var(--success);"' : '') + '>' +
                    'He leído y acepto los términos de este Acuerdo de Confidencialidad (NDA)' +
                '</label>' +
            '</div>' +
        '</div>' +

        '<div class="card">' +
            '<div class="sig-head">' +
                '<h2 style="margin:0;">' + ic('file', 20) + 'Tu firma</h2>' +
                '<span class="sig-estado' + (firmado ? ' is-ok' : '') + '" id="firmaEstado">' + (firmado ? '✓ Completado' : '○ Pendiente') + '</span>' +
            '</div>' +
            '<div class="sig-tabs">' +
                '<button class="sig-tab-btn' + (nda.mode === 'draw' ? ' active' : '') + '" onclick="setModoFirma(\'draw\')">Dibujar firma</button>' +
                '<button class="sig-tab-btn' + (nda.mode === 'type' ? ' active' : '') + '" onclick="setModoFirma(\'type\')">Escribir mi nombre</button>' +
            '</div>' +
            (nda.mode === 'draw'
                ? '<canvas id="ndaSignatureCanvas" width="500" height="160"></canvas>' +
                  '<button class="sig-tab-btn is-link" onclick="limpiarFirma()">' + ic('trash', 15) + ' Borrar y volver a firmar</button>'
                : '<div class="field-group">' +
                      '<label for="f_firmaEscrita">Escribe tu nombre completo como firma</label>' +
                      '<input type="text" id="f_firmaEscrita" value="' + escapeHtml(nda.typedName) + '" placeholder="Nombre completo" oninput="setFirmaEscrita(this.value)">' +
                  '</div>' +
                  '<div class="checkbox-row">' +
                      '<input type="checkbox" ' + (nda.typedName.trim() ? 'checked' : '') + ' disabled>' +
                      '<label>Confirmo que acepto este Acuerdo de Confidencialidad con esta firma</label>' +
                  '</div>') +
            error +
            '<button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="continuarNda()">Firmar y continuar' + ic('arrow') + '</button>' +
            '<button class="btn btn-ghost btn-full" onclick="irA(\'datos\')">Regresar</button>' +
        '</div>';
    }

    function vistaCuenta(error) {
        return '' +
        '<div class="card">' +
            '<h2>' + ic('lock', 20) + 'Crea tu contraseña</h2>' +
            '<p class="field-hint" style="margin-bottom:16px;">Es la que vas a usar para entrar con <strong>' + escapeHtml(datos.email) + '</strong>. Al crear tu cuenta queda guardado tu registro y tu Acuerdo firmado.</p>' +
            '<div class="field-group">' +
                '<label for="f_password">Contraseña (mínimo 6 caracteres)</label>' +
                '<input type="password" id="f_password" placeholder="Crea tu contraseña" autocomplete="new-password">' +
            '</div>' +
            '<div class="field-group">' +
                '<label for="f_passwordConfirm">Confirma tu contraseña</label>' +
                '<input type="password" id="f_passwordConfirm" placeholder="Repite tu contraseña" autocomplete="new-password">' +
            '</div>' +
            '<label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;margin:-4px 0 14px;cursor:pointer;color:var(--text);">' +
                '<input type="checkbox" id="authRememberInput" checked style="width:auto;margin:0;"> Mantener mi sesión iniciada en este dispositivo' +
            '</label>' +
            error +
            '<button class="btn btn-primary btn-full" onclick="crearCuenta()">Crear mi cuenta y registrar mi firma' + ic('arrow') + '</button>' +
            '<button class="btn btn-secondary btn-full" onclick="entrarConCuentaExistente()">Ya tengo cuenta con este correo</button>' +
            '<button class="btn btn-ghost btn-full" onclick="irA(\'nda\')">Regresar</button>' +
        '</div>';
    }

    function vistaListo() {
        var f = firmaActual();
        var previa = FirmaCandidato.vistaPrevia(f);
        return '' +
        '<div class="card">' +
            '<h2><span class="ok-check">' + ic('check', 20) + '</span>Tu registro quedó hecho</h2>' +
            '<p style="margin-bottom:18px;">Ya existes en la plataforma de Paideia Tech y tu Acuerdo de Confidencialidad quedó firmado. No tienes que volver a firmarlo: cuando llegues al Autodiagnóstico lo vas a ver ya palomeado, y tu acuse en PDF se genera ahí mismo.</p>' +
            '<dl class="resumen">' +
                '<div class="resumen-fila"><dt>Nombre</dt><dd>' + escapeHtml(datos.nombre) + '</dd></div>' +
                '<div class="resumen-fila"><dt>Correo</dt><dd>' + escapeHtml(datos.email) + '</dd></div>' +
                '<div class="resumen-fila"><dt>Acuerdo de Confidencialidad</dt><dd><span class="ok-check">' + ic('check', 15) + '</span>Firmado el ' + escapeHtml(fechaLegible()) + '</dd></div>' +
            '</dl>' +
            (previa ? '<div class="firma-box"><span class="firma-box-label">Tu firma:</span>' + previa + '</div>' : '') +
        '</div>' +
        '<div class="card">' +
            '<h2>' + ic('arrow', 20) + '¿Y ahora?</h2>' +
            '<p style="margin-bottom:18px;">Tu panel te va diciendo, paso por paso, qué sigue en tu proceso de certificación.</p>' +
            '<a class="btn btn-primary btn-full" href="panel.html">Ir a mi panel' + ic('arrow') + '</a>' +
            '<a class="btn btn-secondary btn-full" href="https://wa.me/528115026729?text=' + encodeURIComponent('Hola, acabo de registrarme en la plataforma con el correo ' + datos.email + '. ¿Cuál es mi siguiente paso?') + '" target="_blank" rel="noopener">' + ic('message') + 'Escribirle al equipo por WhatsApp</a>' +
        '</div>';
    }

    function fechaLegible() {
        var d = new Date();
        return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
    }

    /* ---------- paso 1: datos ---------- */

    function continuarDatos() {
        var nombre = (document.getElementById('f_nombre').value || '').trim();
        var email = sesionPrevia ? datos.email : (document.getElementById('f_email').value || '').trim().toLowerCase();
        if (nombre.length < 3) { datos.nombre = nombre; datos.email = email; render('Escribe tu nombre completo.'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { datos.nombre = nombre; datos.email = email; render('Escribe un correo válido.'); return; }
        datos.nombre = nombre;
        datos.email = email;
        guardarBorrador();
        irA('nda');
    }

    /* ---------- paso 2: Acuerdo de Confidencialidad ---------- */

    function toggleNda(el) {
        nda.aceptado = el.checked;
        guardarBorrador();
        render();
    }

    function setModoFirma(modo) {
        nda.mode = modo;
        guardarBorrador();
        render();
    }

    function setFirmaEscrita(valor) {
        nda.typedName = valor;
        guardarBorrador();
        pintarEstadoFirma();
    }

    /* Se actualiza sin re-render para no perder el foco del campo mientras
       el candidato escribe su nombre. */
    function pintarEstadoFirma() {
        var el = document.getElementById('firmaEstado');
        if (!el) return;
        var ok = firmaLista();
        el.textContent = ok ? '✓ Completado' : '○ Pendiente';
        el.classList.toggle('is-ok', ok);
    }

    function limpiarFirma() {
        nda.dataUrl = null;
        guardarBorrador();
        render();
    }

    /* Mismo canvas que el paso 'nda' de autodiagnostico.html: mouse y touch,
       coordenadas reescaladas porque el canvas se dibuja a 500x160 pero se
       muestra al ancho del celular. El fondo va en blanco en los dos temas:
       es papel, y así el PNG de la firma se ve igual en el PDF del acuse. */
    function initCanvas() {
        var canvas = document.getElementById('ndaSignatureCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';

        if (nda.dataUrl) {
            var img = new Image();
            img.onload = function () { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
            img.src = nda.dataUrl;
        }

        function pos(e) {
            var rect = canvas.getBoundingClientRect();
            var sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            if (e.touches && e.touches.length) {
                return { x: (e.touches[0].clientX - rect.left) * sx, y: (e.touches[0].clientY - rect.top) * sy };
            }
            return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
        }
        function empezar(e) { e.preventDefault(); dibujando = true; var p = pos(e); ultX = p.x; ultY = p.y; }
        function trazar(e) {
            if (!dibujando) return;
            e.preventDefault();
            var p = pos(e);
            ctx.beginPath();
            ctx.moveTo(ultX, ultY);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            ultX = p.x; ultY = p.y;
        }
        function terminar() {
            if (!dibujando) return;
            dibujando = false;
            nda.dataUrl = canvas.toDataURL('image/png');
            guardarBorrador();
            pintarEstadoFirma();
        }

        canvas.addEventListener('mousedown', empezar);
        canvas.addEventListener('mousemove', trazar);
        canvas.addEventListener('mouseup', terminar);
        canvas.addEventListener('mouseleave', terminar);
        canvas.addEventListener('touchstart', empezar, { passive: false });
        canvas.addEventListener('touchmove', trazar, { passive: false });
        canvas.addEventListener('touchend', terminar);
    }

    function continuarNda() {
        if (!nda.aceptado) { render('Necesitas aceptar el Acuerdo de Confidencialidad para continuar.'); return; }
        if (!firmaLista()) {
            render(nda.mode === 'draw' ? 'Dibuja tu firma en el recuadro blanco.' : 'Escribe tu nombre completo como firma.');
            return;
        }
        guardarBorrador();
        /* Con sesión ya iniciada no hay contraseña que crear: se guarda directo. */
        if (sesionPrevia) { guardarRegistro(); return; }
        irA('cuenta');
    }

    /* ---------- paso 3: cuenta ---------- */

    async function crearCuenta() {
        var password = document.getElementById('f_password').value || '';
        var confirm = document.getElementById('f_passwordConfirm').value || '';
        if (password.length < 6) { render('La contraseña debe tener al menos 6 caracteres.'); return; }
        if (password !== confirm) { render('Las contraseñas no coinciden.'); return; }

        Auth._applyRememberChoice();   /* lee #authRememberInput, igual que el gate de auth.js */
        document.getElementById('app').innerHTML = '<div class="card"><p class="spinner">Creando tu cuenta...</p></div>';
        try {
            var res = await supabaseClient.auth.signUp({ email: datos.email, password: password });
            if (res.error) {
                irA('cuenta', 'Este correo ya tiene cuenta. Usa "Ya tengo cuenta con este correo" para entrar con tu contraseña y guardar tu firma.');
                return;
            }
            if (!res.data.session) {
                /* No debería pasar con "Confirm email" desactivado en Supabase,
                   pero si pasa no se deja al candidato varado sin saber qué hacer. */
                irA('cuenta', 'Tu cuenta se creó, pero falta confirmarla desde el correo que te mandamos. Confírmala y vuelve a abrir esta liga para firmar.');
                return;
            }
            await guardarRegistro();
        } catch (e) {
            irA('cuenta', 'No se pudo crear tu cuenta. Revisa tu conexión e intenta de nuevo.');
        }
    }

    /* Para quien ya se registró antes (o el equipo le creó la cuenta) y
       vuelve por esta liga solo a firmar el Acuerdo. */
    async function entrarConCuentaExistente() {
        var password = document.getElementById('f_password').value || '';
        if (!password) { render('Escribe tu contraseña arriba para entrar con tu cuenta.'); return; }
        Auth._applyRememberChoice();
        document.getElementById('app').innerHTML = '<div class="card"><p class="spinner">Entrando...</p></div>';
        try {
            var res = await supabaseClient.auth.signInWithPassword({ email: datos.email, password: password });
            if (res.error || !res.data.session) {
                irA('cuenta', 'Contraseña incorrecta, o todavía no la has creado. Si no la recuerdas, pídela desde "Iniciar sesión" en el panel.');
                return;
            }
            await guardarRegistro();
        } catch (e) {
            irA('cuenta', 'No se pudo iniciar sesión. Intenta de nuevo.');
        }
    }

    /* ---------- guardado ---------- */

    async function guardarRegistro() {
        document.getElementById('app').innerHTML = '<div class="card"><p class="spinner">Guardando tu registro y tu firma...</p></div>';
        var res = await Auth.registrarCandidato({ nombre: datos.nombre, email: datos.email, nda: firmaActual() });
        if (res.error) {
            /* Falla honesta: la cuenta puede haber quedado creada, pero el
               registro no — decirlo, no dejarlo creer que ya quedó. */
            irA(sesionPrevia ? 'nda' : 'cuenta', 'Tu cuenta quedó lista, pero no se pudo guardar tu registro. Revisa tu conexión y vuelve a intentar; si sigue fallando, escríbenos por WhatsApp.');
            return;
        }
        borrarBorrador();
        document.getElementById('heroTitulo').textContent = '¡Bienvenido a Paideia Tech!';
        document.getElementById('heroSubtitulo').textContent = 'Tu cuenta y tu Acuerdo de Confidencialidad quedaron guardados.';
        irA('listo');
    }

    /* ---------- arranque ---------- */

    (async function () {
        /* El botón de tema se pinta con el icono correcto (sol/luna) en cuanto
           existe en el DOM: crm-shell.js aplicó el tema antes del primer
           pintado, cuando este <button> todavía no existía. */
        CrmShell.applyTheme();
        cargarBorrador();
        try {
            var session = await Auth.getSession();
            if (session && session.user) {
                sesionPrevia = true;
                datos.email = session.user.email || datos.email;
                if (!datos.nombre) {
                    var row = await Auth.pullMyRow();
                    if (row && row.nombre) datos.nombre = row.nombre;
                    /* Ya firmado antes: se le dice, y puede volver a firmar
                       si quiere (p. ej. cambió su nombre legal). */
                    if (row && row.autodiagnostico_data && row.autodiagnostico_data.ndaAccepted) {
                        document.getElementById('heroSubtitulo').textContent = 'Ya tienes tu registro y tu Acuerdo firmado. Puedes revisarlo y volver a firmarlo si algo cambió.';
                    }
                }
            }
        } catch (e) { /* sin sesión: registro normal */ }
        render();
    })();
    </script>
</body>
</html>
