<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Admin — Reparto de Utilidades EC1375</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="flow-status.js"></script>
    <script src="crm-shell.js" data-crm-mode="admin" data-crm-page="admin-utilidades"></script>
    <script src="admin-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF;
            --accent: #FFD700; --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
            --border: rgba(255,255,255,0.12); --surface-2: rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 60px;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
        .top-bar {
            position: sticky; top: 0; background: var(--dark); border-bottom: 1px solid var(--dark-light);
            padding: 16px 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar-inner { font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .top-bar a { color: var(--primary); font-size: 0.82rem; text-decoration: none; margin-left: 20px; }

        .card { background: var(--dark-light); border-radius: 12px; padding: 22px; margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; color: var(--text-bright); margin-bottom: 16px; }

        .field-group { margin-bottom: 14px; }
        .field-group label { display: block; font-size: 0.82rem; color: var(--text); margin-bottom: 5px; font-weight: 600; }
        .field-group input, .field-group select { width: 100%; padding: 10px 12px; background: var(--dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text-bright); font-size: 0.9rem; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .checkbox-group label { margin: 0; font-size: 0.9rem; }

        .btn { padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; border: none; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-primary:disabled { background: rgba(0,136,255,0.3); cursor: not-allowed; }

        .lote-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .lote-btn { padding: 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .lote-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .lote-btn:hover { border-color: var(--primary); }

        .reparto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .reparto-card { background: rgba(0,136,255,0.08); border: 1px solid rgba(0,136,255,0.2); border-radius: 8px; padding: 16px; }
        .reparto-title { font-weight: 700; color: var(--text-bright); margin-bottom: 12px; font-size: 0.95rem; }
        .reparto-item { margin-bottom: 12px; }
        .reparto-label { font-size: 0.8rem; color: var(--text); margin-bottom: 4px; }
        .reparto-input-group { display: flex; gap: 8px; }
        .reparto-input-group input { flex: 1; }
        .reparto-percent { font-size: 0.85rem; color: var(--accent); font-weight: 700; }

        .resumen { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.2); border-radius: 8px; padding: 16px; }
        .resumen-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; padding: 10px 0; border-bottom: 1px solid rgba(0,255,136,0.1); }
        .resumen-row:last-child { border-bottom: none; }
        .resumen-valor { font-size: 1.1rem; font-weight: 700; color: var(--success); }

        .neto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 4px 0 12px; }
        .neto-label { font-size: 0.78rem; color: var(--text); text-transform: uppercase; letter-spacing: 0.3px; }
        .neto-valor { font-size: 1.7rem; font-weight: 700; color: var(--text-bright); }

        .gasto-row { display: grid; grid-template-columns: 2fr 1.1fr 1fr 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .gasto-row:last-child { border-bottom: none; }
        .gasto-row input[type="number"] { width: 100%; padding: 8px 10px; background: var(--dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text-bright); font-size: 0.95rem; font-weight: 700; }
        .gasto-sub { font-size: 0.74rem; color: var(--text); opacity: 0.8; margin-top: 2px; }
        .gasto-calc { font-size: 0.85rem; color: var(--text); }
        .gasto-total { font-size: 1.05rem; font-weight: 700; color: var(--danger); text-align: right; }
        @media (max-width: 760px) { .gasto-row { grid-template-columns: 1fr 1fr; } .gasto-total { text-align: left; } }

        .gasto-grupo { margin-top: 16px; }
        .gasto-grupo h3 { font-size: 0.95rem; color: var(--text-bright); margin: 0 0 2px; }
        .gasto-grupo .hint { font-size: 0.78rem; color: var(--text); opacity: 0.85; margin-bottom: 8px; }

        .ficha-fases, .ficha-tabla { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .ficha-fases th, .ficha-tabla th { text-align: right; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text); padding: 6px 10px; border-bottom: 1px solid var(--border); }
        .ficha-fases td, .ficha-tabla td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-bright); }
        .ficha-tabla th:first-child, .ficha-tabla td:first-child { text-align: left; }
        .ficha-tabla td.neg { color: var(--danger); }
        .ficha-tabla tr.total td { font-weight: 700; border-top: 2px solid var(--border); }
        .ficha-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 16px; }
        .ficha-grid h3 { font-size: 0.95rem; color: var(--text-bright); margin-bottom: 6px; }
        .ficha-res { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }
        .ficha-res > div { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
        .ficha-res .k { font-size: 0.72rem; text-transform: uppercase; color: var(--text); }
        .ficha-res .v { font-size: 1.25rem; font-weight: 700; color: var(--text-bright); }
        .scroll-x { overflow-x: auto; }
        .fase-tabla { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 640px; }
        .fase-tabla th { text-align: right; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        .fase-tabla th:first-child, .fase-tabla td:first-child { text-align: left; }
        .fase-tabla td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text-bright); white-space: nowrap; }
        .fase-tabla td.neg { color: var(--danger); }
        .fase-tabla td.vacio { color: var(--text); opacity: 0.35; }
        .fase-tabla tr.sec td { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--primary-light); padding-top: 16px; border-bottom: none; font-weight: 700; }
        .fase-tabla tr.sub td { font-weight: 700; border-top: 2px solid var(--border); }
        .fase-tabla tr.gana td { font-weight: 700; color: var(--success); }
        .fase-tabla td.col-total, .fase-tabla th.col-total { background: var(--surface-2); }
        .fase-tabla .nota { display: block; font-size: 0.72rem; color: var(--text); font-weight: 400; }
        .corte-tabla td.nom { white-space: normal; min-width: 170px; }
        .corte-tabla .estado { display: inline-block; font-size: 0.68rem; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); margin-top: 2px; }
        .corte-tabla tr.pie td { font-weight: 700; border-top: 2px solid var(--border); background: var(--surface-2); }
        .corte-tabla tr.pie-total td { font-weight: 800; color: var(--success); background: var(--surface-2); }
        details.ref > summary { cursor: pointer; font-size: 1.05rem; font-weight: 700; color: var(--text-bright); }
        .gasto-row select { width: 100%; padding: 6px 8px; background: var(--dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text-bright); font-size: 0.8rem; margin-top: 4px; }

        .error { color: var(--danger); font-size: 0.85rem; margin-top: 4px; }
        .loading { text-align: center; padding: 40px; color: var(--text); }
            body.crm-active .top-bar { display: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">💵 Admin — Reparto de Utilidades</div>
        <div style="display:flex;gap:16px;">
            <a href="admin-index.html">🗂️ Índice</a>
            <a href="admin-kpis.html">📊 KPIs</a>
            <a href="admin-precios.html">💰 Precios</a>
            <a href="#" id="logoutLink" onclick="handleLogout()" style="display:none;">Cerrar sesión</a>
        </div>
    </div>
    <div class="container" id="app"></div>

    <script>
    let candidatos = [];
    let pagosPorEmail = {};
    let loteActivo = 1;
    let configuracionLotes = {};
    let nombresCandidatos = [];
    // 50 + 16.67 × 3 = 100.01: el reparto estándar (Chris 50% y tres socios iguales) debe poder guardarse.
    const TOLERANCIA_TOTAL = 0.011;

    function renderGateShell() {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div style="max-width:420px;margin:0 auto;padding:40px 20px;">
                <div style="text-align:center;margin-bottom:30px;">
                    <div style="font-size:3rem;margin-bottom:14px;">💵</div>
                    <h1 style="font-size:1.5rem;font-weight:700;color:var(--text-bright);margin-bottom:8px;">Reparto de Utilidades</h1>
                </div>
                <div class="card" id="adminGateContainer"></div>
            </div>`;
        Auth.renderAdminGate(document.getElementById('adminGateContainer'), { onVerified: boot });
    }

    async function handleLogout() {
        await Auth.signOut();
        window.location.reload();
    }

    async function cargarDatos() {
        const [precios, pagos, config, nombres] = await Promise.all([
            supabaseClient.from('candidatos_precio').select('*'),
            supabaseClient.from('candidatos_fase_pagos').select('email,fase'),
            supabaseClient.from('reparto_utilidades').select('*'),
            supabaseClient.rpc('admin_lista_nombres').then(r => r, () => ({ data: [] }))
        ]);
        nombresCandidatos = (nombres && nombres.data) || [];

        candidatos = precios.data || [];
        pagosPorEmail = {};
        (pagos.data || []).forEach(row => {
            if (!pagosPorEmail[row.email]) pagosPorEmail[row.email] = new Set();
            pagosPorEmail[row.email].add(row.fase);
        });

        // Cargar configuraciones desde Supabase
        configuracionLotes = {};
        (config.data || []).forEach(row => {
            configuracionLotes[`lote_${row.lote}`] = {
                incluir_chris: row.incluir_chris,
                porcentaje_chris: row.porcentaje_chris,
                porcentaje_fernando: row.porcentaje_fernando,
                porcentaje_lot: row.porcentaje_lot,
                porcentaje_diego: row.porcentaje_diego,
                notas: row.notas
            };
        });
    }

    function obtenerConfiguracion(lote) {
        const config = configuracionLotes[`lote_${lote}`];
        if (config) return config;

        // Default si no existe
        return {
            incluir_chris: true,
            porcentaje_chris: 50,
            porcentaje_fernando: 16.67,
            porcentaje_lot: 16.67,
            porcentaje_diego: 16.67,
            notas: ''
        };
    }

    // El reparto sale de AdminData.utilidades/repartir (fuente única, la misma que usan
    // los KPIs y el panel del equipo): "administrador" no cuenta en nada, quien desistió
    // sí aporta lo que ya pagó, y los costos se descuentan antes de repartir. Chris = su %
    // de (ingresos − costos de Chris); los socios reciben el resto del neto real.
    function calcularReparto(lote) {
        const u = AdminData.utilidades(datosParaAdminData(), lote);
        const r = u.reparto;
        return {
            chris: r.montos.chris, fernando: r.montos.fernando, lot: r.montos.lot, diego: r.montos.diego,
            total: r.base, ingresos: u.ingresos, gastos: u.gastos.total, neto: r.neto, r
        };
    }

    async function guardarConfiguracion(lote) {
        const config = {
            incluir_chris: document.getElementById('incluir_chris').checked,
            porcentaje_chris: parseFloat(document.getElementById('perc_chris').value) || 0,
            porcentaje_fernando: parseFloat(document.getElementById('perc_fernando').value) || 0,
            porcentaje_lot: parseFloat(document.getElementById('perc_lot').value) || 0,
            porcentaje_diego: parseFloat(document.getElementById('perc_diego').value) || 0,
            notas: document.getElementById('notas').value || ''
        };

        const total = config.porcentaje_chris + config.porcentaje_fernando + config.porcentaje_lot + config.porcentaje_diego;

        if (Math.abs(total - 100) > TOLERANCIA_TOTAL) {
            alert(`Error: El total debe ser 100%. Actual: ${total.toFixed(2)}%`);
            return;
        }

        const { error } = await supabaseClient
            .from('reparto_utilidades')
            .upsert({ lote, ...config }, { onConflict: 'lote' });

        if (error) {
            alert(`Error al guardar: ${error.message}`);
            return;
        }

        configuracionLotes[`lote_${lote}`] = config;
        renderPanel();
        alert(`✅ Configuración del Lote ${lote} guardada en Supabase`);
    }

    function actualizarRepartoPreview() {
        const config = {
            incluir_chris: document.getElementById('incluir_chris').checked,
            porcentaje_chris: parseFloat(document.getElementById('perc_chris').value) || 0,
            porcentaje_fernando: parseFloat(document.getElementById('perc_fernando').value) || 0,
            porcentaje_lot: parseFloat(document.getElementById('perc_lot').value) || 0,
            porcentaje_diego: parseFloat(document.getElementById('perc_diego').value) || 0
        };

        // Mostrar/ocultar Chris según checkbox
        document.getElementById('reparto_chris').style.display = config.incluir_chris ? 'block' : 'none';
        document.getElementById('perc_chris').disabled = !config.incluir_chris;

        // Vista previa con los porcentajes aún sin guardar (misma fórmula que el reparto real)
        const u = AdminData.utilidades(datosParaAdminData(), loteActivo);
        const r = AdminData.repartir(u.ingresos, u.gastos, config);

        document.getElementById('resumen_chris_row').style.display = config.incluir_chris ? 'grid' : 'none';
        document.getElementById('resumen_chris_monto').textContent = fmt(r.montos.chris);
        document.getElementById('resumen_fernando_monto').textContent = fmt(r.montos.fernando);
        document.getElementById('resumen_lot_monto').textContent = fmt(r.montos.lot);
        document.getElementById('resumen_diego_monto').textContent = fmt(r.montos.diego);

        const total = config.porcentaje_chris + config.porcentaje_fernando + config.porcentaje_lot + config.porcentaje_diego;
        document.getElementById('total_porcentaje').textContent = total.toFixed(2);
        document.getElementById('error_total').style.display = Math.abs(total - 100) > TOLERANCIA_TOTAL ? 'block' : 'none';
    }

    function renderPanel() {
        const app = document.getElementById('app');
        const visibles = candidatos.filter(c => c.estado !== 'administrador');
        const lotesUnicos = [...new Set(visibles.map(c => c.lote || 1))].sort((a, b) => a - b);
        const config = obtenerConfiguracion(loteActivo);
        const reparto = calcularReparto(loteActivo);

        const loteBotonesHtml = lotesUnicos.map(lote => `
            <button class="lote-btn ${lote === loteActivo ? 'active' : ''}" onclick="loteActivo=${lote};renderPanel()">
                Lote ${lote} (${visibles.filter(c => (c.lote || 1) === lote).length})
            </button>
        `).join('') + `<button class="lote-btn" onclick="agregarLote()">+ Nuevo</button>`;

        const html = `
            <div class="card">
                <h2>📍 Seleccionar Lote</h2>
                <div class="lote-selector">${loteBotonesHtml}</div>
            </div>

            <div class="card">
                <h2>💰 Ingresos y utilidad neta — Lote ${loteActivo}</h2>
                <div class="neto-grid">
                    <div><div class="neto-label">Ingresos cobrados</div><div class="neto-valor" style="color:var(--success);">${fmt(reparto.ingresos)}</div></div>
                    <div><div class="neto-label">− Costo real</div><div class="neto-valor" style="color:${reparto.gastos > 0 ? 'var(--danger)' : 'var(--text)'};">${fmt(reparto.gastos)}</div></div>
                    <div><div class="neto-label">= Utilidad neta a repartir</div><div class="neto-valor">${fmt(reparto.total)}</div></div>
                </div>
                ${reparto.neto < 0 ? `<p class="error">⚠️ El costo real supera lo cobrado por ${fmt(-reparto.neto)}: por ahora no hay utilidad que repartir en este lote.</p>` : ''}
                ${config.incluir_chris ? `<p style="font-size:0.88rem;color:var(--text-bright);margin:6px 0;">Chris recibe <strong>${fmt(reparto.r.chris)}</strong> (${config.porcentaje_chris}% de ${fmt(Math.max(0, reparto.r.netoChris))} = ingresos − costos de Chris de ${fmt(reparto.r.costoChris)}${reparto.r.propiosChris ? '' : ', sin costos propios se usan los reales'}). Los socios reciben <strong>${fmt(reparto.r.pool)}</strong>${reparto.r.diferencial > 0 ? `, que incluye el diferencial de ${fmt(reparto.r.diferencial)} entre el costo de Chris y el real` : ''}.</p>` : ''}
                ${renderLotePorFase(loteActivo, config.incluir_chris)}
                <p style="font-size:0.85rem;color:var(--text);margin-top:10px;">Ingresos: pagos de candidatos activos, desistidos y cambio de lote (dinero ya cobrado) · excluye cuentas de Administrador. Cada costo por candidato se descuenta cuando el candidato paga la fase en que se genera.</p>
            </div>

            ${renderCorteCard(loteActivo)}
            ${renderFichaCard(loteActivo)}
            ${renderGastosCard(loteActivo)}

            <div class="card">
                <h2>⚙️ Configurar Reparto — Lote ${loteActivo}</h2>

                <div class="field-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="incluir_chris" ${config.incluir_chris ? 'checked' : ''} onchange="actualizarRepartoPreview()">
                        <label for="incluir_chris">✅ <strong>Christherapy</strong> participa en este lote</label>
                    </div>
                    <p style="font-size:0.75rem;color:var(--text);margin-top:8px;">
                        ✓ Con Chris: 50% para Chris (sobre ingresos − costos de Chris) y el resto del neto real para los 3 socios<br>
                        ✗ Sin Chris: 100% del neto real para los 3 socios (33.33% c/u)
                    </p>
                </div>

                <div class="reparto-grid">
                    <div class="reparto-card" id="reparto_chris" ${config.incluir_chris ? 'style=""' : 'style="display:none;"'}>
                        <div class="reparto-title">👤 Christherapy (Colaborador)</div>
                        <div class="reparto-item">
                            <div class="reparto-label">Porcentaje</div>
                            <div class="reparto-input-group">
                                <input type="number" id="perc_chris" value="${config.porcentaje_chris}" min="0" max="100" step="0.01" ${!config.incluir_chris ? 'disabled' : ''} onchange="actualizarRepartoPreview()">
                                <span class="reparto-percent">%</span>
                            </div>
                        </div>
                    </div>

                    <div class="reparto-card">
                        <div class="reparto-title">👥 Fernando (Socio)</div>
                        <div class="reparto-item">
                            <div class="reparto-label">Porcentaje</div>
                            <div class="reparto-input-group">
                                <input type="number" id="perc_fernando" value="${config.porcentaje_fernando}" min="0" max="100" step="0.01" onchange="actualizarRepartoPreview()">
                                <span class="reparto-percent">%</span>
                            </div>
                        </div>
                    </div>

                    <div class="reparto-card">
                        <div class="reparto-title">👥 Lot (Socio)</div>
                        <div class="reparto-item">
                            <div class="reparto-label">Porcentaje</div>
                            <div class="reparto-input-group">
                                <input type="number" id="perc_lot" value="${config.porcentaje_lot}" min="0" max="100" step="0.01" onchange="actualizarRepartoPreview()">
                                <span class="reparto-percent">%</span>
                            </div>
                        </div>
                    </div>

                    <div class="reparto-card">
                        <div class="reparto-title">👥 Diego (Socio)</div>
                        <div class="reparto-item">
                            <div class="reparto-label">Porcentaje</div>
                            <div class="reparto-input-group">
                                <input type="number" id="perc_diego" value="${config.porcentaje_diego}" min="0" max="100" step="0.01" onchange="actualizarRepartoPreview()">
                                <span class="reparto-percent">%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field-group" style="margin-top:16px;">
                    <label for="notas">Notas (opcional)</label>
                    <input type="text" id="notas" placeholder="Ej: Cambio temporal, configuración especial..." value="${config.notas || ''}">
                </div>
            </div>

            <div class="card">
                <div class="resumen">
                    <div style="font-size:0.9rem;font-weight:700;color:var(--text-bright);margin-bottom:16px;">📊 Resumen del Reparto — Lote ${loteActivo}</div>
                    <div class="resumen-row" id="resumen_chris_row" ${config.incluir_chris ? 'style=""' : 'style="display:none;"'}>
                        <div><strong>Christherapy</strong></div>
                        <div style="text-align:right;"><strong>${config.porcentaje_chris.toFixed(2)}% de su base</strong></div>
                        <div class="resumen-valor" id="resumen_chris_monto">$${reparto.chris.toLocaleString('es-MX')}</div>
                    </div>
                    <div class="resumen-row">
                        <div><strong>Fernando</strong></div>
                        <div style="text-align:right;"><strong>${reparto.r.partes.fernando.toFixed(2)}% de socios</strong></div>
                        <div class="resumen-valor" id="resumen_fernando_monto">$${reparto.fernando.toLocaleString('es-MX')}</div>
                    </div>
                    <div class="resumen-row">
                        <div><strong>Lot</strong></div>
                        <div style="text-align:right;"><strong>${reparto.r.partes.lot.toFixed(2)}% de socios</strong></div>
                        <div class="resumen-valor" id="resumen_lot_monto">$${reparto.lot.toLocaleString('es-MX')}</div>
                    </div>
                    <div class="resumen-row">
                        <div><strong>Diego</strong></div>
                        <div style="text-align:right;"><strong>${reparto.r.partes.diego.toFixed(2)}% de socios</strong></div>
                        <div class="resumen-valor" id="resumen_diego_monto">$${reparto.diego.toLocaleString('es-MX')}</div>
                    </div>
                    <div class="resumen-row" style="border-bottom:none;border-top:1px solid rgba(0,255,136,0.2);padding-top:12px;margin-top:12px;">
                        <div><strong>TOTAL a repartir (utilidad neta)</strong></div>
                        <div style="text-align:right;"><strong id="total_porcentaje">${(config.porcentaje_chris + config.porcentaje_fernando + config.porcentaje_lot + config.porcentaje_diego).toFixed(2)}%</strong></div>
                        <div class="resumen-valor">$${reparto.total.toLocaleString('es-MX')}</div>
                    </div>
                    <div class="error" id="error_total" ${Math.abs((config.porcentaje_chris + config.porcentaje_fernando + config.porcentaje_lot + config.porcentaje_diego) - 100) > TOLERANCIA_TOTAL ? 'style=""' : 'style="display:none;"'}>
                        ⚠️ El total debe ser 100%

        app.innerHTML = html;
        app.insertAdjacentHTML('beforeend', renderPagosCard(loteActivo));
        attachPagosListeners(loteActivo);
        attachGastosListeners(loteActivo);
        document.getElementById('logoutLink').style.display = 'inline';
    }

    /* ---- Utilidades YA PAGADAS (tabla utilidades_pagos, 15 sep 2026) ----
       Registro real de cada entrega a un socio; el reparto de arriba es lo
       teórico. Pagado/pendiente por socio se calcula con AdminData.utilidades
       (misma fórmula que calcularReparto). Si la tabla no existe todavía
       (falta correr 2026-09-15-utilidades-pagos.sql), se muestra el aviso. */
    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    let utilidadesPagos = [];
    let utilidadesPagosError = null;
    async function cargarPagosUtilidades() {
        const { data, error } = await supabaseClient.from('utilidades_pagos').select('*').order('fecha', { ascending: false });
        utilidadesPagos = data || [];
        utilidadesPagosError = error ? (error.message || String(error)) : null;
    }
    function datosParaAdminData() {
        return { precio: candidatos, pagos: Object.keys(pagosPorEmail).flatMap(email => [...pagosPorEmail[email]].map(fase => ({ email, fase }))),
                 reparto: Object.keys(configuracionLotes).map(k => ({ lote: Number(k.replace('lote_', '')), ...configuracionLotes[k] })), utilidadesPagos, gastos, nombres: nombresCandidatos };
    }

    /* ---- Gastos fijos (tabla gastos_utilidades, 18 sep 2026) ----
       Se descuentan de los ingresos ANTES de repartir. 'por_certificado' =
       monto × candidatos activos del lote (Centro Evaluador: $1,200 por
       certificado); 'fijo' = monto único. lote null = todos los lotes. El
       monto es editable. Si la tabla no existe todavía (falta correr
       2026-09-18-gastos-utilidades.sql) se muestra el aviso y el reparto
       sigue como antes, sin gastos. */
    const fmt = n => '$' + Math.round(n || 0).toLocaleString('es-MX');
    let gastos = [];
    let gastosError = null;
    async function cargarGastos() {
        const { data, error } = await supabaseClient.from('gastos_utilidades').select('*').order('id');
        gastos = data || [];
        gastosError = error ? (error.message || String(error)) : null;
    }
    const FASE_UI = { registro: 'Apartado', alineacion: 'Alineación', evaluacion: 'Evaluación', entrega: 'Dictamen' };
    const FASES_UI = ['registro', 'alineacion', 'evaluacion', 'entrega'];
    const hayColumna = (col) => gastos.length > 0 && gastos.some(x => col in x);
    const celda = (n, neg) => n ? `<td class="${neg ? 'neg' : ''}">${neg ? '−' : ''}${fmt(n)}</td>` : '<td class="vacio">—</td>';

    /* Lote por fase: cuántos pagaron cada fase, cuánto entró y qué costos generó. */
    function renderLotePorFase(lote, conChris) {
        if (gastosError) return '';
        const p = AdminData.porFaseLote(datosParaAdminData(), lote);
        const otros = p.otrosReal > 0 || p.otrosChris > 0;
        const tot = k => p.fases.reduce((a, f) => a + f[k], 0);
        const fila = (label, k, neg, otrosVal) => `<tr><td>${label}</td>${p.fases.map(f => celda(f[k], neg)).join('')}${otros ? celda(otrosVal || 0, neg) : ''}<td class="col-total">${neg && (tot(k) + (otrosVal || 0)) ? '−' : ''}${fmt(tot(k) + (otrosVal || 0))}</td></tr>`;
        return `
            <h3 style="margin:18px 0 6px;font-size:0.95rem;color:var(--text-bright);">Por fase — todo el lote</h3>
            <div class="scroll-x"><table class="fase-tabla">
                <thead><tr><th></th>${p.fases.map(f => `<th>${FASE_UI[f.id]}</th>`).join('')}${otros ? '<th>Fijos / sin fase</th>' : ''}<th class="col-total">Total</th></tr></thead>
                <tbody>
                    <tr><td>Candidatos que pagaron</td>${p.fases.map(f => `<td>${f.pagaron}</td>`).join('')}${otros ? '<td class="vacio">—</td>' : ''}<td class="col-total"></td></tr>
                    ${fila('Ingresos cobrados', 'ingresos', false)}
                    ${fila('Costo real', 'costoReal', true, p.otrosReal)}
                    ${conChris ? fila('Costo manejado con Chris', 'costoChris', true, p.otrosChris) : ''}
                </tbody>
            </table></div>`;
    }

    function gastoFila(it) {
        const porCand = it.tipo === 'por_certificado';
        const conFase = hayColumna('fase');
        const cuando = !porCand ? 'Monto fijo (una vez por lote)' : (it.fase ? `Por candidato · al pagar ${FASE_UI[it.fase]}` : 'Por candidato activo');
        const selFase = porCand && conFase ? `<select data-gasto-fase="${it.id}" aria-label="Fase en que se genera">
                ${FASES_UI.map(f => `<option value="${f}" ${it.fase === f ? 'selected' : ''}>Al pagar ${FASE_UI[f]}</option>`).join('')}
                <option value="" ${!it.fase ? 'selected' : ''}>Cada candidato activo</option></select>` : '';
        const calc = !porCand ? 'pago único' : `× ${it.cantidad} ${it.fase ? `pagaron ${FASE_UI[it.fase]}` : `activo${it.cantidad === 1 ? '' : 's'}`}`;
        return `
            <div class="gasto-row">
                <div><strong>${escapeHtml(it.concepto)}</strong><div class="gasto-sub">${cuando} · ${it.lote === null ? 'todos los lotes' : 'solo Lote ' + it.lote}</div>${selFase}</div>
                <div><input type="number" min="0" step="1" value="${it.monto}" data-gasto-monto="${it.id}" aria-label="Monto de ${escapeHtml(it.concepto)}"><div class="gasto-sub">${porCand ? 'MXN por candidato' : 'MXN'}</div></div>
                <div class="gasto-calc">${calc}</div>
                <div class="gasto-total">−${fmt(it.total)}</div>
                <div><button type="button" class="crm-btn crm-btn-danger" data-del-gasto="${it.id}">Eliminar</button></div>
            </div>`;
    }
    function gastoGrupo(titulo, hint, lista, total, vacio) {
        const orden = i => (i.fase ? FASES_UI.indexOf(i.fase) : 9);
        const ordenada = lista.slice().sort((x, y) => orden(x) - orden(y));
        return `
            <div class="gasto-grupo">
                <h3>${titulo}</h3><div class="hint">${hint}</div>
                <div class="resumen" style="background:var(--surface-2);border-color:var(--border);">${ordenada.length ? ordenada.map(gastoFila).join('') : `<p style="font-size:0.85rem;color:var(--text);">${vacio}</p>`}
                    <div class="resumen-row" style="border-bottom:none;border-top:1px solid var(--border);padding-top:12px;margin-top:8px;"><div><strong>Total generado en el lote</strong></div><div></div><div class="resumen-valor" style="color:var(--danger);text-align:right;">−${fmt(total)}</div></div>
                </div>
            </div>`;
    }
    function renderGastosCard(lote) {
        if (gastosError) {
            return `<div class="card"><h2>🧾 Costos — Lote ${lote}</h2><p style="font-size:0.85rem;color:var(--accent);margin-top:10px;">⚠️ Falta correr <code>2026-09-18-gastos-utilidades.sql</code> en Supabase para descontar costos (${escapeHtml(gastosError)}). Mientras tanto el reparto se calcula sobre el ingreso completo.</p></div>`;
        }
        const g = AdminData.utilidades(datosParaAdminData(), lote).gastos;
        const avisos = [];
        if (gastos.length > 0 && !hayColumna('para')) avisos.push('Para manejar costos distintos con Chris falta correr <code>2026-09-18-gastos-para-chris.sql</code>.');
        if (gastos.length > 0 && !hayColumna('fase')) avisos.push('Para que cada costo entre en su fase (Alineación, Evaluación, Dictamen) falta correr <code>2026-09-18-gastos-por-fase.sql</code>.');
        return `
            <div class="card">
                <h2>🧾 Costos — Lote ${lote}</h2>
                ${avisos.map(a => `<p style="font-size:0.85rem;color:var(--accent);margin-bottom:8px;">⚠️ ${a}</p>`).join('')}
                <p style="font-size:0.82rem;color:var(--text);margin:-8px 0 4px;">Edita un monto o su fase y se guarda al instante. Un costo "por candidato" se cuenta por cada candidato que ya pagó la fase en que se genera.</p>
                ${gastoGrupo('Costo real', 'Lo que de verdad se paga (Centro Evaluador). Reduce el total que se reparte.', g.items, g.total, 'Aún no hay costos reales registrados.')}
                ${gastoGrupo('Costo manejado con Chris', 'Solo sirve para calcular la parte de Chris (solo en lotes con Chris). No es salida de dinero: lo que excede al costo real es el diferencial y se queda con los socios. Si no hay ninguno, a Chris se le descuentan los reales.', g.chris.items, g.chris.total, 'Sin costos propios de Chris: se le descuentan los reales.')}
                <h3 style="margin:18px 0 8px;font-size:0.95rem;color:var(--text-bright);">Agregar costo</h3>
                <form class="crm-form" id="formGasto">
                    <label>Concepto<input type="text" name="concepto" required maxlength="80" placeholder="Ej: Centro Evaluador"></label>
                    <label>Se descuenta a<select name="para"><option value="real">Real (reduce el total)</option><option value="chris">Solo a la base de Chris</option></select></label>
                    <label>Tipo<select name="tipo"><option value="por_certificado">Por candidato</option><option value="fijo">Monto fijo</option></select></label>
                    <label>Se genera<select name="fase">${FASES_UI.map(f => `<option value="${f}" ${f === 'entrega' ? 'selected' : ''}>Al pagar ${FASE_UI[f]}</option>`).join('')}<option value="">Cada candidato activo</option></select></label>
                    <label>Monto (MXN)<input type="number" name="monto" min="0" step="1" required placeholder="0"></label>
                    <label>Aplica a<select name="alcance"><option value="todos">Todos los lotes</option><option value="lote">Solo el Lote ${lote}</option></select></label>
                    <button type="submit" class="crm-btn crm-btn-primary">➕ Agregar</button>
                </form>
            </div>`;
    }

    /* Corte a hoy: cada candidato con SU precio y solo lo que ya pagó. */
    function renderCorteCard(lote) {
        if (gastosError) return '';
        const c = AdminData.cortePorCandidato(datosParaAdminData(), lote);
        const u = AdminData.utilidades(datosParaAdminData(), lote);
        const r = u.reparto;
        const conChris = c.config.incluir_chris;
        if (!c.filas.length) return `<div class="card"><h2>🧮 Corte a hoy por candidato — Lote ${lote}</h2><p style="font-size:0.85rem;color:var(--text);">Aún no hay candidatos en este lote.</p></div>`;
        const ESTADO = { 'desistió': 'Desistió', cambio_lote: 'Cambio de lote' };
        const fase = (f, k) => f.pagadas[k] ? `<td>${fmt(f.recibido[k])}</td>` : '<td class="vacio">—</td>';
        const neg = n => n ? `<td class="neg">−${fmt(n)}</td>` : '<td class="vacio">—</td>';
        const filas = c.filas.map(f => `
            <tr>
                <td class="nom"><strong>${escapeHtml(f.nombre || f.email)}</strong>${f.nombre ? `<div class="gasto-sub">${escapeHtml(f.email)}</div>` : ''}${ESTADO[f.estado] ? `<span class="estado">${ESTADO[f.estado]}</span>` : ''}</td>
                ${FASES_UI.map(k => fase(f, k)).join('')}
                <td class="col-total"><strong>${fmt(f.totalRecibido)}</strong><div class="gasto-sub">de ${fmt(f.precio)}</div></td>
                ${conChris ? neg(f.costoChris) + `<td>${fmt(f.chris)}</td>` : ''}
                ${neg(f.costoReal)}
                <td><strong>${fmt(f.socios)}</strong></td>
            </tr>`).join('');
        const st = c.subtotal;
        const hayFijos = c.fijos.real > 0 || (conChris && c.fijos.chris > 0);
        const vacias = FASES_UI.map(() => '<td></td>').join('');
        const pieFijos = hayFijos ? `
            <tr class="pie"><td>Subtotal candidatos</td>${vacias}<td class="col-total">${fmt(st.recibido)}</td>${conChris ? `<td class="neg">−${fmt(st.costoChris)}</td><td>${fmt(st.chris)}</td>` : ''}<td class="neg">−${fmt(st.costoReal)}</td><td>${fmt(st.socios)}</td></tr>
            <tr><td>Costos de monto fijo del lote</td>${vacias}<td class="col-total"></td>${conChris ? `<td class="neg">−${fmt(c.fijos.chris)}</td><td></td>` : ''}<td class="neg">−${fmt(c.fijos.real)}</td><td></td></tr>` : '';
        const cols = 1 + FASES_UI.length + 1 + (conChris ? 2 : 0) + 2;
        return `
            <div class="card">
                <h2>🧮 Corte a hoy por candidato — Lote ${lote}</h2>
                <p style="font-size:0.82rem;color:var(--text);margin:-8px 0 10px;">Cada candidato con <strong>su</strong> precio, contando solo las fases que ya pagó y los costos que esas fases generaron. Es lo que se debe repartir hoy.</p>
                <div class="scroll-x"><table class="fase-tabla corte-tabla">
                    <thead><tr><th>Candidato</th>${FASES_UI.map(k => `<th>${FASE_UI[k]}</th>`).join('')}<th class="col-total">Recibido</th>${conChris ? '<th>Costos Chris</th><th>Chris</th>' : ''}<th>Costo real</th><th>Socios</th></tr></thead>
                    <tbody>
                        ${filas}
                        ${pieFijos}
                        <tr class="pie pie-total"><td>Total a repartir hoy</td>${vacias}<td class="col-total">${fmt(u.ingresos)}</td>${conChris ? `<td></td><td>${fmt(r.chris)}</td>` : ''}<td></td><td>${fmt(r.pool)}</td></tr>
                    </tbody>
                </table></div>
                <div class="ficha-res">
                    ${conChris ? `<div><div class="k">Chris hoy</div><div class="v">${fmt(r.chris)}</div></div>` : ''}
                    <div><div class="k">Fernando hoy</div><div class="v">${fmt(r.montos.fernando)}</div></div>
                    <div><div class="k">Lot hoy</div><div class="v">${fmt(r.montos.lot)}</div></div>
                    <div><div class="k">Diego hoy</div><div class="v">${fmt(r.montos.diego)}</div></div>
                </div>
                <p style="font-size:0.78rem;color:var(--text);margin-top:10px;">Cuánto ya se le pagó a cada quien y cuánto queda pendiente está abajo, en "Utilidades pagadas". Los montos por renglón van redondeados; el total sale de la suma exacta.</p>
            </div>`;
    }

    /* Cómo se reparte UN candidato, fase por fase (la hoja de Diego). */
    function renderFichaCard(lote) {
        if (gastosError) return '';
        const f = AdminData.fichaCandidato(datosParaAdminData(), lote);
        if (!f.activos) return `<div class="card"><h2>📋 Cómo se reparte un candidato — Lote ${lote}</h2><p style="font-size:0.85rem;color:var(--text);">Aún no hay candidatos activos en este lote.</p></div>`;
        const r = f.reparto;
        const conChris = f.config.incluir_chris;
        const pf = f.porFase;
        const pct = n => `${n.toFixed(1).replace('.0', '')}%`;
        const filaCosto = (it) => `<tr><td>− ${escapeHtml(it.concepto)}</td>${pf.map(x => (x.id === (it.fase || 'entrega') ? `<td class="neg">−${fmt(it.monto)}</td>` : '<td class="vacio">—</td>')).join('')}<td class="col-total neg">−${fmt(it.monto)}</td></tr>`;
        const filaValor = (label, k, cls, total) => `<tr class="${cls}"><td>${label}</td>${pf.map(x => `<td>${fmt(x[k])}</td>`).join('')}<td class="col-total">${fmt(total)}</td></tr>`;
        const orden = i => FASES_UI.indexOf(i.fase || 'entrega');
        const ord = l => l.slice().sort((x, y) => orden(x) - orden(y));
        const diferencialTxt = conChris && r.diferencial > 0
            ? `${ord(f.chris.items).map(i => fmt(i.monto)).join(' + ')} de Chris − ${fmt(f.real.total)} real`
            : '';
        return `
            <div class="card"><details class="ref">
                <summary>📋 Referencia: cómo se reparte un candidato que paga todo — Lote ${lote}</summary>
                <p style="font-size:0.82rem;color:var(--text);margin:10px 0;">${f.activos === 1 ? 'Con el precio del único activo del lote' : `Con el precio <strong>promedio</strong> de los ${f.activos} activos del lote`}, si pagara todas las fases. Sirve para entender el modelo; lo que se reparte de verdad está en "Corte a hoy por candidato".</p>
                <div class="scroll-x"><table class="fase-tabla">
                    <thead><tr><th></th>${pf.map(x => `<th>${FASE_UI[x.id]}</th>`).join('')}<th class="col-total">Total</th></tr></thead>
                    <tbody>
                        ${filaValor('Precio', 'precio', 'sub', f.precio)}
                        ${conChris ? `
                        <tr class="sec"><td colspan="6">Tabla Chris — costos manejados con Chris${f.chris.propios ? '' : ' (sin costos propios: se usan los reales)'}</td></tr>
                        ${ord(f.chris.items).map(filaCosto).join('')}
                        ${filaValor('= Base de Chris', 'baseChris', 'sub', f.chris.neto)}
                        ${filaValor(`Chris (${f.config.porcentaje_chris}% de su base)`, 'chris', 'gana', r.chris)}` : ''}
                        <tr class="sec"><td colspan="6">Tabla Socios — costo real</td></tr>
                        ${ord(f.real.items).map(filaCosto).join('')}
                        ${filaValor('= Valor real', 'neto', 'sub', f.real.neto)}
                        ${filaValor(conChris ? 'Socios (valor real − Chris)' : 'Socios (todo el valor real)', 'socios', 'gana', r.pool)}
                    </tbody>
                </table></div>
                <div class="ficha-res">
                    ${conChris ? `<div><div class="k">Chris</div><div class="v">${fmt(r.chris)}</div><div class="gasto-sub">${pct(f.participacion.chris)} del valor real</div></div>` : ''}
                    <div><div class="k">Socios (total)</div><div class="v">${fmt(r.pool)}</div><div class="gasto-sub">${pct(f.participacion.fernando + f.participacion.lot + f.participacion.diego)} del valor real</div></div>
                    <div><div class="k">Fer · Lot · Diego</div><div class="v" style="font-size:1rem;">${fmt(r.montos.fernando)} · ${fmt(r.montos.lot)} · ${fmt(r.montos.diego)}</div><div class="gasto-sub">${pct(f.participacion.fernando)} · ${pct(f.participacion.lot)} · ${pct(f.participacion.diego)} del valor real</div></div>
                    ${diferencialTxt ? `<div><div class="k">Diferencial (para socios)</div><div class="v">${fmt(r.diferencial)}</div><div class="gasto-sub">${diferencialTxt}</div></div>` : ''}
                </div>
            </details></div>`;
    }
    function attachGastosListeners(lote) {
        const recargar = async () => { await cargarGastos(); renderPanel(); };
        const form = document.getElementById('formGasto');
        if (form) form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const fd = new FormData(form);
            const session = await Auth.getSession();
            const fila = {
                lote: fd.get('alcance') === 'lote' ? lote : null,
                concepto: String(fd.get('concepto') || '').trim(), tipo: fd.get('tipo'), monto: Number(fd.get('monto')),
                para: fd.get('para'), fase: fd.get('tipo') === 'por_certificado' ? (fd.get('fase') || null) : null,
                registrado_por: session && session.user ? session.user.email : null
            };
            let { error } = await supabaseClient.from('gastos_utilidades').insert(fila);
            // Si aún no se corrió el SQL de alguna columna nueva, se guarda sin ella (y la pantalla lo avisa).
            for (const col of ['fase', 'para']) {
                if (error && String(error.message || '').includes(`'${col}' column`)) {
                    if (col === 'para' && fila.para === 'chris') break;
                    delete fila[col];
                    ({ error } = await supabaseClient.from('gastos_utilidades').insert(fila));
                }
            }
            if (error && String(error.message || '').includes("'para' column")) { alert('Para guardar un costo manejado con Chris primero corre 2026-09-18-gastos-para-chris.sql en Supabase.'); return; }
            if (error) { alert('No se pudo agregar el gasto: ' + (error.message || error)); return; }
            await recargar();
        });
        document.querySelectorAll('[data-gasto-monto]').forEach(input => input.addEventListener('change', async () => {
            const monto = Number(input.value);
            if (input.value === '' || !isFinite(monto) || monto < 0) { alert('Escribe un monto válido (0 o mayor).'); await recargar(); return; }
            const { error } = await supabaseClient.from('gastos_utilidades').update({ monto }).eq('id', input.dataset.gastoMonto);
            if (error) alert('No se pudo guardar el monto: ' + (error.message || error));
            await recargar();
        }));
        document.querySelectorAll('[data-gasto-fase]').forEach(sel => sel.addEventListener('change', async () => {
            const { error } = await supabaseClient.from('gastos_utilidades').update({ fase: sel.value || null }).eq('id', sel.dataset.gastoFase);
            if (error) alert('No se pudo cambiar la fase: ' + (error.message || error));
            await recargar();
        }));
        document.querySelectorAll('[data-del-gasto]').forEach(btn => btn.addEventListener('click', async () => {
            if (!confirm('¿Eliminar este gasto? El reparto se recalculará sin él.')) return;
            const { error } = await supabaseClient.from('gastos_utilidades').delete().eq('id', btn.dataset.delGasto);
            if (error) { alert('No se pudo eliminar: ' + (error.message || error)); return; }
            await recargar();
        }));
    }
    function renderPagosCard(lote) {
        const hoy = new Date().toISOString().slice(0, 10);
        if (utilidadesPagosError) {
            return `<div class="card"><h2>💸 Utilidades pagadas — Lote ${lote}</h2><p style="font-size:0.85rem;color:var(--accent);margin-top:10px;">⚠️ Falta correr <code>2026-09-15-utilidades-pagos.sql</code> en Supabase para registrar pagos (${escapeHtml(utilidadesPagosError)}).</p></div>`;
        }
        const u = AdminData.utilidades(datosParaAdminData(), lote);
        const delLote = utilidadesPagos.filter(p => Number(p.lote) === Number(lote));
        const filas = u.socios.map(s => `
            <div class="resumen-row"><div><strong>${escapeHtml(s.label)}</strong></div>
                <div style="text-align:right;">a repartir <strong>$${s.aRepartir.toLocaleString('es-MX')}</strong></div>
                <div class="resumen-valor" style="color:${s.pendiente > 0 ? 'var(--accent)' : 'var(--success)'};">pagado $${s.pagado.toLocaleString('es-MX')} · pendiente $${s.pendiente.toLocaleString('es-MX')}</div></div>`).join('');
        const lista = delLote.length ? delLote.map(p => `
            <div class="resumen-row"><div>${escapeHtml(p.fecha || '')} · <strong>${escapeHtml((AdminData.SOCIOS.find(s => s.id === p.socio) || {}).label || p.socio)}</strong>${p.nota ? ` <span style="opacity:0.7;">— ${escapeHtml(p.nota)}</span>` : ''}</div>
                <div style="text-align:right;"><strong>$${Number(p.monto).toLocaleString('es-MX')}</strong></div>
                <div style="text-align:right;"><button type="button" class="crm-btn crm-btn-danger" data-del-pago="${p.id}">Eliminar</button></div></div>`).join('') : '<p style="font-size:0.85rem;color:var(--text);">Aún no hay pagos registrados en este lote.</p>';
        return `
            <div class="card">
                <h2>💸 Utilidades pagadas — Lote ${lote}</h2>
                <div class="resumen" style="margin-top:12px;">${filas}
                    <div class="resumen-row" style="border-bottom:none;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;"><div><strong>TOTAL</strong></div>
                        <div style="text-align:right;"><strong>$${u.aRepartir.toLocaleString('es-MX')}</strong></div>
                        <div class="resumen-valor">pagado $${u.pagado.toLocaleString('es-MX')} · pendiente $${u.pendiente.toLocaleString('es-MX')}</div></div>
                </div>
                <h3 style="margin:18px 0 8px;font-size:0.95rem;color:var(--text-bright);">Registrar pago</h3>
                <form class="crm-form" id="formPagoUtilidad">
                    <label>Socio<select name="socio" required>${u.socios.map(s => `<option value="${s.id}">${escapeHtml(s.label)}</option>`).join('')}</select></label>
                    <label>Monto (MXN)<input type="number" name="monto" min="1" step="1" required placeholder="0"></label>
                    <label>Fecha<input type="date" name="fecha" value="${hoy}" required></label>
                    <label>Nota<input type="text" name="nota" placeholder="Opcional"></label>
                    <button type="submit" class="crm-btn crm-btn-primary">💾 Registrar</button>
                </form>
                <h3 style="margin:18px 0 8px;font-size:0.95rem;color:var(--text-bright);">Pagos registrados</h3>
                <div class="resumen">${lista}</div>
            </div>`;
    }
    function attachPagosListeners(lote) {
        const form = document.getElementById('formPagoUtilidad');
        if (form) form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const fd = new FormData(form);
            const session = await Auth.getSession();
            const { error } = await supabaseClient.from('utilidades_pagos').insert({
                lote, socio: fd.get('socio'), monto: Number(fd.get('monto')), fecha: fd.get('fecha'), nota: (fd.get('nota') || '').trim() || null,
                registrado_por: session && session.user ? session.user.email : null
            });
            if (error) { alert('No se pudo registrar el pago: ' + (error.message || error)); return; }
            await cargarPagosUtilidades(); renderPanel();
        });
        document.querySelectorAll('[data-del-pago]').forEach(btn => btn.addEventListener('click', async () => {
            if (!confirm('¿Eliminar este pago registrado?')) return;
            const { error } = await supabaseClient.from('utilidades_pagos').delete().eq('id', btn.dataset.delPago);
            if (error) { alert('No se pudo eliminar: ' + (error.message || error)); return; }
            await cargarPagosUtilidades(); renderPanel();
        }));
    }

    function agregarLote() {
        const maxLote = Math.max(...candidatos.map(c => c.lote || 1));
        const nuevoLote = maxLote + 1;
        alert(`✅ Nuevo lote ${nuevoLote} creado. Asigna candidatos desde el panel de Precios.`);
    }

    async function boot() {
        const app = document.getElementById('app');
        app.innerHTML = `<div class="loading">Cargando datos...</div>`;

        await cargarDatos();
        await cargarPagosUtilidades();
        await cargarGastos();
        renderPanel();
    }

    window.addEventListener('load', async () => {
        try {
            const session = await Auth.getSession();
            if (session) {
                const esAdmin = await Auth.isAdmin(session.user.email);
                if (esAdmin) {
                    boot();
                    return;
                }
                await Auth.signOut();
            }
            renderGateShell();
        } catch (e) {
            console.error('Error:', e);
            document.getElementById('app').innerHTML = `<div style="text-align:center;padding:40px;"><div style="font-size:3rem;margin-bottom:14px;">⚠️</div><h1 style="color:var(--text-bright);">Algo salió mal</h1></div>`;
        }
    });
    </script>
</body>
</html>
