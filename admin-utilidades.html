<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Reparto de Utilidades EC1375</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF;
            --accent: #FFD700; --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 60px;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }
        .top-bar {
            position: sticky; top: 0; background: var(--dark); border-bottom: 1px solid var(--dark-light);
            padding: 16px 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar-inner { font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .top-bar a { color: var(--primary); font-size: 0.82rem; text-decoration: none; margin-left: 20px; }

        .card { background: var(--dark-light); border-radius: 12px; padding: 22px; margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; color: var(--text-bright); margin-bottom: 16px; }

        .field-group { margin-bottom: 14px; }
        .field-group label { display: block; font-size: 0.82rem; color: var(--text); margin-bottom: 5px; font-weight: 600; }
        .field-group input { width: 100%; padding: 10px 12px; background: var(--dark); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: var(--text-bright); font-size: 0.9rem; }

        .btn { padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; border: none; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-small { padding: 8px 12px; font-size: 0.75rem; }

        .tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 16px; }
        .tabla th { text-align: left; color: var(--primary-light); font-size: 0.72rem; text-transform: uppercase; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,136,255,0.05); }
        .tabla td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .tabla tr:hover { background: rgba(255,255,255,0.02); }

        .row-input { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: center; margin-bottom: 12px; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 6px; }
        .row-input input { padding: 8px 10px; background: var(--dark); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; color: var(--text-bright); font-size: 0.85rem; }

        .resumen { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.2); border-radius: 8px; padding: 16px; margin-top: 16px; }
        .resumen-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; padding: 8px 0; }
        .resumen-valor { font-size: 1.1rem; font-weight: 700; color: var(--success); }

        .error { color: var(--danger); font-size: 0.85rem; margin-top: 4px; }
        .success { color: var(--success); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">💵 Admin — Reparto de Utilidades</div>
        <div style="display:flex;gap:16px;">
            <a href="admin-index.html">🗂️ Índice</a>
            <a href="admin-kpis.html">📊 KPIs</a>
            <a href="admin-precios.html">💰 Precios</a>
            <a href="#" id="logoutLink" onclick="handleLogout()" style="display:none;">Cerrar sesión</a>
        </div>
    </div>
    <div class="container" id="app"></div>

    <script>
    let candidatos = [];
    let pagosPorEmail = {};
    let socios = [
        { nombre: 'Fernando', porcentaje: 50, id: 'fernando' },
        { nombre: 'Lot', porcentaje: 25, id: 'lot' },
        { nombre: 'Diego', porcentaje: 15, id: 'diego' }
    ];
    let colaboradores = [
        { nombre: 'Christherapy', porcentaje: 10, id: 'christherapy' }
    ];

    function renderGateShell() {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div style="max-width:420px;margin:0 auto;padding:40px 20px;">
                <div style="text-align:center;margin-bottom:30px;">
                    <div style="font-size:3rem;margin-bottom:14px;">💵</div>
                    <h1 style="font-size:1.5rem;font-weight:700;color:var(--text-bright);margin-bottom:8px;">Reparto de Utilidades</h1>
                </div>
                <div class="card" id="adminGateContainer"></div>
            </div>`;
        Auth.renderAdminGate(document.getElementById('adminGateContainer'), { onVerified: boot });
    }

    async function handleLogout() {
        await Auth.signOut();
        window.location.reload();
    }

    async function cargarDatos() {
        const [precios, pagos] = await Promise.all([
            supabaseClient.from('candidatos_precio').select('*'),
            supabaseClient.from('candidatos_fase_pagos').select('email,fase')
        ]);
        candidatos = precios.data || [];
        pagosPorEmail = {};
        (pagos.data || []).forEach(row => {
            if (!pagosPorEmail[row.email]) pagosPorEmail[row.email] = new Set();
            pagosPorEmail[row.email].add(row.fase);
        });
    }

    function calcularIngresosTotales() {
        const activos = candidatos.filter(c => (c.estado || 'activo') === 'activo');
        return activos.reduce((sum, c) => {
            const pagos = pagosPorEmail[c.email] || new Set();
            let total = 0;
            ['registro', 'alineacion', 'evaluacion', 'entrega'].forEach(f => {
                if (pagos.has(f)) total += c[`monto_${f}`] || 0;
            });
            return sum + total;
        }, 0);
    }

    function calcularReparto() {
        const ingresosTotales = calcularIngresosTotales();
        const todos = [...socios, ...colaboradores];

        return todos.map(persona => ({
            ...persona,
            monto: Math.round((ingresosTotales * persona.porcentaje) / 100)
        }));
    }

    function guardarConfiguracion() {
        const fernando = parseFloat(document.getElementById('perc_fernando').value) || 0;
        const lot = parseFloat(document.getElementById('perc_lot').value) || 0;
        const diego = parseFloat(document.getElementById('perc_diego').value) || 0;
        const christherapy = parseFloat(document.getElementById('perc_christherapy').value) || 0;

        const total = fernando + lot + diego + christherapy;

        if (Math.abs(total - 100) > 0.01) {
            alert(`Error: El total debe ser 100%. Actual: ${total.toFixed(2)}%`);
            return;
        }

        socios[0].porcentaje = fernando;
        socios[1].porcentaje = lot;
        socios[2].porcentaje = diego;
        colaboradores[0].porcentaje = christherapy;

        // Guardar en localStorage por ahora (después puede ser Supabase)
        localStorage.setItem('config_utilidades', JSON.stringify({ socios, colaboradores }));

        renderPanel();
        alert('✅ Configuración guardada');
    }

    function renderPanel() {
        const app = document.getElementById('app');
        const reparto = calcularReparto();
        const ingresosTotales = calcularIngresosTotales();

        const socoTableRows = socios.map(s => `
            <tr>
                <td><strong>${s.nombre}</strong></td>
                <td><input type="number" id="perc_${s.id}" value="${s.porcentaje}" min="0" max="100" step="0.1" style="width:80px;"></td>
                <td style="text-align:right;">$${reparto.find(r => r.id === s.id)?.monto.toLocaleString('es-MX')}</td>
                <td style="text-align:right; color:var(--text);font-size:0.8rem;">${s.porcentaje}% de $${ingresosTotales.toLocaleString('es-MX')}</td>
            </tr>
        `).join('');

        const colaboTableRows = colaboradores.map(c => `
            <tr style="background:rgba(255,215,0,0.05);">
                <td><strong>${c.nombre}</strong> <span style="color:var(--accent);font-size:0.75rem;">(Colaborador)</span></td>
                <td><input type="number" id="perc_${c.id}" value="${c.porcentaje}" min="0" max="100" step="0.1" style="width:80px;"></td>
                <td style="text-align:right;">$${reparto.find(r => r.id === c.id)?.monto.toLocaleString('es-MX')}</td>
                <td style="text-align:right; color:var(--text);font-size:0.8rem;">${c.porcentaje}% de $${ingresosTotales.toLocaleString('es-MX')}</td>
            </tr>
        `).join('');

        const totalAsignado = reparto.reduce((sum, r) => sum + r.porcentaje, 0);

        const html = `
            <div class="card">
                <h2>💰 Ingresos Totales Realizados</h2>
                <div style="font-size:2rem;font-weight:700;color:var(--success);margin:20px 0;">
                    $${ingresosTotales.toLocaleString('es-MX')} MXN
                </div>
                <p style="font-size:0.85rem;color:var(--text);">De candidatos en estado Activo con pagos realizados</p>
            </div>

            <div class="card">
                <h2>👥 Configurar Reparto — Socios</h2>
                <table class="tabla">
                    <thead>
                        <tr><th>Socio</th><th>Porcentaje</th><th>Monto</th><th>Cálculo</th></tr>
                    </thead>
                    <tbody>${socoTableRows}</tbody>
                </table>
            </div>

            <div class="card">
                <h2>🤝 Colaboradores Externos</h2>
                <table class="tabla">
                    <thead>
                        <tr><th>Colaborador</th><th>Porcentaje</th><th>Monto</th><th>Cálculo</th></tr>
                    </thead>
                    <tbody>${colaboTableRows}</tbody>
                </table>
            </div>

            <div class="card">
                <div class="resumen">
                    <div style="font-size:0.9rem;font-weight:700;color:var(--text-bright);margin-bottom:12px;">📊 Resumen del Reparto</div>
                    ${reparto.map(r => `
                        <div class="resumen-row">
                            <div><strong>${r.nombre}</strong></div>
                            <div style="text-align:right;">${r.porcentaje}%</div>
                            <div class="resumen-valor">$${r.monto.toLocaleString('es-MX')}</div>
                        </div>
                    `).join('')}
                    <div style="border-top:1px solid rgba(0,255,136,0.2);margin-top:12px;padding-top:12px;margin-bottom:0;">
                        <div class="resumen-row">
                            <div><strong>TOTAL</strong></div>
                            <div style="text-align:right;"><strong>${totalAsignado}%</strong></div>
                            <div class="resumen-valor">$${ingresosTotales.toLocaleString('es-MXN')}</div>
                        </div>
                    </div>
                    ${Math.abs(totalAsignado - 100) > 0.01 ? `<div class="error" style="margin-top:12px;">⚠️ El total debe ser 100%, actualmente es ${totalAsignado}%</div>` : ''}
                </div>
                <button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="guardarConfiguracion()">💾 Guardar Configuración</button>
            </div>
        `;

        app.innerHTML = html;
        document.getElementById('logoutLink').style.display = 'inline';
    }

    async function boot() {
        const app = document.getElementById('app');
        app.innerHTML = `<div style="padding:40px;text-align:center;">Cargando datos...</div>`;

        // Cargar configuración guardada
        const config = localStorage.getItem('config_utilidades');
        if (config) {
            const parsed = JSON.parse(config);
            socios = parsed.socios;
            colaboradores = parsed.colaboradores;
        }

        await cargarDatos();
        renderPanel();
    }

    window.addEventListener('load', async () => {
        try {
            const session = await Auth.getSession();
            if (session) {
                const esAdmin = await Auth.isAdmin(session.user.email);
                if (esAdmin) { boot(); return; }
                await Auth.signOut();
            }
            renderGateShell();
        } catch (e) {
            console.error('Error:', e);
            document.getElementById('app').innerHTML = `<div style="text-align:center;padding:40px;"><div style="font-size:3rem;margin-bottom:14px;">⚠️</div><h1 style="color:var(--text-bright);">Algo salió mal</h1></div>`;
        }
    });
    </script>
</body>
</html>
