<script>(function(){try{var t=localStorage.getItem('paideia-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<!--
  estudio.html — visor de estudio unificado (17 sep 2026). Un solo visor con la
  misma navegación guiada para: ?modo=biblioteca | alineacion | reforzamiento |
  practica | examen. Reemplaza a biblioteca.html, ruta-alineacion.html,
  ruta-estudio.html (motor V4.4), reforzamiento.html, practica.html y
  examen-conocimientos.html, que ahora solo redirigen aquí.
  Lógica pura: estudio-logica.js (paridad verificada contra el motor V4.4) y
  visor-diapositivas.js. Estilos: visor-diapositivas.css + estudio.css.
  Spec: docs/superpowers/specs/2026-09-17-visor-estudio-unificado-design.md
-->
</head>
<body>

<div class="app ali bib" id="app" data-view="route" data-vista="panel">
  <header class="topbar">
    <div class="brand"><svg class="brand-mk" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="6" height="22" rx="1.5" fill="none" stroke="var(--accent)" stroke-width="2.2"/><rect x="13" y="5" width="6" height="22" rx="1.5" fill="none" stroke="var(--accent)" stroke-width="2.2"/><path d="M21.5 6.5l5 1.3-4.6 19.2-5-1.3z" fill="none" stroke="var(--cyan)" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <div><div class="brand-tx" id="brandTx">ESTUDIO</div><div class="brand-sub">Paideia Tech · EC1375</div></div>
    </div>
    <span class="ruta-tag" id="rutaTag">Cargando…</span>
    <div class="spacer"></div>
    <div class="tb-actions">
      <span class="counter" id="counter"></span>
      <a class="tbtn bib-keep" id="btn-back" href="panel.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl" id="back-lbl">Panel</span></a>
      <button class="tbtn bib-idxbtn bib-keep" id="btn-index" aria-controls="bibIdx" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lbl">Índice</span></button>
      <button class="tbtn" id="btn-help" title="Cómo funciona"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.37c-.5.18-.8.65-.8 1.18V14M12 17.5h.01"/></svg><span class="lbl">Ayuda</span></button>
      <button class="tbtn presbtn" id="btn-pres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h18v12H3z M8 20h8 M12 16v4"/></svg><span class="lbl">Presentación</span></button>
      <button class="tbtn" id="btn-theme" title="Cambiar a modo claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><span class="lbl" id="theme-lbl">Modo claro</span></button>
    </div>
  </header>
  <div class="progress"><div class="progress-fill" id="pfill"></div></div>

  <div class="bib-body" id="bibBody">
    <aside class="bib-idx" id="bibIdx" aria-label="Índice de la Biblioteca">
      <div class="bib-idx-head">
        <input class="bib-q" id="q" type="search" placeholder="Buscar palabra, tema o #reactivo" autocomplete="off" aria-label="Buscar en la Biblioteca">
        <div class="bib-row">
          <button class="bib-chip" id="chipTodo" aria-pressed="true">Todo <span class="num" id="numTodo"></span></button>
          <button class="bib-chip" id="chipRec" aria-pressed="false" title="Pantallas de los reactivos que marcaste NO y de los temas que fallaste en el examen">Para ti <span class="num" id="numRec"></span></button>
          <select class="bib-sel" id="modSel" aria-label="Filtrar por módulo"><option value="">Todos los módulos</option></select>
        </div>
        <div class="bib-crit" id="critBanner" hidden></div>
        <div class="bib-idx-tip">Toca una pantalla para abrirla · ✓ ya la viste · <i class="bib-dot"></i> recomendada para ti</div>
      </div>
      <div class="bib-list" id="idxlist" role="list"></div>
      <div class="bib-idx-foot"><span id="vistasTxt">0 vistas</span><span class="bar"><i id="vistasBar"></i></span></div>
    </aside>
    <div class="bib-backdrop" id="bibBackdrop"></div>

    <div class="bib-main">
      <main class="stagewrap">
        <div class="view v-route">
          <section class="bib-guia" id="guia" hidden aria-live="polite"></section>
          <div class="es-panel" id="panel"><div class="bib-loading">Cargando…</div></div>
          <div class="frame r-library" id="frame"></div>
          <div class="stage" id="stage"></div>
          <div class="metabar">
            <div class="rx" id="rxwrap"></div><div class="spacer"></div>
            <button class="notes-btn" id="notesbtn">Notas del presentador</button>
          </div>
          <div class="pnotes" id="pnotes"></div>
        </div>
      </main>
      <nav class="nav" aria-label="Navegación">
        <button class="nbtn" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg><span>Anterior</span></button>
        <div class="bib-navinfo"><b id="navPos">—</b><span id="navNext"></span></div>
        <button class="nbtn primary" id="next"><span id="nextLbl">Siguiente</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </nav>
    </div>
  </div>
</div>

<div class="bib-modal" id="ayuda" hidden role="dialog" aria-modal="true" aria-labelledby="ayudaTit"><div class="box">
  <h2 id="ayudaTit">Cómo funciona</h2>
  <div id="ayudaCuerpo"></div>
  <p style="font-size:12.5px">En computadora: <span class="kbd">←</span> <span class="kbd">→</span> cambiar pantalla · <span class="kbd">N</span> notas · <span class="kbd">P</span> presentación · <span class="kbd">?</span> esta ayuda</p>
  <div class="bib-acciones"><button type="button" class="bib-btn primary" id="ayudaOk">Entendido</button></div>
</div></div>

<div class="bib-modal" id="fin" hidden role="dialog" aria-modal="true" aria-labelledby="finTit"><div class="box" id="finBox"></div></div>

<div class="bib-toast" id="toast" hidden role="status"></div>

<script>
(async function () {
  'use strict';
  var V = window.VisorDiap, E = window.EstudioLogica, esc = V.esc;
  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), stage = $('stage'), frame = $('frame'), counter = $('counter'), pfill = $('pfill'), panel = $('panel');
  var prevB = $('prev'), nextB = $('next'), rxWrap = $('rxwrap'), notesBtn = $('notesbtn'), notesBox = $('pnotes');
  var idx = $('bibIdx'), idxList = $('idxlist'), qIn = $('q'), modSel = $('modSel');
  var params = new URLSearchParams(location.search);

  /* ── modos ── */
  var MODOS = {
    biblioteca: { titulo: 'Biblioteca', pagina: 'biblioteca', fase: 'alineacion' },
    alineacion: { titulo: 'Ruta de Alineación', pagina: 'alineacion', fase: 'alineacion' },
    reforzamiento: { titulo: 'Reforzamiento', pagina: 'reforzamiento', fase: 'registro', autodiag: 'completo' },
    practica: { titulo: 'Práctica', pagina: 'practica', fase: 'evaluacion', autodiag: 'completo' },
    examen: { titulo: 'Examen de Conocimientos', pagina: 'examen', fase: 'evaluacion', autodiag: 'nombre' }
  };
  var modo = MODOS[params.get('modo')] ? params.get('modo') : 'biblioteca';
  var MODO = MODOS[modo];
  document.title = 'EC1375 · ' + MODO.titulo + ' · Paideia Tech';
  $('brandTx').textContent = MODO.titulo.toUpperCase();
  app.setAttribute('data-modo', modo);
  if (modo !== 'biblioteca') app.setAttribute('data-sin-indice', '1');

  /* ── utilidades de interfaz ── */
  function corto(t, n) { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function pantallaBloqueo(titulo, texto, href, label) {
    app.removeAttribute('data-sin-indice');
    app.innerHTML = '<div class="bib-gate"><div class="box"><div style="font-size:2.2rem;margin-bottom:10px">🔒</div>' +
      '<h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p><a href="' + href + '">' + esc(label) + '</a></div></div>';
  }
  function abreModal(id) { $(id).hidden = false; var b = $(id).querySelector('button, a'); if (b) b.focus(); }
  function cierraModal(id) { $(id).hidden = true; }
  var tToast;
  function toast(html, ms) {
    var t = $('toast'); t.innerHTML = html; t.hidden = false;
    clearTimeout(tToast); tToast = setTimeout(function () { t.hidden = true; }, ms || 6000);
    var x = t.querySelector('.x'); if (x) x.onclick = function () { t.hidden = true; };
  }
  function btnHtml(b) {
    if (!b) return '';
    var cls = 'bib-btn' + (b.tipo ? ' ' + b.tipo : '');
    return b.href ? '<a class="' + cls + '" href="' + b.href + '">' + esc(b.txt) + '</a>'
      : '<button type="button" class="' + cls + '" data-accion="' + b.id + '">' + esc(b.txt) + '</button>';
  }
  /* Acciones de los paneles y del modal final: data-accion="id" → ACCIONES[id]() */
  var ACCIONES = {};
  function accion(id, fn) { ACCIONES[id] = fn; return id; }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('[data-accion]');
    if (!b || !ACCIONES[b.getAttribute('data-accion')]) return;
    ev.preventDefault();
    ACCIONES[b.getAttribute('data-accion')](b);
  });
  function mostrarFin(icono, titulo, texto, botones) {
    $('finBox').innerHTML = '<div class="bib-fin-ic" aria-hidden="true">' + icono + '</div><h2 id="finTit">' + esc(titulo) + '</h2>' +
      '<p>' + texto + '</p><div class="bib-acciones">' + botones.map(btnHtml).join('') + '</div>';
    abreModal('fin');
  }
  accion('cerrarFin', function () { cierraModal('fin'); });

  /* ── guía superior (misma pieza en todos los modos) ──
     G = { k, titulo, salir:{txt,fn}, pasos:{items:[{txt,estado,title,fn}], txt}, barra:{valor,txt}, instr:[html], abiertas } */
  var GUIA_FN = {};
  function pintaGuia(G) {
    var g = $('guia');
    if (!G) { g.hidden = true; return; }
    GUIA_FN = {};
    var h = '<div class="bib-guia-top"><div><div class="bib-guia-k">' + esc(G.k) + '</div><h2>' + esc(G.titulo) + '</h2></div>' +
      (G.salir ? '<button type="button" class="bib-guia-salir" data-guia="salir">' + esc(G.salir.txt) + '</button>' : '') + '</div>';
    if (G.salir) GUIA_FN.salir = G.salir.fn;
    if (G.pasos && G.pasos.items.length) {
      h += '<div class="bib-pasos" role="list">' + G.pasos.items.map(function (p, k) {
        if (p.fn) GUIA_FN['p' + k] = p.fn;
        return '<button type="button" role="listitem" class="bib-paso' + (p.estado === 'cur' ? ' cur' : '') + (p.hecho ? ' vista' : '') + '"' +
          (p.fn ? ' data-guia="p' + k + '"' : ' disabled') + ' title="' + esc(p.title || '') + '"' + (p.estado === 'cur' ? ' aria-current="step"' : '') +
          ' aria-label="' + esc(p.title || p.txt) + (p.hecho ? ' (hecho)' : '') + '">' + esc(p.txt) + '</button>';
      }).join('') + (G.pasos.txt ? '<span class="bib-pasos-txt">' + esc(G.pasos.txt) + '</span>' : '') + '</div>';
    }
    if (G.barra) {
      h += '<div style="display:grid;gap:5px"><div class="es-barra"><i style="width:' + Math.round(G.barra.valor * 100) + '%"></i></div>' +
        '<span class="bib-pasos-txt" style="margin:0">' + esc(G.barra.txt) + '</span></div>';
    }
    if (G.instr && G.instr.length) {
      var abierto = G.abiertas || !window.matchMedia('(max-width:760px)').matches;
      h += '<details class="bib-como"' + (abierto ? ' open' : '') + '><summary>' + esc(G.instrTitulo || 'Qué hacer aquí') + '</summary>' +
        '<ol class="bib-instr">' + G.instr.map(function (li) { return '<li>' + li + '</li>'; }).join('') + '</ol></details>';
    }
    g.innerHTML = h; g.hidden = false;
  }
  $('guia').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-guia]'); if (!b) return;
    var fn = GUIA_FN[b.getAttribute('data-guia')]; if (fn) fn();
  });

  /* ── barra inferior ── N = { prev:{fn,disabled}|null, pos, sig, btn:{lg,sm,fn,disabled,fin} } */
  var NAV = {};
  function pintaNav(N) {
    NAV = N || {};
    prevB.style.visibility = NAV.prev ? 'visible' : 'hidden';
    prevB.disabled = !NAV.prev || !!NAV.prev.disabled;
    $('navPos').textContent = NAV.pos || '';
    $('navNext').textContent = NAV.sig || '';
    var b = NAV.btn;
    nextB.style.visibility = b ? 'visible' : 'hidden';
    if (b) {
      $('nextLbl').innerHTML = '<span class="lg">' + esc(b.lg) + '</span><span class="sm">' + esc(b.sm || b.lg) + '</span>';
      nextB.disabled = !!b.disabled;
      nextB.classList.toggle('fin', !!b.fin);
    }
  }
  prevB.onclick = function () { if (NAV.prev && NAV.prev.fn) NAV.prev.fn(); };
  nextB.onclick = function () { if (NAV.btn && NAV.btn.fn && !NAV.btn.disabled) NAV.btn.fn(); };

  function tituloAyuda(html) { $('ayudaCuerpo').innerHTML = html; }
  $('btn-help').onclick = function () { abreModal('ayuda'); };
  $('ayudaOk').onclick = function () { cierraModal('ayuda'); try { localStorage.setItem('ec1375-biblioteca-guia', '1'); } catch (e) { /* sin storage */ } };
  $('ayuda').addEventListener('click', function (ev) { if (ev.target === $('ayuda')) $('ayudaOk').onclick(); });
  $('fin').addEventListener('click', function (ev) { if (ev.target === $('fin')) cierraModal('fin'); });
  $('btn-pres').onclick = function () { V.presentacion(!document.body.classList.contains('pres')); };
  notesBtn.onclick = function () { notesBox.classList.toggle('show'); };
  V.enlazarBotonTema($('btn-theme'), $('theme-lbl'));

  /* ── acceso ── */
  var session = await Auth.getSession();
  if (!session) {
    try { sessionStorage.setItem('paideia-volver', location.pathname + location.search + location.hash); } catch (e) { /* sin storage */ }
    pantallaBloqueo('Inicia sesión para continuar', 'Tu ' + MODO.titulo + ' se carga con tu cuenta. Al entrar te regresamos aquí.', 'panel.html', 'Iniciar sesión');
    return;
  }
  var email = session.user.email;
  var esBypass = await Auth.isBypassSession();
  var exento = esBypass || (await Auth.isAdmin(email));
  var fila = null;
  try { fila = await FlowStatus.getRow(); } catch (e) { fila = null; }

  var AD = null;
  try { AD = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null'); } catch (e) { AD = null; }
  if (!AD && fila && fila.autodiagnostico_data) AD = fila.autodiagnostico_data;
  var adNombre = AD && AD.personalData && AD.personalData.nombre;
  if (MODO.autodiag === 'completo') {
    if (!AD || !adNombre || Object.keys(AD.answers || {}).length !== 142) {
      pantallaBloqueo('Primero completa tu Autodiagnóstico', 'Tus respuestas del Autodiagnóstico arman tu ruta de estudio.', 'autodiagnostico.html', 'Ir al Autodiagnóstico'); return;
    }
    if (!AD.ndaAccepted) {
      pantallaBloqueo('Falta firmar tu Acuerdo de Confidencialidad', 'Es un paso corto dentro de tu Autodiagnóstico.', 'autodiagnostico.html', 'Firmar mi Acuerdo'); return;
    }
  }
  if (MODO.autodiag === 'nombre' && !adNombre) {
    pantallaBloqueo('Primero completa tu Autodiagnóstico', 'Necesitamos tus datos del Autodiagnóstico para tu comprobante.', 'autodiagnostico.html', 'Ir al Autodiagnóstico'); return;
  }
  if (!exento && !(await Auth.isPhaseAuthorized(email, MODO.fase))) {
    if (MODO.fase === 'registro') pantallaBloqueo('Tu correo no está autorizado todavía', 'Si ya pagaste tu registro, escríbenos por WhatsApp y lo activamos.', 'https://wa.me/528115026729', 'Escribir por WhatsApp');
    else if (MODO.fase === 'alineacion') pantallaBloqueo('Primero completa tu pago de Alineación', MODO.titulo + ' se abre junto con la fase de Alineación.', 'alineacion.html', 'Ir a Alineación');
    else pantallaBloqueo('Primero completa tus Documentos de Sesión', MODO.titulo + ' se habilita con la fase de Evaluación.', 'documentos-sesion.html', 'Ir a Documentos de Sesión');
    return;
  }

  var STEPS = [];
  try { STEPS = await FlowStatus.getSteps(); } catch (e) { STEPS = []; }
  try { CrmShell.mount({ mode: 'rail', currentPageId: MODO.pagina, steps: STEPS }); } catch (e) { console.warn('Rail CRM no disponible:', e); }
  function pasoInfo(id) {
    var i = STEPS.map(function (s) { return s.id; }).indexOf(id);
    return i < 0 ? null : { n: i + 1, total: STEPS.length, sig: STEPS[i + 1] || null };
  }
  function botonSiguientePaso(id, tipo) {
    var p = pasoInfo(id);
    if (!p || !p.sig) return { txt: 'Volver a mi panel', href: 'panel.html', tipo: tipo || 'ok' };
    return { txt: 'Siguiente paso: ' + p.sig.label, href: p.sig.href, tipo: tipo || 'ok' };
  }
  var info = pasoInfo(MODO.pagina);
  $('rutaTag').textContent = info ? 'Paso ' + info.n + ' de ' + info.total : 'Consulta libre';

  /* ── contenido ── */
  var D = null, A = null, M = {}, SLIDES_E = null, SLIDES_A = null, REACTIVOS = null;
  try {
    var pide = [];
    if (modo !== 'alineacion') pide.push(Contenido.cargar('ruta-estudio:data').then(function (x) { D = x; }), Contenido.cargar('ruta-estudio:media').then(function (x) { M = Object.assign({}, M, x || {}); }));
    if (modo === 'biblioteca' || modo === 'alineacion') pide.push(Contenido.cargar('ruta-alineacion:data').then(function (x) { A = x; M = Object.assign({}, x.media || {}, M); }));
    if (modo === 'examen') pide.push(Contenido.cargar('examen:reactivos').then(function (x) { REACTIVOS = x; }));
    await Promise.all(pide);
  } catch (e) { app.innerHTML = Contenido.errorHtml(e); return; }
  var criterios = (D && D.criterios) || {};
  var cat = modo === 'alineacion' ? V.catalogo(null, A) : V.catalogo(D, modo === 'biblioteca' ? A : null);
  var porSid = {}; cat.forEach(function (e) { porSid[e.sid] = e; });

  /* Diapositivas: se cargan al primer recorrido (en Examen/Práctica/Reforzamiento
     puede que nunca haga falta). */
  var SL = {}, cargaSlides = null, textos = {};
  function asegurarDiapositivas() {
    if (cargaSlides) return cargaSlides;
    cargaSlides = (async function () {
      var partes = [];
      if (modo !== 'alineacion') partes.push(Contenido.cargar('ruta-estudio:slides').then(function (x) { SLIDES_E = V.seccionesPorSid(x.html); }));
      if (modo === 'biblioteca' || modo === 'alineacion') partes.push(Contenido.cargar('ruta-alineacion:slides').then(function (x) { SLIDES_A = V.seccionesPorSid(x.html); }));
      await Promise.all(partes);
      var html = cat.map(function (e) { return ((e.fuente === 'estudio' ? SLIDES_E : SLIDES_A) || {})[e.sid] || ''; }).join('\n');
      var mapa = await Contenido.imagenes(Contenido.rutasEnHtml(html));
      stage.innerHTML = Contenido.reemplazarImagenes(html, mapa);
      [].forEach.call(stage.querySelectorAll('.slide'), function (s) { SL[s.getAttribute('data-sid')] = s; });
      Object.keys(SL).forEach(function (sid) { textos[sid] = (SL[sid].textContent || '').replace(/\s+/g, ' '); });
      V.activarQuizzes(stage);
    })();
    return cargaSlides;
  }

  /* ── recorrido de diapositivas (mismo visor para todos los modos) ──
     R = { lista:[entradas del catálogo], pos, guia(R)→G, fin:{lg,sm}, alTerminar(), marcoK, marcoCls, vistasKey, hash, alPintar() } */
  var R = null;
  var VISTAS = {};
  function vistas(key) {
    if (!VISTAS[key]) { VISTAS[key] = {}; try { (JSON.parse(localStorage.getItem(key) || '[]') || []).forEach(function (s) { VISTAS[key][s] = 1; }); } catch (e) { /* sin storage */ } }
    return VISTAS[key];
  }
  function marcaVista(key, sid) {
    var v = vistas(key); if (v[sid]) return; v[sid] = 1;
    try { localStorage.setItem(key, JSON.stringify(Object.keys(v))); } catch (e) { /* sin storage */ }
  }
  function nombreElem(e) { var n = (e.crit[0] || '').slice(1, 2); return n ? 'Elemento ' + n : ''; }

      var nP = crit ? V.porCriterio(cat, crit).length : 0;
      fb = '<div class="es-fb bad"><div class="h">Incorrecto</div><div class="x">Respuesta correcta: <b>' + esc(r.opciones[r.correcta]) + '</b></div><div class="tema">Tema: ' + esc(r.tema) + '. Repasa el tema aquí mismo; al terminar vuelves a esta pregunta lista para contestar.</div></div>';
      if (crit) acciones.push({ txt: 'Repasar este tema aquí · ' + nP + ' pantalla' + (nP > 1 ? 's' : ''), tipo: 'primary', id: accion('exRep', function () { repasoExamen(crit, r.tema, true); }) });
      acciones.push({ txt: 'Contestar de nuevo sin repasar', id: accion('exOtra', function () { X.reintentar(EX, a.qIndex); guardarExamen(); preguntaExamen(); }) });
      btn = crit ? { lg: 'Repasar este tema', sm: 'Repasar', fn: function () { repasoExamen(crit, r.tema, true); } } : { lg: 'Contestar de nuevo', fn: function () { X.reintentar(EX, a.qIndex); guardarExamen(); preguntaExamen(); } };
    } else {
      btn = { lg: 'Elige una respuesta', disabled: true };
    }
    var html = '<div class="es-card"><div class="es-k">Reactivo ' + (i + 1) + ' de ' + REACTIVOS.length + ' · ' + esc(r.tema) + '</div>' +
      '<div class="es-pregunta">' + esc(r.q) + '</div>' + ops + fb + (acciones.length ? '<div class="es-acciones">' + acciones.map(btnHtml).join('') + '</div>' : '') + '</div>';
    mostrarPanel(html, {
      k: 'Examen de Conocimientos · ' + (info ? 'Paso ' + info.n + ' de ' + info.total + ' de tu proceso' : ''), titulo: 'Reactivo ' + (i + 1) + ' de ' + REACTIVOS.length,
      barra: { valor: i / REACTIVOS.length, txt: i + ' de ' + REACTIVOS.length + ' contestados' },
      instrTitulo: 'Cómo funciona', abiertas: i === 0 && !resp,
      instr: ['Elige una respuesta: se revisa al instante.', 'Si fallas, toca <b>«Repasar este tema aquí»</b>; al terminar vuelves a esta misma pregunta.', 'No avanzas hasta acertar.']
    }, { pos: 'Reactivo ' + (i + 1) + ' de ' + REACTIVOS.length, sig: resp ? '' : corto(r.tema, 60), btn: btn });
    enfocarRespuesta(resp);
  }
  /* Tras contestar, lleva la vista al resultado (en celular quedaba abajo del
     pliegue); en una pregunta nueva, arriba. */
  function enfocarRespuesta(respondida) {
    var fbEl = panel.querySelector('.es-fb');
    if (respondida && fbEl && fbEl.scrollIntoView) fbEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    else window.scrollTo(0, 0);
  }
  function avanzarExamen() {
    if (X.siguiente(EX, REACTIVOS) === 'fin') { X.finalizar(EX, REACTIVOS); guardarExamen(); resultadoExamen(true); return; }
    guardarExamen(); preguntaExamen();
  }
  function repasoExamen(crit, tema, desdePregunta) {
    var lista = V.porCriterio(cat, crit), c = criterios[crit];
    abrirRecorrido({
      lista: lista, marcoK: 'Repaso del examen', marcoCls: 'r-remedial', posPrefijo: 'Repaso · ',
      fin: desdePregunta ? { lg: 'Volver a contestar la pregunta', sm: 'Contestar' } : { lg: 'Terminé el repaso', sm: 'Terminé' },
      finTexto: desdePregunta ? 'Al terminar vuelves a la pregunta' : 'Última pantalla del repaso',
      alTerminar: function () {
        if (desdePregunta) { X.limpiarIncorrecta(EX, REACTIVOS); guardarExamen(); preguntaExamen(); toast('✓ Repaso terminado · contesta otra vez la pregunta<button type="button" class="x" aria-label="Cerrar">✕</button>'); }
        else resultadoExamen();
      },
      guia: function (R2) {
        return { k: desdePregunta ? 'Repaso del tema que fallaste' : 'Repaso de un tema del examen', titulo: c ? c.titulo : tema,
          salir: { txt: desdePregunta ? 'Volver a la pregunta' : 'Volver al resultado', fn: desdePregunta ? preguntaExamen : resultadoExamen },
          pasos: pasosDeRecorrido(R2), instrTitulo: 'Cómo repasar', abiertas: R2.pos === 0,
          instr: ['Lee cada pantalla y toca <b>«Siguiente pantalla»</b>.', desdePregunta ? 'En la última toca <b>«Volver a contestar la pregunta»</b>.' : 'En la última toca <b>«Terminé el repaso»</b>.'] };
      }
    });
  }
  function resultadoExamen(recienTerminado) {
    var temas = X.temasRepasados(EX, REACTIVOS), sp = botonSiguientePaso('examen');
    var html = '<div class="es-card es-resultado"><div class="bib-fin-ic" style="margin:0 auto 10px" aria-hidden="true">✓</div><h2>Examen completado</h2>' +
      '<p>Respondiste correctamente las <b>' + REACTIVOS.length + ' / ' + REACTIVOS.length + '</b> preguntas.</p><div class="big">100%</div>' +
      '<p style="font-size:13px">Es una autoevaluación de práctica: no determina si eres competente. Ese resultado lo emite tu Centro Evaluador con tu Plan de Evaluación, tus respuestas y el resto de tu expediente.</p>' +
      '<div class="es-acciones">' + btnHtml(sp) + btnHtml({ txt: 'Descargar comprobante (PDF)', id: accion('exPdf', descargarPDF) }) + '</div></div>' +
      (temas.length ? '<div class="es-card"><div class="es-k">Temas que repasaste</div><p>Vale la pena repasarlos una vez más antes de tu evaluación real.</p><div class="es-lista">' +
        temas.map(function (t, k) {
          var crit = critDeTema(t);
          return '<div class="es-tema"><span class="es-num">' + (k + 1) + '</span><div class="t"><b>' + esc(t) + '</b></div>' +
            (crit ? btnHtml({ txt: 'Repasar', id: accion('exTema' + k, function () { repasoExamen(crit, t, false); }) }) : '') + '</div>';
        }).join('') + '</div></div>' : '') +
      '<div class="es-card"><div class="es-acciones">' + btnHtml({ txt: 'Reintentar el examen completo', id: accion('exReset', function () {
        if (!confirm('Vas a reiniciar el examen desde la primera pregunta. ¿Continuar?')) return;
        EX = X.nuevo(REACTIVOS); guardarExamen(); preguntaExamen();
      }) }) + '</div></div>';
    mostrarPanel(html, { k: 'Examen de Conocimientos · ' + (info ? 'Paso ' + info.n + ' de ' + info.total + ' de tu proceso' : ''), titulo: 'Examen completado',
      barra: { valor: 1, txt: REACTIVOS.length + ' de ' + REACTIVOS.length + ' contestados' } },
      { pos: 'Examen completado · 100 %', sig: '', btn: { lg: sp.txt, sm: 'Siguiente paso', fn: function () { location.href = sp.href; }, fin: true } });
    if (recienTerminado) mostrarFin('✓', '¡Examen completado!', 'Contestaste los ' + REACTIVOS.length + ' reactivos.', [sp, { txt: 'Ver mi resultado', id: 'cerrarFin' }]);
  }
  function cargarScript(src) {
    return new Promise(function (ok, mal) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
  }
  async function descargarPDF() {
    try {
      if (!window.jspdf) await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      if (!window.ExamenPDF) await cargarScript('examen-pdf.js');
      window.ExamenPDF.generar(EX, adNombre, REACTIVOS.length);
    } catch (e) { toast('No se pudo generar el PDF. Revisa tu conexión e intenta de nuevo.'); }
  }

  /* ── arranque ── */
  try {
    if (modo === 'biblioteca') await iniciarBiblioteca();
    else if (modo === 'alineacion') await iniciarAlineacion();
    else if (modo === 'reforzamiento') iniciarReforzamiento();
    else if (modo === 'practica') iniciarPractica();
    else if (modo === 'examen') iniciarExamen();
  } catch (e) {
    console.error(e);
    app.innerHTML = Contenido.errorHtml(e);
  }
})();
</script>
</body>
</html>
