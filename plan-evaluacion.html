<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Evaluación EC1375 - Posturalia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container { max-width: 760px; margin: 0 auto; padding: 24px 20px; }

        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
        }
        .top-bar-inner { max-width: 760px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }

        .card {
            background: var(--dark-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 1.15rem; color: var(--text-bright); margin-bottom: 14px; }
        .card p.desc { font-size: 0.88rem; color: var(--text); margin-bottom: 16px; }

        .hero { text-align: center; padding: 20px 0 30px; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.7rem; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.98rem; color: var(--text); }

        /* BLOCKED STATE */
        .blocked-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
        }
        .blocked-box p { color: var(--text); margin-bottom: 18px; }

        /* CANDIDATE SUMMARY */
        .summary-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.9rem;
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-label { color: var(--text); }
        .summary-value { color: var(--text-bright); font-weight: 600; text-align: right; }

        .result-banner {
            margin-top: 16px; padding: 14px 18px; border-radius: 8px;
            font-weight: 700; text-align: center; font-size: 0.9rem;
        }
        .result-banner.go { background: rgba(0,255,136,0.1); border: 1px solid var(--success); color: var(--success); }
        .result-banner.wait { background: rgba(255,215,0,0.1); border: 1px solid var(--accent); color: var(--accent); }

        .cert-chip-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
        .cert-chip-sm {
            background: rgba(0,136,255,0.1); border: 1px solid var(--primary); color: var(--primary-light);
            font-size: 0.72rem; padding: 3px 9px; border-radius: 12px;
        }

        /* CRITERIA TABLE */
        .criteria-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .criteria-table th, .criteria-table td {
            padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .criteria-table th { color: var(--primary-light); font-weight: 700; font-size: 0.78rem; }
        .criteria-table td:first-child, .criteria-table th:first-child { text-align: left; color: var(--text-bright); }
        .criteria-table tfoot td { font-weight: 700; color: var(--text-bright); border-top: 2px solid var(--primary); }

        .instrument-note {
            display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 0.78rem; color: rgba(255,255,255,0.5);
        }

        /* REQUIREMENTS LIST */
        .req-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .req-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text); padding: 6px 0; }
        .req-item::before { content: '✓'; color: var(--success); font-weight: 700; }

        /* CALENDAR / SCHEDULING */
        .calendar-cta-box {
            background: linear-gradient(135deg, rgba(0,136,255,0.15), rgba(0,204,255,0.05));
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            margin-bottom: 18px;
        }
        .calendar-cta-box a.btn { display: inline-block; text-decoration: none; }
        #calendarFrame { width: 100%; height: 600px; border: none; border-radius: 8px; margin-top: 14px; background: white; }
        .calendar-fallback { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-top: 10px; }

        /* FORM FIELDS */
        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.85rem; color: var(--text); margin-bottom: 6px; font-weight: 600; }
        .field-group input, .field-group textarea {
            width: 100%; padding: 12px 14px; background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            color: var(--text-bright); font-size: 0.92rem; font-family: inherit;
        }
        .field-group input:focus, .field-group textarea:focus { outline: none; border-color: var(--primary); }

        /* AGREEMENT / SIGNATURE */
        .agreement-text { font-size: 0.85rem; color: var(--text); margin-bottom: 16px; line-height: 1.7; }
        .agreement-text li { margin-left: 20px; margin-bottom: 6px; }

        .checkbox-row {
            display: flex; align-items: flex-start; gap: 10px; padding: 14px;
            background: var(--dark); border-radius: 8px; margin-bottom: 16px;
        }
        .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
        .checkbox-row label { font-size: 0.85rem; color: var(--text); }

        .signature-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .sig-tab-btn {
            flex: 1; padding: 10px; background: var(--dark); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer;
        }
        .sig-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        #signatureCanvas {
            width: 100%; max-width: 500px; height: 150px; background: #fff; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.15); touch-action: none; display: block; margin: 0 auto 12px;
        }
        .clear-sig-btn {
            display: block; margin: 0 auto 16px; padding: 8px 16px; background: transparent;
            border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; font-size: 0.8rem; cursor: pointer;
        }

        /* BUTTONS */
        .btn {
            padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease; text-align: center;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-secondary:hover { background: rgba(0,136,255,0.1); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #20ba5a; transform: translateY(-2px); }
        .btn-full { width: 100%; margin-bottom: 12px; }

        .success-box {
            background: rgba(0,255,136,0.08); border: 1px solid var(--success); border-radius: 12px;
            padding: 24px; text-align: center;
        }
        .success-box h3 { color: var(--success); margin-bottom: 10px; }

        @media (max-width: 600px) {
            .req-list { grid-template-columns: 1fr; }
            .cert-chip-list { justify-content: flex-start; margin-top: 6px; }
            .summary-row { flex-direction: column; align-items: flex-start; gap: 4px; }
            .summary-value { text-align: left; }
            #calendarFrame { height: 500px; }
        }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">📅 Plan de Evaluación EC1375</div></div>

    <div class="container" id="app"></div>

    <script>
    /* =========================================================
       CONFIG — pega aquí el link de "Horarios de cita" de Google Calendar
    ========================================================= */
    const GOOGLE_CALENDAR_BOOKING_URL = ''; // Ej: 'https://calendar.google.com/calendar/appointments/schedules/AcZ...'

    const CRITERIOS_RESUMEN = [
        { elemento: 1, titulo: 'Preparar el espacio', desempenos: 6, productos: 13, conocimientos: 3, actitudes: 2 },
        { elemento: 2, titulo: 'Preparar al usuario', desempenos: 40, productos: 12, conocimientos: 5, actitudes: 3 },
        { elemento: 3, titulo: 'Introducir al usuario', desempenos: 19, productos: 13, conocimientos: 0, actitudes: 0 },
        { elemento: 4, titulo: 'Dar seguimiento', desempenos: 16, productos: 10, conocimientos: 0, actitudes: 0 }
    ];

    const REQUERIMIENTOS = [
        'Escritorio / mesa para atención', 'Sillas', 'Lavabo de manos', 'Mesa de apoyo para herramientas',
        'Banco de altura', 'Archivero / computadora', 'Monitor de presión arterial', 'Oxímetro',
        'Termómetro digital', 'Perchero', 'Báscula y estadímetro', 'Áreas de recepción y atención'
    ];

    let planData = {
        lugarDesarrollo: 'Instalaciones del Centro Evaluador',
        fechaHoraAgendada: '',
        lugarResultados: 'Instalaciones del Centro Evaluador / Videollamada',
        acuerdoAceptado: false
    };
    let signatureMode = 'draw';
    let signatureDataUrl = null;
    let signatureTypedName = '';
    let hasSignature = false;
    let isDrawing = false, lastX = 0, lastY = 0;
    let generated = false;

    function loadAutodiagnosticoResult() {
        try {
            const saved = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null');
            if (!saved || !saved.personalData || !saved.personalData.nombre) return null;
            const answers = saved.answers || {};
            const total = 142;
            const answered = Object.keys(answers).length;
            const si = Object.values(answers).filter(v => v === 'SI').length;
            const percentage = Math.round((si / total) * 100);
            const especialidades = Array.isArray(saved.selectedCertificaciones) ? [...saved.selectedCertificaciones] : [];
            if (saved.otraCertificacionText && saved.otraCertificacionText.trim()) especialidades.push(saved.otraCertificacionText.trim());
            return {
                personalData: saved.personalData,
                especialidades,
                si, total, answered, percentage,
                completo: answered === total,
                procedeEvaluacion: percentage >= 90
            };
        } catch (e) { return null; }
    }

    function loadPlanProgress() {
        try {
            const saved = JSON.parse(localStorage.getItem('planEvaluacionData') || 'null');
            if (saved) {
                planData = Object.assign(planData, saved.planData || {});
                signatureDataUrl = saved.signatureDataUrl || null;
                signatureTypedName = saved.signatureTypedName || '';
                signatureMode = saved.signatureMode || 'draw';
                hasSignature = !!signatureDataUrl;
            }
        } catch (e) {}
    }

    function savePlanProgress() {
        localStorage.setItem('planEvaluacionData', JSON.stringify({
            planData, signatureDataUrl, signatureTypedName, signatureMode
        }));
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function render() {
        const app = document.getElementById('app');
        const result = loadAutodiagnosticoResult();

        if (!result || !result.completo) {
            app.innerHTML = `
                <div class="hero">
                    <div class="hero-icon">📅</div>
                    <h1 class="hero-title">Plan de Evaluación EC1375</h1>
                    <p class="hero-subtitle">El siguiente paso hacia tu evaluación oficial</p>
                </div>
                <div class="blocked-box">
                    <p><strong>Primero necesitas completar tu Autodiagnóstico</strong><br>El Plan de Evaluación se genera con base en tu resultado del autodiagnóstico EC1375.</p>
                    <a href="autodiagnostico.html" class="btn btn-primary">📋 Ir al Autodiagnóstico</a>
                </div>`;
            return;
        }

        if (generated) {
            renderGeneratedState(app, result);
            return;
        }

        app.innerHTML = `
            <div class="hero">
                <div class="hero-icon">📅</div>
                <h1 class="hero-title">Plan de Evaluación EC1375</h1>
                <p class="hero-subtitle">Acuerda fecha, lugar y confirma tu evaluación oficial</p>
            </div>

            <div class="card">
                <h2>👤 Tu Resumen</h2>
                <div class="summary-row"><span class="summary-label">Candidato/a</span><span class="summary-value">${escapeHtml(result.personalData.nombre)}</span></div>
                <div class="summary-row"><span class="summary-label">Especialidad</span><span class="summary-value"><div class="cert-chip-list">${result.especialidades.map(c => `<span class="cert-chip-sm">${escapeHtml(c)}</span>`).join('')}</div></span></div>
                <div class="summary-row"><span class="summary-label">Resultado Autodiagnóstico</span><span class="summary-value">${result.si}/${result.total} (${result.percentage}%)</span></div>
                <div class="result-banner ${result.procedeEvaluacion ? 'go' : 'wait'}">
                    ${result.procedeEvaluacion
                        ? '✅ Procede a evaluación — Tu resultado indica que estás listo/a'
                        : '📚 Se sugirió capacitación previa — Tu evaluador te asesorará antes de la evaluación'}
                </div>
            </div>

            <div class="card">
                <h2>📋 Criterios de tu Evaluación</h2>
                <p class="desc">Estos son los 4 Elementos del EC1375 que se evaluarán, con base en el Instrumento de Evaluación de Competencia (IEC) oficial.</p>
                <table class="criteria-table">
                    <thead><tr><th>Elemento</th><th>Desemp.</th><th>Prod.</th><th>Conoc.</th><th>Actit.</th></tr></thead>
                    <tbody>
                        ${CRITERIOS_RESUMEN.map(c => `<tr><td>${c.elemento}. ${c.titulo}</td><td>${c.desempenos}</td><td>${c.productos || '—'}</td><td>${c.conocimientos || '—'}</td><td>${c.actitudes || '—'}</td></tr>`).join('')}
                    </tbody>
                    <tfoot><tr><td>Total</td><td colspan="4">142 reactivos</td></tr></tfoot>
                </table>
                <div class="instrument-note">
                    <span>👁️ Desempeños/Actitudes → Guía de Observación</span>
                    <span>📄 Productos → Lista de Cotejo</span>
                    <span>🧠 Conocimientos → Cuestionario</span>
                </div>
            </div>

            <div class="card">
                <h2>🧰 Requerimientos para la Evaluación</h2>
                <p class="desc">El Centro Evaluador provee este equipo — no necesitas comprarlo:</p>
                <div class="req-list">${REQUERIMIENTOS.map(r => `<div class="req-item">${r}</div>`).join('')}</div>
            </div>

            <div class="card">
                <h2>📆 Agenda tu Evaluación</h2>
                <p class="desc">Selecciona fecha y hora disponible directamente en el calendario de tu evaluador.</p>
                ${GOOGLE_CALENDAR_BOOKING_URL ? `
                    <iframe id="calendarFrame" src="${GOOGLE_CALENDAR_BOOKING_URL}"></iframe>
                ` : `
                    <div class="calendar-cta-box">
                        <p style="color:var(--text-bright);font-weight:600;margin-bottom:10px;">El calendario en línea se está configurando</p>
                        <p class="desc" style="margin-bottom:16px;">Mientras tanto, coordina tu fecha directamente por WhatsApp:</p>
                        <button class="btn btn-whatsapp" onclick="requestScheduleViaWhatsApp()">📱 COORDINAR FECHA POR WHATSAPP</button>
                    </div>
                `}
                <div class="field-group" style="margin-top:16px;">
                    <label>Fecha y hora que agendaste *</label>
                    <input type="text" id="f_fechaHoraAgendada" value="${escapeHtml(planData.fechaHoraAgendada)}" placeholder="Ej. Martes 12 de agosto, 10:00 am">
                    <p style="font-size:0.78rem;color:rgba(255,255,255,0.4);margin-top:4px;">Anótala aquí después de agendar arriba, para incluirla en tu Plan de Evaluación</p>
                </div>
                <div class="field-group">
                    <label>Lugar para el desarrollo de la evaluación</label>
                    <input type="text" id="f_lugarDesarrollo" value="${escapeHtml(planData.lugarDesarrollo)}">
                </div>
                <div class="field-group">
                    <label>Lugar de presentación de resultados</label>
                    <input type="text" id="f_lugarResultados" value="${escapeHtml(planData.lugarResultados)}">
                </div>
            </div>

            <div class="card">
                <h2>✍️ Acuerdo y Firma</h2>
                <div class="agreement-text">
                    Con mi firma confirmo que:
                    <ul>
                        <li>Se me proporcionó información suficiente y detallada respecto a los desempeños, productos y conocimientos a demostrar durante la evaluación, así como el lugar, fecha y horario en que se realizará.</li>
                        <li>Se me proporcionó y explicó el Tríptico de Derechos y Obligaciones de los usuarios del Sistema Nacional de Competencias.</li>
                        <li>Entiendo que si no concluyo el proceso en los tiempos acordados, podré solicitar reiniciarlo, responsabilizándome de los costos adicionales que esto genere.</li>
                    </ul>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="acuerdoCheck" ${planData.acuerdoAceptado ? 'checked' : ''} onchange="toggleAcuerdo(this)">
                    <label for="acuerdoCheck">Acepto el Plan de Evaluación descrito arriba</label>
                </div>

                <div class="signature-tabs">
                    <button class="sig-tab-btn ${signatureMode === 'draw' ? 'active' : ''}" onclick="setSignatureMode('draw')">✍️ Dibujar firma</button>
                    <button class="sig-tab-btn ${signatureMode === 'type' ? 'active' : ''}" onclick="setSignatureMode('type')">⌨️ Escribir mi nombre</button>
                </div>
                <div id="signaturePad" style="${signatureMode === 'draw' ? '' : 'display:none;'}">
                    <canvas id="signatureCanvas" width="500" height="150"></canvas>
                    <button class="clear-sig-btn" onclick="clearSignature()">Borrar firma</button>
                </div>
                <div id="signatureTyped" style="${signatureMode === 'type' ? '' : 'display:none;'}">
                    <div class="field-group">
                        <label>Escribe tu nombre completo como firma</label>
                        <input type="text" id="f_signatureTyped" value="${escapeHtml(signatureTypedName)}" placeholder="Nombre completo" oninput="updateTypedSignature(this.value)">
                    </div>
                </div>
            </div>

            <button class="btn btn-primary btn-full" id="btnGenerate" onclick="generatePlan()" disabled>Generar mi Plan de Evaluación →</button>
        `;

        attachFieldListeners();
        if (signatureMode === 'draw') setTimeout(initSignatureCanvas, 50);
        updateGenerateButton();
    }

    function attachFieldListeners() {
        ['fechaHoraAgendada', 'lugarDesarrollo', 'lugarResultados'].forEach(field => {
            const el = document.getElementById('f_' + field);
            if (el) {
                el.addEventListener('input', () => {
                    planData[field] = el.value;
                    savePlanProgress();
                    updateGenerateButton();
                });
            }
        });
    }

    function toggleAcuerdo(el) {
        planData.acuerdoAceptado = el.checked;
        savePlanProgress();
        updateGenerateButton();
    }

    function setSignatureMode(mode) {
        signatureMode = mode;
        savePlanProgress();
        render();
    }

    function updateTypedSignature(value) {
        signatureTypedName = value;
        savePlanProgress();
        updateGenerateButton();
    }

    function updateGenerateButton() {
        const btn = document.getElementById('btnGenerate');
        if (!btn) return;
        const hasSig = signatureMode === 'draw' ? hasSignature : (signatureTypedName && signatureTypedName.trim().length > 3);
        const valid = planData.acuerdoAceptado && hasSig && planData.fechaHoraAgendada && planData.fechaHoraAgendada.trim().length > 3;
        btn.disabled = !valid;
    }

    function requestScheduleViaWhatsApp() {
        const result = loadAutodiagnosticoResult();
        const nombre = result ? result.personalData.nombre : 'Candidato';
        const message = encodeURIComponent(`Hola, ya complete mi Autodiagnóstico EC1375 y quiero coordinar la fecha de mi Evaluación. Soy ${nombre}. ¿Qué días tienen disponibles?`);
        window.open(`https://wa.me/528136071342?text=${message}`, '_blank');
    }

    function initSignatureCanvas() {
        const canvas = document.getElementById('signatureCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';

        if (signatureDataUrl) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = signatureDataUrl;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            if (e.touches && e.touches.length) return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }
        function startDraw(e) { e.preventDefault(); isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
            lastX = p.x; lastY = p.y; hasSignature = true;
        }
        function stopDraw() {
            if (isDrawing) {
                isDrawing = false;
                signatureDataUrl = canvas.toDataURL('image/png');
                savePlanProgress();
                updateGenerateButton();
            }
        }
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);
    }

    function clearSignature() {
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        signatureDataUrl = null;
        hasSignature = false;
        savePlanProgress();
        updateGenerateButton();
    }

    function generatePlan() {
        generated = true;
        savePlanProgress();
        render();
    }

    function renderGeneratedState(app, result) {
        app.innerHTML = `
            <div class="success-box">
                <h3>✅ Tu Plan de Evaluación está listo</h3>
                <p style="color:var(--text);margin-bottom:20px;">Descárgalo y compártelo con tu evaluador. Tu cita: <strong>${escapeHtml(planData.fechaHoraAgendada)}</strong></p>
                <button class="btn btn-primary btn-full" onclick="generatePDF()">📄 Descargar PDF</button>
                <button class="btn btn-secondary btn-full" onclick="generateWord()">📝 Descargar Word (.doc)</button>
                <button class="btn btn-whatsapp btn-full" onclick="notifyWhatsApp()">📱 AVISAR AL EQUIPO POR WHATSAPP</button>
            </div>
            <div class="card" style="text-align:center;margin-top:20px;">
                <a href="success.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">← Volver a mi confirmación de pago</a>
            </div>
        `;
    }

    function notifyWhatsApp() {
        const result = loadAutodiagnosticoResult();
        const nombre = result ? result.personalData.nombre : 'Candidato';
        const message = encodeURIComponent(
            `Hola, confirmé mi Plan de Evaluación EC1375.\n\nNombre: ${nombre}\nFecha agendada: ${planData.fechaHoraAgendada}\nLugar: ${planData.lugarDesarrollo}\n\nAdjunto mi PDF firmado.`
        );
        window.open(`https://wa.me/528136071342?text=${message}`, '_blank');
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const result = loadAutodiagnosticoResult();
        const pd = result.personalData;

        doc.setFontSize(15);
        doc.setFont(undefined, 'bold');
        doc.text('PLAN DE EVALUACIÓN', 105, 15, { align: 'center' });
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text('EC1375 - Prestación de servicios auxiliares en la contribución tradicional y', 105, 21, { align: 'center' });
        doc.text('complementaria de la recuperación de las condiciones físicas y socioemocionales', 105, 26, { align: 'center' });

        doc.autoTable({
            startY: 34,
            theme: 'plain',
            styles: { fontSize: 9, cellPadding: 1.5 },
            body: [
                ['Candidato/a:', pd.nombre || ''],
                ['Especialidad:', pd.escolaridad || ''],
                ['Resultado del Diagnóstico:', `${result.si}/${result.total} (${result.percentage}%)`],
                ['Procede a evaluación:', result.procedeEvaluacion ? 'SÍ' : 'NO — Se sugiere capacitación previa'],
                ['Lugar (desarrollo):', planData.lugarDesarrollo],
                ['Fecha y hora agendada:', planData.fechaHoraAgendada],
                ['Lugar (presentación resultados):', planData.lugarResultados]
            ]
        });

        let y = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(11);
        doc.setFont(undefined, 'bold');
        doc.text('CRITERIOS A EVALUAR (142 reactivos)', 14, y);
        y += 6;

        doc.autoTable({
            startY: y,
            head: [['Elemento', 'Desempeños', 'Productos', 'Conocimientos', 'Actitudes']],
            body: CRITERIOS_RESUMEN.map(c => [`${c.elemento}. ${c.titulo}`, c.desempenos, c.productos || '—', c.conocimientos || '—', c.actitudes || '—']),
            styles: { fontSize: 9, cellPadding: 3 },
            headStyles: { fillColor: [0, 136, 255] }
        });
        y = doc.lastAutoTable.finalY + 10;

        if (y > 240) { doc.addPage(); y = 15; }
        doc.setFontSize(9);
        doc.setFont(undefined, 'italic');
        const acuerdoText = doc.splitTextToSize(
            'Con la firma del presente confirmo que se me proporcionó información suficiente y detallada respecto a los desempeños, productos y conocimientos a demostrar durante la evaluación, así como el lugar, fecha y horario en que se realizará, y que se me explicó el Tríptico de Derechos y Obligaciones del Sistema Nacional de Competencias.',
            180
        );
        doc.text(acuerdoText, 14, y);
        y += acuerdoText.length * 4 + 10;

        doc.setFont(undefined, 'normal');
        doc.text('Firma del candidato/a:', 14, y);
        if (signatureMode === 'draw' && signatureDataUrl) {
            doc.addImage(signatureDataUrl, 'PNG', 14, y + 3, 55, 20);
        } else if (signatureTypedName) {
            doc.setFont(undefined, 'italic');
            doc.setFontSize(13);
            doc.text(signatureTypedName, 14, y + 12);
        }

        doc.save(`Plan_Evaluacion_EC1375_${(pd.nombre || 'candidato').replace(/\s+/g, '_')}.pdf`);
    }

    function generateWord() {
        const result = loadAutodiagnosticoResult();
        const pd = result.personalData;

        let bodyHtml = `
            <h1 style="text-align:center;font-size:18pt;">PLAN DE EVALUACIÓN</h1>
            <p style="text-align:center;font-size:10pt;">EC1375 - Prestación de servicios auxiliares en la contribución tradicional y complementaria</p>
            <table border="1" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:10pt;margin-top:14px;">
                <tr><td><strong>Candidato/a</strong></td><td>${escapeHtml(pd.nombre)}</td></tr>
                <tr><td><strong>Especialidad</strong></td><td>${escapeHtml(pd.escolaridad)}</td></tr>
                <tr><td><strong>Resultado del Diagnóstico</strong></td><td>${result.si}/${result.total} (${result.percentage}%)</td></tr>
                <tr><td><strong>Procede a evaluación</strong></td><td>${result.procedeEvaluacion ? 'SÍ' : 'NO — Se sugiere capacitación previa'}</td></tr>
                <tr><td><strong>Lugar (desarrollo)</strong></td><td>${escapeHtml(planData.lugarDesarrollo)}</td></tr>
                <tr><td><strong>Fecha y hora agendada</strong></td><td>${escapeHtml(planData.fechaHoraAgendada)}</td></tr>
                <tr><td><strong>Lugar (presentación resultados)</strong></td><td>${escapeHtml(planData.lugarResultados)}</td></tr>
            </table>

            <h2 style="margin-top:20px;font-size:12pt;">CRITERIOS A EVALUAR (142 reactivos)</h2>
            <table border="1" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:9pt;">
                <tr style="background:#0f1428;color:#fff;"><th>Elemento</th><th>Desempeños</th><th>Productos</th><th>Conocimientos</th><th>Actitudes</th></tr>
                ${CRITERIOS_RESUMEN.map(c => `<tr><td>${c.elemento}. ${escapeHtml(c.titulo)}</td><td>${c.desempenos}</td><td>${c.productos || '—'}</td><td>${c.conocimientos || '—'}</td><td>${c.actitudes || '—'}</td></tr>`).join('')}
            </table>

            <p style="margin-top:20px;font-style:italic;font-size:9pt;">Con la firma del presente confirmo que se me proporcionó información suficiente y detallada respecto a los desempeños, productos y conocimientos a demostrar durante la evaluación, así como el lugar, fecha y horario en que se realizará, y que se me explicó el Tríptico de Derechos y Obligaciones del Sistema Nacional de Competencias.</p>

            <p style="margin-top:20px;">Firma del candidato/a: ${signatureMode === 'type' && signatureTypedName ? `<em>${escapeHtml(signatureTypedName)}</em>` : (signatureDataUrl ? `<br><img src="${signatureDataUrl}" style="width:180px;">` : '____________________')}</p>
        `;

        const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Plan de Evaluación EC1375</title></head><body>";
        const postHtml = "</body></html>";
        const blob = new Blob(['﻿', preHtml + bodyHtml + postHtml], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Plan_Evaluacion_EC1375_${(pd.nombre || 'candidato').replace(/\s+/g, '_')}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    window.addEventListener('load', () => {
        loadPlanProgress();
        render();
    });
    </script>
</body>
</html>
