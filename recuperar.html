<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - EC1375 Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF;
            --accent: #FFD700; --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 60px;
        }
        .container { max-width: 560px; margin: 0 auto; padding: 24px 20px; }
        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
        }
        .top-bar-inner { max-width: 560px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .hero { text-align: center; padding: 30px 0; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.6rem; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.95rem; color: var(--text); }
        .card { background: var(--dark-light); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.85rem; color: var(--text); margin-bottom: 6px; font-weight: 600; }
        .field-group input {
            width: 100%; padding: 14px; background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            color: var(--text-bright); font-size: 1rem; font-family: inherit;
        }
        .btn {
            padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease; text-align: center; text-decoration: none;
            display: block;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-top: 10px; }
        .btn-full { width: 100%; }
        .msg { font-size: 0.88rem; margin-top: 14px; text-align: center; }
        .msg.error { color: var(--danger); }
        .msg.success { color: var(--success); }
        .step-list { margin: 16px 0 0 20px; font-size: 0.88rem; }
        .step-list li { margin-bottom: 8px; }
        .step-list a { color: var(--primary); font-weight: 600; }
        .spinner { text-align: center; color: var(--text); font-size: 0.88rem; }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">🔐 Iniciar sesión</div></div>
    <div class="container" id="app"></div>

    <script>
    const STEP_LINKS = {
        autodiagnosticoData: { label: '📋 Autodiagnóstico', href: 'autodiagnostico.html' },
        planEvaluacionData: { label: '📅 Plan de Evaluación', href: 'plan-evaluacion.html' },
        documentosSesionData: { label: '📋 Documentos de Sesión', href: 'documentos-sesion.html' },
        encuestaSatisfaccionData: { label: '📝 Encuesta de Satisfacción', href: 'encuesta-satisfaccion.html' },
        evidenciasData: { label: '📤 Evidencias', href: 'evidencias.html' }
    };

    function render() {
        document.getElementById('app').innerHTML = `
            <div class="hero">
                <div class="hero-icon">🔐</div>
                <h1 class="hero-title">Inicia sesión</h1>
                <p class="hero-subtitle">Verifica tu correo para continuar tu proceso en este dispositivo</p>
            </div>
            <div class="card" id="authGateContainer"></div>
        `;
        Auth.renderAuthGate(document.getElementById('authGateContainer'), { onVerified: handleVerified });
    }

    async function handleVerified(session) {
        const container = document.getElementById('authGateContainer');
        container.innerHTML = `<p class="spinner">Cargando tu progreso...</p>`;
        const row = await Auth.pullMyRow();
        const restored = Auth.restoreLocalStorageFromRow(row);

        if (restored.length === 0) {
            container.innerHTML = `<p class="msg success">✅ Sesión iniciada. Aún no tienes avance guardado — empieza en el <a href="autodiagnostico.html" style="color:var(--primary);">Autodiagnóstico</a>.</p>`;
            return;
        }

        container.innerHTML = `
            <p class="msg success">✅ ¡Listo, ${escapeHtml(row.nombre || 'candidato/a')}! Recuperamos tu avance en este dispositivo.</p>
            <p style="font-size:0.85rem;margin-top:10px;">Continúa donde quieras:</p>
            <ul class="step-list">
                ${restored.map(key => `<li><a href="${STEP_LINKS[key].href}">${STEP_LINKS[key].label} →</a></li>`).join('')}
            </ul>
        `;
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    render();
    </script>
</body>
</html>
