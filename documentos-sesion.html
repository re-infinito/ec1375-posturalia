<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos de Sesión EC1375 - Posturalia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a; --dark-light: #0f1428; --primary: #0088FF; --primary-light: #00CCFF;
            --accent: #FFD700; --text: #D0D0D0; --text-bright: #FFFFFF; --danger: #FF3333; --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text); line-height: 1.6; min-height: 100vh; padding-bottom: 100px;
        }

        .container { max-width: 760px; margin: 0 auto; padding: 24px 20px; }
        .top-bar {
            position: sticky; top: 0; background: var(--dark); border-bottom: 1px solid var(--dark-light);
            padding: 16px 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar-inner { font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }
        .top-bar-step { font-size: 0.8rem; color: var(--primary-light); }
        .progress-bar { height: 4px; background: var(--dark-light); }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }

        .card { background: var(--dark-light); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 1.15rem; color: var(--text-bright); margin-bottom: 6px; }
        .card p.desc { font-size: 0.85rem; color: var(--text); margin-bottom: 18px; }

        .hero { text-align: center; padding: 20px 0 30px; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.6rem; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.95rem; color: var(--text); }

        .blocked-box { background: rgba(255, 215, 0, 0.08); border: 1px solid var(--accent); border-radius: 12px; padding: 28px; text-align: center; }

        .field-group { margin-bottom: 16px; }
        .field-group label { display: block; font-size: 0.85rem; color: var(--text); margin-bottom: 6px; font-weight: 600; }
        .field-group input, .field-group textarea, .field-group select {
            width: 100%; padding: 12px 14px; background: var(--dark);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            color: var(--text-bright); font-size: 0.92rem; font-family: inherit;
            color-scheme: dark;
        }
        .field-group input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .field-row { grid-template-columns: 1fr; } }

        .section-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--primary-light); font-weight: 700; margin: 20px 0 10px; }
        .section-label:first-child { margin-top: 0; }

        .signature-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .sig-tab-btn { flex: 1; padding: 10px; background: var(--dark); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer; }
        .sig-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .sig-canvas { width: 100%; max-width: 500px; height: 130px; background: #fff; border-radius: 8px; border: 2px solid rgba(255,255,255,0.15); touch-action: none; display: block; margin: 0 auto 12px; }
        .clear-sig-btn { display: block; margin: 0 auto 16px; padding: 8px 16px; background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

        .legal-text { font-size: 0.8rem; color: var(--text); background: var(--dark); border-radius: 8px; padding: 14px; margin-bottom: 16px; line-height: 1.6; }

        .table-rows { margin-bottom: 12px; }
        .table-row-item { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 8px; margin-bottom: 8px; align-items: center; }
        .table-row-item span { font-size: 0.8rem; color: var(--text); text-align: center; }
        .table-row-item input { padding: 8px 10px; font-size: 0.85rem; }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark-light);
            border-top: 1px solid rgba(255,255,255,0.1); padding: 14px 20px;
            display: flex; gap: 12px; justify-content: center; z-index: 100;
        }
        .nav-bar .btn { flex: 1; max-width: 260px; }

        .btn { padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #20ba5a; transform: translateY(-2px); }
        .btn-full { width: 100%; margin-bottom: 12px; }

        .success-box { background: rgba(0,255,136,0.08); border: 1px solid var(--success); border-radius: 12px; padding: 24px; text-align: center; }
        .doc-download-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--dark); border-radius: 8px; margin-bottom: 10px; }
        .doc-download-item span { font-size: 0.88rem; color: var(--text-bright); font-weight: 600; }
        .doc-download-item button { padding: 8px 16px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner" id="topBarTitle">📋 Documentos de Sesión</div>
        <div class="top-bar-step" id="topBarStep"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="container" id="app"></div>

    <script>
    /* =========================================================
       CONFIG
    ========================================================= */
    const STEPS = ['intro', 'ficha', 'consentimiento', 'plan_sesion', 'plan_seguimiento', 'resultado'];
    const STEP_TITLES = { ficha: 'Ficha de Registro', consentimiento: 'Carta de Consentimiento', plan_sesion: 'Plan de Sesión', plan_seguimiento: 'Plan de Seguimiento' };
    let currentStepIndex = 0;

    let sessionData = {
        usuarioNombre: '', usuarioEdad: '', usuarioFechaNacimiento: '', usuarioDomicilio: '',
        usuarioTelefono: '', usuarioCorreo: '', contactoEmergencia: '',
        fisiologicos: '', socioemocionales: '', heredofamiliares: '', deportivos: '', consumoSustancias: '',
        presionArterial: '', pulso: '', temperatura: '', oxigenacion: '', sintomasNecesidades: '',
        tecnicaAplicar: '', expedienteNo: '', fechaConsentimiento: todayISOSession(),
        condicionesPreparacion: '', numeroSesionesPlan: '', duracionSesionPlan: '', objetivosEfectos: '',
        telefonoMovilSeguimiento: '', telefonoFijoSeguimiento: '', correoSeguimiento: '', medioContacto: '',
        notaEvolucion: '', pronostico: '', recomendaciones: ''
    };
    let sesionesSeguimiento = [{ numero: '1', frecuencia: '', duracion: '' }];

    let signatures = {
        usuarioFicha: { mode: 'draw', dataUrl: null, typed: '', uploadDataUrl: null },
        usuarioConsentimiento: { mode: 'draw', dataUrl: null, typed: '', uploadDataUrl: null },
        usuarioSeguimiento: { mode: 'draw', dataUrl: null, typed: '', uploadDataUrl: null }
    };
    let drawingState = { isDrawing: false, lastX: 0, lastY: 0 };
    let generated = false;
    let generatedPdfs = {};

    function todayISOSession() { return new Date().toISOString().split('T')[0]; }

    function loadAutodiagnosticoResult() {
        try {
            const saved = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null');
            if (!saved || !saved.personalData || !saved.personalData.nombre) return null;
            const especialidades = Array.isArray(saved.selectedCertificaciones) ? [...saved.selectedCertificaciones] : [];
            if (saved.otraCertificacionText && saved.otraCertificacionText.trim()) especialidades.push(saved.otraCertificacionText.trim());
            return {
                personalData: saved.personalData, especialidades,
                candidatoSignatureMode: saved.signatureMode || 'draw',
                candidatoSignatureDataUrl: saved.signatureDataUrl || null,
                candidatoSignatureTyped: saved.signatureTypedName || ''
            };
        } catch (e) { return null; }
    }

    function loadProgress() {
        try {
            const saved = JSON.parse(localStorage.getItem('documentosSesionData') || 'null');
            if (saved) {
                sessionData = Object.assign(sessionData, saved.sessionData || {});
                sesionesSeguimiento = saved.sesionesSeguimiento || sesionesSeguimiento;
                signatures = Object.assign(signatures, saved.signatures || {});
            }
        } catch (e) {}
    }

    function saveProgress() {
        localStorage.setItem('documentosSesionData', JSON.stringify({ sessionData, sesionesSeguimiento, signatures }));
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    /* =========================================================
       RENDER
    ========================================================= */
    function renderStep() {
        const step = STEPS[currentStepIndex];
        document.getElementById('progressFill').style.width = `${(currentStepIndex / (STEPS.length - 1)) * 100}%`;
        document.getElementById('topBarStep').textContent = STEP_TITLES[step] || '';

        const app = document.getElementById('app');
        const result = loadAutodiagnosticoResult();

        if (step !== 'intro' && !result) {
            app.innerHTML = `
                <div class="hero"><div class="hero-icon">📋</div><h1 class="hero-title">Documentos de Sesión</h1></div>
                <div class="blocked-box">
                    <p style="margin-bottom:18px;"><strong>Primero necesitas completar tu Autodiagnóstico</strong><br>Esto nos permite identificarte como el/la profesional que otorga el servicio.</p>
                    <a href="autodiagnostico.html" class="btn btn-primary">📋 Ir al Autodiagnóstico</a>
                </div>`;
            return;
        }

        if (step === 'intro') { app.innerHTML = renderIntro(); attachNav(); return; }
        if (step === 'ficha') { app.innerHTML = renderFicha(); attachFichaListeners(); setTimeout(() => initSignatureCanvas('usuarioFicha'), 50); attachNav(); return; }
        if (step === 'consentimiento') { app.innerHTML = renderConsentimiento(result); attachConsentimientoListeners(); setTimeout(() => initSignatureCanvas('usuarioConsentimiento'), 50); attachNav(); return; }
        if (step === 'plan_sesion') { app.innerHTML = renderPlanSesion(); attachPlanSesionListeners(); attachNav(); return; }
        if (step === 'plan_seguimiento') {
            if (!sessionData.telefonoMovilSeguimiento && sessionData.usuarioTelefono) sessionData.telefonoMovilSeguimiento = sessionData.usuarioTelefono;
            if (!sessionData.correoSeguimiento && sessionData.usuarioCorreo) sessionData.correoSeguimiento = sessionData.usuarioCorreo;
            saveProgress();
            app.innerHTML = renderPlanSeguimiento(); attachPlanSeguimientoListeners(); setTimeout(() => initSignatureCanvas('usuarioSeguimiento'), 50); attachNav(); return;
        }
        if (step === 'resultado') { renderResultado(app, result); return; }
    }

    function renderIntro() {
        const hasSaved = !!localStorage.getItem('documentosSesionData');
        return `
            <div class="hero">
                <div class="hero-icon">📋</div>
                <h1 class="hero-title">Documentos de tu Sesión</h1>
                <p class="hero-subtitle">Llénalos junto con tu usuario/paciente, durante o justo después de tu sesión de Zoom</p>
            </div>
            <div class="card">
                <h2>📌 ¿Qué vas a llenar?</h2>
                <p class="desc" style="margin-bottom:0;">4 documentos oficiales del expediente EC1375, con la firma digital de tu usuario/paciente en cada uno donde se requiere:</p>
                <ul style="margin:12px 0 0 20px; font-size:0.88rem; color:var(--text);">
                    <li style="margin-bottom:6px;"><strong>Ficha de Registro de Atención</strong> — datos y antecedentes del usuario</li>
                    <li style="margin-bottom:6px;"><strong>Carta de Consentimiento Informado</strong> — autorización del usuario</li>
                    <li style="margin-bottom:6px;"><strong>Plan de Sesión</strong> — condiciones y objetivos del servicio</li>
                    <li><strong>Plan de Seguimiento</strong> — contacto y sesiones programadas</li>
                </ul>
            </div>
            <button class="btn btn-primary btn-full" onclick="${hasSaved ? 'resumeFlow()' : 'goNext()'}">${hasSaved ? 'Continuar donde me quedé' : 'Comenzar →'}</button>
        `;
    }

    function resumeFlow() {
        for (let i = 1; i <= 4; i++) {
            if (!isStepValid(STEPS[i])) { currentStepIndex = i; renderStep(); return; }
        }
        currentStepIndex = STEPS.length - 1;
        renderStep();
    }

    function renderFicha() {
        const s = sessionData;
        return `
            <div class="card">
                <h2>👤 Ficha de Registro de Atención</h2>
                <p class="desc">Condiciones físicas y socioemocionales del usuario</p>

                <div class="section-label">Datos generales del usuario</div>
                <div class="field-group"><label>Nombre completo *</label><input type="text" id="f_usuarioNombre" value="${escapeHtml(s.usuarioNombre)}"></div>
                <div class="field-row">
                    <div class="field-group"><label>Edad</label><input type="text" id="f_usuarioEdad" value="${escapeHtml(s.usuarioEdad)}"></div>
                    <div class="field-group"><label>Fecha de nacimiento</label><input type="date" id="f_usuarioFechaNacimiento" value="${s.usuarioFechaNacimiento}"></div>
                </div>
                <div class="field-group"><label>Domicilio</label><input type="text" id="f_usuarioDomicilio" value="${escapeHtml(s.usuarioDomicilio)}"></div>
                <div class="field-row">
                    <div class="field-group"><label>Teléfono</label><input type="tel" id="f_usuarioTelefono" value="${escapeHtml(s.usuarioTelefono)}"></div>
                    <div class="field-group"><label>Correo electrónico</label><input type="email" id="f_usuarioCorreo" value="${escapeHtml(s.usuarioCorreo)}"></div>
                </div>
                <div class="field-group"><label>Nombre de familiar o responsable a avisar</label><input type="text" id="f_contactoEmergencia" value="${escapeHtml(s.contactoEmergencia)}"></div>

                <div class="section-label">Antecedentes</div>
                <div class="field-group"><label>Fisiológicos</label><textarea id="f_fisiologicos" rows="2">${escapeHtml(s.fisiologicos)}</textarea></div>
                <div class="field-group"><label>Socioemocionales</label><textarea id="f_socioemocionales" rows="2">${escapeHtml(s.socioemocionales)}</textarea></div>
                <div class="field-group"><label>Heredofamiliares</label><textarea id="f_heredofamiliares" rows="2">${escapeHtml(s.heredofamiliares)}</textarea></div>
                <div class="field-group"><label>Actividad deportiva</label><input type="text" id="f_deportivos" value="${escapeHtml(s.deportivos)}"></div>
                <div class="field-group"><label>Consumo de sustancias</label><input type="text" id="f_consumoSustancias" value="${escapeHtml(s.consumoSustancias)}" placeholder="Ej. No / Tabaco ocasional"></div>

                <div class="section-label">Signos vitales</div>
                <div class="field-row">
                    <div class="field-group"><label>Presión arterial</label><input type="text" id="f_presionArterial" value="${escapeHtml(s.presionArterial)}" placeholder="120/80"></div>
                    <div class="field-group"><label>Pulso</label><input type="text" id="f_pulso" value="${escapeHtml(s.pulso)}" placeholder="lpm"></div>
                </div>
                <div class="field-row">
                    <div class="field-group"><label>Temperatura</label><input type="text" id="f_temperatura" value="${escapeHtml(s.temperatura)}" placeholder="°C"></div>
                    <div class="field-group"><label>Oxigenación (SpO2)</label><input type="text" id="f_oxigenacion" value="${escapeHtml(s.oxigenacion)}" placeholder="%"></div>
                </div>

                <div class="section-label">Motivo de consulta</div>
                <div class="field-group"><label>Síntomas, necesidades o interés para recibir tratamiento</label><textarea id="f_sintomasNecesidades" rows="2">${escapeHtml(s.sintomasNecesidades)}</textarea></div>

                <div class="legal-text">Nota importante: Los servicios tradicionales y complementarios que se ofrecen no cubren, ni sustituyen las indicaciones del médico tratante.</div>

                <div class="section-label">Firma del usuario</div>
                ${renderSignaturePad('usuarioFicha')}
            </div>
        `;
    }

    function renderConsentimiento(result) {
        const s = sessionData;
        const especialidadesOptions = (result.especialidades || []).map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
        return `
            <div class="card">
                <h2>📝 Carta de Consentimiento Informado</h2>
                <p class="desc">Autorización del usuario para recibir el servicio</p>

                <div class="field-group">
                    <label>Técnica a aplicar *</label>
                    <select id="f_tecnicaAplicar">
                        <option value="">Selecciona...</option>
                        ${especialidadesOptions}
                        <option value="Otra">Otra</option>
                    </select>
                </div>
                <div class="field-row">
                    <div class="field-group"><label>Expediente No.</label><input type="text" id="f_expedienteNo" value="${escapeHtml(s.expedienteNo)}" placeholder="Ej. 250812"></div>
                    <div class="field-group"><label>Fecha</label><input type="date" id="f_fechaConsentimiento" value="${s.fechaConsentimiento}"></div>
                </div>

                <div class="legal-text">
                    Yo, <strong>${escapeHtml(s.usuarioNombre) || '[nombre del usuario]'}</strong>, expreso mi libre voluntad para autorizar el procedimiento señalado en este documento después de haberme proporcionado la información completa sobre padecimiento o estado actual, la cual fue realizada en forma amplia, precisa y suficiente en un lenguaje claro y sencillo, informándome sobre posibles riesgos, complicaciones y secuelas de igual forma los beneficios.
                    <br><br>
                    El especialista informó métodos alternativos, el derecho de cambiar mi decisión en cualquier momento y manifestarla antes de cualquier procedimiento. Con el propósito de que mi atención sea adecuada, me comprometo a proporcionar información completa y veraz, así como seguir las indicaciones del especialista.
                    <br><br>
                    Otorgo mi autorización al personal asistente auxiliar, así como al profesional que brinda los servicios tradicionales y complementarios la atención de contingencias y urgencias derivadas del procedimiento señalado, atendiendo al principio de libertad prescriptiva.
                </div>

                <div class="section-label">Firma del usuario (consentimiento)</div>
                ${renderSignaturePad('usuarioConsentimiento')}
            </div>
        `;
    }

    function renderPlanSesion() {
        const s = sessionData;
        return `
            <div class="card">
                <h2>📅 Plan de Sesión</h2>
                <p class="desc">Condiciones y objetivos del servicio a otorgar</p>

                <div class="field-group"><label>Condiciones de preparación</label><textarea id="f_condicionesPreparacion" rows="2" placeholder="Ej. Limpieza de camilla y sábana desechable nueva">${escapeHtml(s.condicionesPreparacion)}</textarea></div>
                <div class="field-row">
                    <div class="field-group"><label>Número de sesiones planeadas</label><input type="text" id="f_numeroSesionesPlan" value="${escapeHtml(s.numeroSesionesPlan)}" placeholder="Ej. 7"></div>
                    <div class="field-group"><label>Duración de cada sesión</label><input type="text" id="f_duracionSesionPlan" value="${escapeHtml(s.duracionSesionPlan)}" placeholder="Ej. 1 hora"></div>
                </div>
                <div class="field-group"><label>Objetivos y efectos generales</label><textarea id="f_objetivosEfectos" rows="3" placeholder="Ej. Armonización, balance, bienestar general">${escapeHtml(s.objetivosEfectos)}</textarea></div>
            </div>
        `;
    }

    function renderPlanSeguimiento() {
        const s = sessionData;
        return `
            <div class="card">
                <h2>📞 Plan de Seguimiento</h2>
                <p class="desc">Contacto y sesiones programadas para dar seguimiento al usuario. Teléfono y correo se precargan de la Ficha de Registro — corrígelos aquí solo si el seguimiento debe hacerse por un medio distinto.</p>

                <div class="field-group"><label>Nombre del usuario</label><input type="text" value="${escapeHtml(s.usuarioNombre)}" disabled style="opacity:0.6;"></div>
                <div class="field-row">
                    <div class="field-group"><label>Teléfono móvil</label><input type="tel" id="f_telefonoMovilSeguimiento" value="${escapeHtml(s.telefonoMovilSeguimiento)}"></div>
                    <div class="field-group"><label>Teléfono fijo</label><input type="tel" id="f_telefonoFijoSeguimiento" value="${escapeHtml(s.telefonoFijoSeguimiento)}"></div>
                </div>
                <div class="field-group"><label>Correo electrónico</label><input type="email" id="f_correoSeguimiento" value="${escapeHtml(s.correoSeguimiento)}"></div>
                <div class="field-group"><label>Medio de contacto para seguimiento</label><input type="text" id="f_medioContacto" value="${escapeHtml(s.medioContacto)}" placeholder="Ej. Celular / WhatsApp"></div>

                <div class="section-label">Sesiones programadas</div>
                <div class="table-rows" id="sesionesRows">${renderSesionesRows()}</div>
                <button type="button" class="btn btn-secondary btn-full" onclick="addSesionRow()" style="margin-bottom:20px;">+ Agregar sesión</button>

                <div class="section-label">Notas</div>
                <div class="field-group"><label>Nota de evolución</label><textarea id="f_notaEvolucion" rows="2">${escapeHtml(s.notaEvolucion)}</textarea></div>
                <div class="field-group"><label>Pronóstico</label><input type="text" id="f_pronostico" value="${escapeHtml(s.pronostico)}" placeholder="Ej. Positivo, paciente consciente y con apertura"></div>
                <div class="field-group"><label>Recomendaciones / ejercicios para casa</label><textarea id="f_recomendaciones" rows="2">${escapeHtml(s.recomendaciones)}</textarea></div>

                <div class="section-label">Firma del usuario</div>
                ${renderSignaturePad('usuarioSeguimiento')}
            </div>
        `;
    }

    function renderSesionesRows() {
        return sesionesSeguimiento.map((row, idx) => `
            <div class="table-row-item">
                <span>${idx + 1}</span>
                <input type="text" placeholder="Frecuencia (ej. Lunes)" value="${escapeHtml(row.frecuencia)}" oninput="updateSesionRow(${idx}, 'frecuencia', this.value)">
                <input type="text" placeholder="Duración (ej. 1 hr)" value="${escapeHtml(row.duracion)}" oninput="updateSesionRow(${idx}, 'duracion', this.value)">
            </div>
        `).join('');
    }

    function addSesionRow() {
        sesionesSeguimiento.push({ numero: String(sesionesSeguimiento.length + 1), frecuencia: '', duracion: '' });
        saveProgress();
        document.getElementById('sesionesRows').innerHTML = renderSesionesRows();
    }

    function updateSesionRow(idx, field, value) {
        sesionesSeguimiento[idx][field] = value;
        saveProgress();
    }

    /* =========================================================
       SIGNATURE PAD (reusable, multiple instances by key)
    ========================================================= */
    function renderSignaturePad(key) {
        const sig = signatures[key];
        return `
            <div class="signature-tabs">
                <button type="button" class="sig-tab-btn ${sig.mode === 'draw' ? 'active' : ''}" onclick="setSignatureMode('${key}', 'draw')">✍️ Dibujar</button>
                <button type="button" class="sig-tab-btn ${sig.mode === 'type' ? 'active' : ''}" onclick="setSignatureMode('${key}', 'type')">⌨️ Escribir nombre</button>
                <button type="button" class="sig-tab-btn ${sig.mode === 'upload' ? 'active' : ''}" onclick="setSignatureMode('${key}', 'upload')">📎 Adjuntar firma</button>
            </div>
            <div id="sigPad_${key}" style="${sig.mode === 'draw' ? '' : 'display:none;'}">
                <canvas class="sig-canvas" id="canvas_${key}" width="500" height="130"></canvas>
                <button type="button" class="clear-sig-btn" onclick="clearSignature('${key}')">Borrar firma</button>
            </div>
            <div id="sigTyped_${key}" style="${sig.mode === 'type' ? '' : 'display:none;'}">
                <div class="field-group">
                    <input type="text" id="input_${key}" value="${escapeHtml(sig.typed)}" placeholder="Nombre completo" oninput="updateTypedSignature('${key}', this.value)">
                </div>
            </div>
            <div id="sigUpload_${key}" style="${sig.mode === 'upload' ? '' : 'display:none;'}">
                <p class="desc" style="margin-bottom:10px;">Útil si la sesión es a distancia: pide al usuario que firme en su propio dispositivo (o en papel) y sube la foto o imagen de su firma.</p>
                ${sig.uploadDataUrl ? `<img src="${sig.uploadDataUrl}" style="max-width:100%; max-height:130px; background:#fff; border-radius:8px; border:2px solid rgba(255,255,255,0.15); display:block; margin-bottom:12px;">` : ''}
                <input type="file" accept="image/*" id="fileInput_${key}" onchange="handleSignatureUpload('${key}', this)" style="margin-bottom:12px;">
                ${sig.uploadDataUrl ? `<button type="button" class="clear-sig-btn" onclick="clearUploadSignature('${key}')">Quitar firma</button>` : ''}
            </div>
        `;
    }

    function setSignatureMode(key, mode) {
        signatures[key].mode = mode;
        saveProgress();
        renderStep();
    }

    function updateTypedSignature(key, value) {
        signatures[key].typed = value;
        saveProgress();
        updateNavButtons();
    }

    function initSignatureCanvas(key) {
        const canvas = document.getElementById(`canvas_${key}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        if (signatures[key].dataUrl) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = signatures[key].dataUrl;
        }
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            if (e.touches && e.touches.length) return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }
        function startDraw(e) { e.preventDefault(); drawingState.isDrawing = true; const p = getPos(e); drawingState.lastX = p.x; drawingState.lastY = p.y; }
        function draw(e) {
            if (!drawingState.isDrawing) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.beginPath(); ctx.moveTo(drawingState.lastX, drawingState.lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
            drawingState.lastX = p.x; drawingState.lastY = p.y;
        }
        function stopDraw() {
            if (drawingState.isDrawing) {
                drawingState.isDrawing = false;
                signatures[key].dataUrl = canvas.toDataURL('image/png');
                saveProgress();
                updateNavButtons();
            }
        }
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);
    }

    function clearSignature(key) {
        const canvas = document.getElementById(`canvas_${key}`);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        signatures[key].dataUrl = null;
        saveProgress();
        updateNavButtons();
    }

    function hasSignature(key) {
        const sig = signatures[key];
        if (sig.mode === 'draw') return !!sig.dataUrl;
        if (sig.mode === 'upload') return !!sig.uploadDataUrl;
        return sig.typed && sig.typed.trim().length > 3;
    }

    function handleSignatureUpload(key, inputEl) {
        const file = inputEl.files && inputEl.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            signatures[key].uploadDataUrl = reader.result;
            saveProgress();
            renderStep();
        };
        reader.readAsDataURL(file);
    }

    function clearUploadSignature(key) {
        signatures[key].uploadDataUrl = null;
        saveProgress();
        renderStep();
    }

    /* =========================================================
       FIELD LISTENERS
    ========================================================= */
    function bindFields(fields) {
        fields.forEach(field => {
            const el = document.getElementById('f_' + field);
            if (el) {
                el.addEventListener('input', () => { sessionData[field] = el.value; saveProgress(); updateNavButtons(); });
                el.addEventListener('change', () => { sessionData[field] = el.value; saveProgress(); updateNavButtons(); });
            }
        });
    }

    function attachFichaListeners() {
        bindFields(['usuarioNombre', 'usuarioEdad', 'usuarioFechaNacimiento', 'usuarioDomicilio', 'usuarioTelefono', 'usuarioCorreo',
            'contactoEmergencia', 'fisiologicos', 'socioemocionales', 'heredofamiliares', 'deportivos', 'consumoSustancias',
            'presionArterial', 'pulso', 'temperatura', 'oxigenacion', 'sintomasNecesidades']);
    }
    function attachConsentimientoListeners() { bindFields(['tecnicaAplicar', 'expedienteNo', 'fechaConsentimiento']); }
    function attachPlanSesionListeners() { bindFields(['condicionesPreparacion', 'numeroSesionesPlan', 'duracionSesionPlan', 'objetivosEfectos']); }
    function attachPlanSeguimientoListeners() { bindFields(['telefonoMovilSeguimiento', 'telefonoFijoSeguimiento', 'correoSeguimiento', 'medioContacto', 'notaEvolucion', 'pronostico', 'recomendaciones']); }

    /* =========================================================
       NAVIGATION
    ========================================================= */
    function isStepValid(step) {
        if (step === 'ficha') return !!sessionData.usuarioNombre && hasSignature('usuarioFicha');
        if (step === 'consentimiento') return !!sessionData.tecnicaAplicar && hasSignature('usuarioConsentimiento');
        if (step === 'plan_sesion') return !!sessionData.objetivosEfectos;
        if (step === 'plan_seguimiento') return hasSignature('usuarioSeguimiento');
        return true;
    }

    function attachNav() {
        const step = STEPS[currentStepIndex];
        if (step === 'intro' || step === 'resultado') return;
        const app = document.getElementById('app');
        const isLast = step === 'plan_seguimiento';
        const navHtml = `
            <div class="nav-bar">
                ${currentStepIndex > 0 ? '<button class="btn btn-secondary" onclick="goBack()">← Atrás</button>' : ''}
                <button class="btn btn-primary" id="btnNext" onclick="${isLast ? 'goGenerate()' : 'goNext()'}">${isLast ? 'Generar Documentos →' : 'Siguiente →'}</button>
            </div>
        `;
        app.insertAdjacentHTML('beforeend', navHtml);
        updateNavButtons();
    }

    function updateNavButtons() {
        const btn = document.getElementById('btnNext');
        if (!btn) return;
        const step = STEPS[currentStepIndex];
        btn.disabled = step !== 'intro' && step !== 'resultado' && !isStepValid(step);
    }

    function goNext() {
        if (currentStepIndex < STEPS.length - 1) { currentStepIndex++; renderStep(); window.scrollTo(0, 0); }
    }
    function goBack() {
        if (currentStepIndex > 0) { currentStepIndex--; renderStep(); window.scrollTo(0, 0); }
    }
    function goGenerate() {
        currentStepIndex = STEPS.indexOf('resultado');
        generated = true;
        renderStep();
        window.scrollTo(0, 0);
    }

    function addOfficialLogos(doc) {
        doc.addImage(LOGO_CONOCER_BASE64, 'PNG', 14, 8, 20, 11.8);
        doc.addImage(LOGO_ICE_BASE64, 'PNG', 163, 10, 33, 11.3);
    }

    function imageFormatFromDataUrl(dataUrl) {
        const match = /^data:image\/(\w+);/.exec(dataUrl || '');
        const type = (match ? match[1] : 'png').toUpperCase();
        return type === 'JPG' ? 'JPEG' : type;
    }

    /* =========================================================
       PDF GENERATION
    ========================================================= */
    function docHeader(doc, titulo, docLabel) {
        addOfficialLogos(doc);
        doc.setFontSize(8);
        doc.setFont(undefined, 'normal');
        doc.text(docLabel, 14, 22);
        doc.setFontSize(14);
        doc.setFont(undefined, 'bold');
        doc.text(titulo, 105, 30, { align: 'center' });
    }

    function drawSignatureBlock(doc, y, label, key, candidatoLabel, candidatoInfo) {
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text(label, 14, y);
        const sig = signatures[key];
        if (sig.mode === 'draw' && sig.dataUrl) {
            doc.addImage(sig.dataUrl, 'PNG', 14, y + 3, 55, 20);
        } else if (sig.mode === 'upload' && sig.uploadDataUrl) {
            doc.addImage(sig.uploadDataUrl, imageFormatFromDataUrl(sig.uploadDataUrl), 14, y + 3, 55, 20);
        } else if (sig.typed) {
            doc.setFont(undefined, 'italic'); doc.setFontSize(12);
            doc.text(sig.typed, 14, y + 14);
        }
        if (candidatoLabel && candidatoInfo) {
            doc.setFont(undefined, 'normal'); doc.setFontSize(9);
            doc.text(candidatoLabel, 110, y);
            if (candidatoInfo.mode === 'draw' && candidatoInfo.dataUrl) {
                doc.addImage(candidatoInfo.dataUrl, 'PNG', 110, y + 3, 55, 20);
            } else if (candidatoInfo.typed) {
                doc.setFont(undefined, 'italic'); doc.setFontSize(12);
                doc.text(candidatoInfo.typed, 110, y + 14);
            }
        }
    }

    function generateFichaPDF(result) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = sessionData;
        docHeader(doc, 'FICHA DE REGISTRO DE ATENCIÓN', 'DOC 1');
        doc.setFontSize(8);
        doc.text('Condiciones físicas y socioemocionales', 105, 35, { align: 'center' });

        doc.autoTable({
            startY: 42, theme: 'plain', styles: { fontSize: 9, cellPadding: 1.5 },
            body: [
                ['Nombre completo:', s.usuarioNombre || ''],
                ['Edad:', s.usuarioEdad || ''],
                ['Fecha de nacimiento:', s.usuarioFechaNacimiento || ''],
                ['Domicilio:', s.usuarioDomicilio || ''],
                ['Teléfono:', s.usuarioTelefono || ''],
                ['Correo electrónico:', s.usuarioCorreo || ''],
                ['Familiar/responsable a avisar:', s.contactoEmergencia || '']
            ]
        });
        let y = doc.lastAutoTable.finalY + 8;
        doc.autoTable({
            startY: y, head: [['Antecedentes', 'Detalle']], styles: { fontSize: 8.5, cellPadding: 3 }, headStyles: { fillColor: [0, 136, 255] },
            body: [
                ['Fisiológicos', s.fisiologicos || '—'],
                ['Socioemocionales', s.socioemocionales || '—'],
                ['Heredofamiliares', s.heredofamiliares || '—'],
                ['Actividad deportiva', s.deportivos || '—'],
                ['Consumo de sustancias', s.consumoSustancias || '—']
            ]
        });
        y = doc.lastAutoTable.finalY + 8;
        doc.autoTable({
            startY: y, head: [['Signos vitales', 'Valor']], styles: { fontSize: 8.5, cellPadding: 3 }, headStyles: { fillColor: [0, 136, 255] },
            body: [
                ['Presión arterial', s.presionArterial || '—'],
                ['Pulso', s.pulso || '—'],
                ['Temperatura', s.temperatura || '—'],
                ['Oxigenación (SpO2)', s.oxigenacion || '—']
            ]
        });
        y = doc.lastAutoTable.finalY + 8;
        doc.setFontSize(9); doc.setFont(undefined, 'bold');
        doc.text('Síntomas, necesidades o interés para recibir tratamiento:', 14, y); y += 6;
        doc.setFont(undefined, 'normal');
        const sintomasLines = doc.splitTextToSize(s.sintomasNecesidades || '—', 180);
        doc.text(sintomasLines, 14, y); y += sintomasLines.length * 5 + 8;

        doc.setFont(undefined, 'italic'); doc.setFontSize(8);
        const nota = doc.splitTextToSize('Nota importante: Los servicios tradicionales y complementarios que se ofrecen no cubren, ni sustituyen las indicaciones del médico tratante.', 180);
        doc.text(nota, 14, y); y += nota.length * 4 + 12;

        if (y > 240) { doc.addPage(); addOfficialLogos(doc); y = 30; }
        drawSignatureBlock(doc, y, 'Nombre completo y firma del usuario:', 'usuarioFicha', 'Nombre y firma del candidato/a:', {
            mode: result.candidatoSignatureMode, dataUrl: result.candidatoSignatureDataUrl, typed: result.candidatoSignatureTyped
        });

        const blob = doc.output('blob');
        return { blob, filename: `Ficha_Registro_${(result.personalData.nombre || 'candidato').replace(/\s+/g, '_')}.pdf` };
    }

    function generateConsentimientoPDF(result) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = sessionData;
        docHeader(doc, 'CARTA DE CONSENTIMIENTO INFORMADO', 'DOC 2');

        doc.autoTable({
            startY: 42, theme: 'plain', styles: { fontSize: 9, cellPadding: 1.5 },
            body: [
                ['Nombre del usuario:', s.usuarioNombre || ''],
                ['Técnica a aplicar:', s.tecnicaAplicar || ''],
                ['Expediente No.:', s.expedienteNo || ''],
                ['Fecha:', s.fechaConsentimiento || '']
            ]
        });
        let y = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(9); doc.setFont(undefined, 'normal');
        const consentText = `Yo, ${s.usuarioNombre || '[nombre del usuario]'}, expreso mi libre voluntad para autorizar el procedimiento señalado en este documento después de haberme proporcionado la información completa sobre padecimiento o estado actual, la cual fue realizada en forma amplia, precisa y suficiente en un lenguaje claro y sencillo, informándome sobre posibles riesgos, complicaciones y secuelas de igual forma los beneficios. El especialista informó métodos alternativos, el derecho de cambiar mi decisión en cualquier momento y manifestarla antes de cualquier procedimiento. Con el propósito de que mi atención sea adecuada, me comprometo a proporcionar información completa y veraz, así como seguir las indicaciones del especialista. Otorgo mi autorización al personal asistente auxiliar, así como al profesional que brinda los servicios tradicionales y complementarios la atención de contingencias y urgencias derivadas del procedimiento señalado, atendiendo al principio de libertad prescriptiva.`;
        const lines = doc.splitTextToSize(consentText, 180);
        doc.text(lines, 14, y); y += lines.length * 5 + 15;

        if (y > 240) { doc.addPage(); addOfficialLogos(doc); y = 30; }
        drawSignatureBlock(doc, y, 'Nombre completo y firma del usuario:', 'usuarioConsentimiento');

        const blob = doc.output('blob');
        return { blob, filename: `Carta_Consentimiento_${(result.personalData.nombre || 'candidato').replace(/\s+/g, '_')}.pdf` };
    }

    function generatePlanSesionPDF(result) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = sessionData;
        docHeader(doc, 'PLAN DE SESIÓN', 'DOC 3');

        doc.autoTable({
            startY: 42, theme: 'plain', styles: { fontSize: 9, cellPadding: 1.5 },
            body: [['Usuario:', s.usuarioNombre || ''], ['Fecha:', todayISOSession()]]
        });
        let y = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(10); doc.setFont(undefined, 'bold'); doc.text('Condiciones de preparación', 14, y); y += 6;
        doc.setFont(undefined, 'normal'); doc.setFontSize(9);
        let lines = doc.splitTextToSize(s.condicionesPreparacion || '—', 180);
        doc.text(lines, 14, y); y += lines.length * 5 + 10;

        doc.autoTable({
            startY: y, head: [['No. de sesiones', 'Duración de cada sesión']], styles: { fontSize: 9, cellPadding: 3 }, headStyles: { fillColor: [0, 136, 255] },
            body: [[s.numeroSesionesPlan || '—', s.duracionSesionPlan || '—']]
        });
        y = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(10); doc.setFont(undefined, 'bold'); doc.text('Objetivos y efectos generales', 14, y); y += 6;
        doc.setFont(undefined, 'normal'); doc.setFontSize(9);
        lines = doc.splitTextToSize(s.objetivosEfectos || '—', 180);
        doc.text(lines, 14, y);

        const blob = doc.output('blob');
        return { blob, filename: `Plan_Sesion_${(result.personalData.nombre || 'candidato').replace(/\s+/g, '_')}.pdf` };
    }

    function generatePlanSeguimientoPDF(result) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = sessionData;
        docHeader(doc, 'PLAN DE SEGUIMIENTO', 'DOC 4');

        doc.autoTable({
            startY: 42, theme: 'plain', styles: { fontSize: 9, cellPadding: 1.5 },
            body: [
                ['Nombre del usuario:', s.usuarioNombre || ''],
                ['Fecha:', todayISOSession()],
                ['Teléfono móvil:', s.telefonoMovilSeguimiento || ''],
                ['Teléfono fijo:', s.telefonoFijoSeguimiento || ''],
                ['Correo electrónico:', s.correoSeguimiento || ''],
                ['Medio de contacto para seguimiento:', s.medioContacto || '']
            ]
        });
        let y = doc.lastAutoTable.finalY + 8;
        doc.autoTable({
            startY: y, head: [['Sesión No.', 'Frecuencia', 'Duración']], styles: { fontSize: 9, cellPadding: 3 }, headStyles: { fillColor: [0, 136, 255] },
            body: sesionesSeguimiento.map(row => [row.numero, row.frecuencia || '—', row.duracion || '—'])
        });
        y = doc.lastAutoTable.finalY + 10;

        doc.setFontSize(9); doc.setFont(undefined, 'bold'); doc.text('Nota de evolución:', 14, y); y += 5;
        doc.setFont(undefined, 'normal');
        let lines = doc.splitTextToSize(s.notaEvolucion || '—', 180);
        doc.text(lines, 14, y); y += lines.length * 5 + 6;

        doc.setFont(undefined, 'bold'); doc.text('Pronóstico:', 14, y); y += 5;
        doc.setFont(undefined, 'normal');
        lines = doc.splitTextToSize(s.pronostico || '—', 180);
        doc.text(lines, 14, y); y += lines.length * 5 + 6;

        doc.setFont(undefined, 'bold'); doc.text('Recomendaciones / ejercicios para casa:', 14, y); y += 5;
        doc.setFont(undefined, 'normal');
        lines = doc.splitTextToSize(s.recomendaciones || '—', 180);
        doc.text(lines, 14, y); y += lines.length * 5 + 12;

        if (y > 235) { doc.addPage(); addOfficialLogos(doc); y = 30; }
        drawSignatureBlock(doc, y, 'Nombre completo y firma del usuario:', 'usuarioSeguimiento', 'Nombre y firma del profesional:', {
            mode: result.candidatoSignatureMode, dataUrl: result.candidatoSignatureDataUrl, typed: result.candidatoSignatureTyped
        });

        const blob = doc.output('blob');
        return { blob, filename: `Plan_Seguimiento_${(result.personalData.nombre || 'candidato').replace(/\s+/g, '_')}.pdf` };
    }

    function renderResultado(app, result) {
        generatedPdfs = {
            ficha: generateFichaPDF(result),
            consentimiento: generateConsentimientoPDF(result),
            plan_sesion: generatePlanSesionPDF(result),
            plan_seguimiento: generatePlanSeguimientoPDF(result)
        };
        saveProgress();

        const docs = [
            { key: 'ficha', label: '📋 Ficha de Registro de Atención' },
            { key: 'consentimiento', label: '📝 Carta de Consentimiento Informado' },
            { key: 'plan_sesion', label: '📅 Plan de Sesión' },
            { key: 'plan_seguimiento', label: '📞 Plan de Seguimiento' }
        ];

        app.innerHTML = `
            <div class="success-box">
                <h3 style="color:var(--success);margin-bottom:10px;">✅ Tus 4 documentos están listos</h3>
                <p style="color:var(--text);margin-bottom:20px;">Descarga cada uno y súbelo a la pregunta correspondiente en el formulario de Evidencias.</p>
                ${docs.map(d => `
                    <div class="doc-download-item">
                        <span>${d.label}</span>
                        <button class="btn btn-primary" onclick="downloadDoc('${d.key}')">Descargar</button>
                    </div>
                `).join('')}
            </div>
            <div class="card" style="text-align:center;margin-top:20px;">
                <a href="encuesta-satisfaccion.html" class="btn btn-primary btn-full" style="display:block;text-decoration:none;margin-bottom:14px;">📝 Siguiente: Encuesta de Satisfacción →</a>
                <a href="plan-evaluacion.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">← Volver a mi Plan de Evaluación</a>
            </div>
        `;
    }

    function downloadDoc(key) {
        const { blob, filename } = generatedPdfs[key];
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    window.addEventListener('load', () => { loadProgress(); renderStep(); });
    </script>
</body>
</html>
