<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Guion Maestro de Sesión - Paideia Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="contenido.js"></script>
    <script src="protect.js" data-protect-print="allow"></script>
    <script src="flow-status.js"></script>
    <script src="sala-evidencias.js"></script>
    <script src="crm-shell.js" data-crm-page="plan-evaluacion"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
            --border: rgba(255,255,255,0.12); --surface-2: rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container { max-width: 780px; margin: 0 auto; padding: 24px 20px; }

        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
        }
        .top-bar-inner { max-width: 780px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }

        .hero { text-align: center; padding: 20px 0 24px; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.6rem; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; }
        .hero-subtitle { font-size: 0.95rem; color: var(--text); }

        .card { background: var(--dark-light); border-radius: 12px; padding: 22px; margin-bottom: 18px; }
        .card h2 { font-size: 1.05rem; color: var(--text-bright); margin-bottom: 10px; }
        .card p.desc { font-size: 0.85rem; color: var(--text); }

        .blocked-box, .pay-box {
            border-radius: 12px; padding: 28px; text-align: center;
        }
        .blocked-box { background: rgba(255, 215, 0, 0.08); border: 1px solid var(--accent); }
        .pay-box { background: linear-gradient(135deg, rgba(0,136,255,0.15), rgba(0,204,255,0.05)); border: 2px solid var(--primary); }
        .blocked-box p, .pay-box p { color: var(--text); margin-bottom: 18px; }

        .btn {
            padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease; text-align: center;
            display: inline-block; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-primary:disabled { background: var(--border); color: var(--text); cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-full { width: 100%; margin-bottom: 12px; }

        /* Tabla de contenidos */
        .toc { background: var(--dark-light); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .toc summary { cursor: pointer; font-weight: 700; color: var(--text-bright); font-size: 0.95rem; }
        .toc-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 14px; }
        .toc-list a {
            color: var(--primary-light); text-decoration: none; font-size: 0.82rem;
            padding: 4px 0; display: block;
        }
        .toc-list a:hover { text-decoration: underline; }

        /* Secciones del guion */
        .guion-section {
            background: var(--dark-light); border-radius: 12px; padding: 22px;
            margin-bottom: 16px; scroll-margin-top: 70px;
        }
        .guion-section h3 {
            color: var(--accent); font-size: 1.05rem; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .guion-section .num-badge {
            background: var(--primary); color: white; width: 26px; height: 26px;
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.8rem; flex-shrink: 0;
        }
        .subtitulo { font-size: 0.85rem; font-weight: 700; color: var(--primary-light); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.3px; }
        .item-accion {
            display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px;
            font-size: 0.88rem; color: var(--text-bright);
        }
        .item-accion .tag {
            background: rgba(0,136,255,0.2); color: var(--primary-light); font-size: 0.68rem;
            font-weight: 700; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; margin-top: 2px;
        }
        .item-dialogo {
            background: var(--dark); border-left: 3px solid var(--primary); border-radius: 0 6px 6px 0;
            padding: 8px 12px; margin-bottom: 8px; font-size: 0.88rem; font-style: italic; color: var(--text);
        }
        .item-usuario {
            background: var(--surface-2); border-left: 3px solid var(--border); border-radius: 0 6px 6px 0;
            padding: 8px 12px; margin-bottom: 8px; font-size: 0.85rem; font-style: italic; color: var(--text);
            margin-left: 16px;
        }
        .item-nota {
            background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.3); border-radius: 8px;
            padding: 10px 12px; margin: 10px 0; font-size: 0.82rem; color: var(--accent);
        }
        .item-lista { font-size: 0.85rem; color: var(--text); margin: 4px 0 10px 20px; }
        .item-lista li { margin-bottom: 4px; }

        /* Checklist final */
        .checklist-item {
            display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
            border-bottom: 1px solid var(--surface-2); font-size: 0.85rem;
        }
        .checklist-item input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
        .checklist-item label { color: var(--text); cursor: pointer; }
        .checklist-item.checked label { color: var(--success); text-decoration: line-through; opacity: 0.7; }
        .mini-checklist { margin: 6px 0 10px; }
        .mini-checklist .checklist-item { padding: 6px 0; font-size: 0.85rem; }
        .section-checkpoint {
            margin-top: 16px; padding: 10px 12px !important; background: rgba(255,215,0,0.06);
            border: 1px solid rgba(255,215,0,0.25); border-radius: 8px;
        }
        .section-checkpoint label { color: var(--accent) !important; font-weight: 700; }
        .section-checkpoint.checked { background: rgba(0,255,136,0.08); border-color: var(--success); }
        .section-checkpoint.checked label { color: var(--success) !important; }
        .video-ejemplo {
            margin-top: 14px; border-radius: 10px; overflow: hidden;
            background: var(--dark); border: 1px solid var(--border);
        }
        .video-ejemplo .ph {
            aspect-ratio: 9 / 16; max-height: 360px; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; cursor: pointer;
            background: linear-gradient(135deg, rgba(0,136,255,0.18), rgba(5,10,26,0.6));
        }
        .video-ejemplo .ph .ic { font-size: 2.2rem; color: var(--primary-light); }
        .video-ejemplo .ph .nm { font-size: 0.85rem; color: var(--text-bright); font-weight: 700; }
        .video-ejemplo .ph .ins { font-size: 0.75rem; color: var(--text); }
        .video-ejemplo iframe { width: 100%; aspect-ratio: 9 / 16; max-height: 360px; display: block; border: 0; }
        /* Excepción: video horizontal (no Short) — ver comentario en renderVideoEjemplo() */
        .video-ejemplo.wide .ph, .video-ejemplo.wide iframe { aspect-ratio: 16 / 9; max-height: none; }
        .video-proximamente {
            margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 0.8rem;
            color: var(--text); background: rgba(255,215,0,0.06); border: 1px dashed rgba(255,215,0,0.35);
        }
        .checklist-progress {
            font-size: 0.85rem; color: var(--text-bright); font-weight: 700; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .progress-bar-bg { background: var(--dark); border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 16px; }
        .progress-bar-fill { background: var(--success); height: 100%; transition: width 0.3s ease; }

        @media (max-width: 500px) {
            .toc-list { grid-template-columns: 1fr; }
        }
        /* Imprimir o guardar en PDF (18 sep): solo el guion, con la marca de
           agua del candidato en cada hoja. */
        .guion-marca-print { display: none; }
        .btn-imprimir-guion { margin: 0 0 18px; }
        @media print {
            .crm-sidebar, .crm-topbar, .crm-backdrop, .crm-fab, .crm-tut, .btn-imprimir-guion, [data-sala-tarjeta], [data-sala-aviso], #ptWatermark, .no-print { display: none !important; }
            .crm-main, .crm-shell, body { margin: 0 !important; padding: 0 !important; background: #fff !important; color: #000 !important; }
            .container { max-width: none !important; padding: 0 !important; }
            /* 22 sep (pedido de Diego): lo impreso cabe en el menor número de
               hojas. Sin videos, índice, casillas de "video grabado" ni botones;
               letra y espacios compactos, listas en 2 columnas, y las secciones
               pueden partirse entre hojas (antes cada una saltaba completa a la
               siguiente y dejaba medias hojas en blanco). */
            @page { size: letter; margin: 10mm 11mm; }
            html { font-size: 12px; }
            body { line-height: 1.26 !important; font-size: 9pt; }
            .video-ejemplo, .video-proximamente, .section-checkpoint, .toc, .hero-icon, .hero-subtitle,
            #app > a.btn, .checklist-progress, .progress-bar-bg, #checklist-card > .desc { display: none !important; }
            .hero { padding: 0 0 4px !important; text-align: left; }
            .hero-title { font-size: 14pt !important; margin: 0 !important; color: #000 !important; }
            .card, .guion-section { background: none !important; border-radius: 0; padding: 0 !important; margin: 0 0 6px !important; }
            .card p.desc { font-size: 8.5pt; color: #333 !important; }
            .card h2 { font-size: 10.5pt; margin: 4px 0 3px; color: #000 !important; break-after: avoid; }
            .guion-section { border-top: 1px solid #999 !important; padding-top: 4px !important; }
            .guion-section h3 { display: block; font-size: 10.5pt; margin: 0 0 4px; color: #000 !important; break-after: avoid; break-inside: avoid; }
            .guion-section .num-badge { vertical-align: -3px; margin-right: 4px; }
            .guion-section .num-badge { width: 18px; height: 18px; font-size: 7.5pt; background: #000 !important; color: #fff !important;
                -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .subtitulo { font-size: 8pt; margin: 5px 0 2px; color: #000 !important; break-after: avoid; }
            .item-accion { font-size: 8.8pt; margin-bottom: 2px; gap: 5px; color: #000 !important; }
            .item-accion .tag { font-size: 6.5pt; padding: 0 4px; margin-top: 1px; background: none !important; border: 1px solid #555; color: #000 !important; }
            .item-dialogo, .item-usuario { font-size: 8.8pt; padding: 1px 0 1px 7px; margin: 0 0 2px; background: none !important;
                border-left: 2px solid #666 !important; color: #222 !important; border-radius: 0; }
            .item-usuario { margin-left: 12px; }
            .item-nota { font-size: 8.3pt; padding: 2px 6px; margin: 3px 0; background: none !important; border: 1px dashed #888 !important; color: #222 !important; }
            .item-lista { font-size: 8.5pt; margin: 1px 0 4px 16px; columns: 2; column-gap: 18px; color: #000 !important; }
            .item-lista li { margin-bottom: 1px; break-inside: avoid; }
            .mini-checklist { columns: 2; column-gap: 18px; }
            #checklist-card { columns: 3; column-gap: 14px; }
            #checklist-card > h2 { column-span: all; }
            .mini-checklist { margin: 1px 0 4px; }
            .checklist-item, .mini-checklist .checklist-item { padding: 1px 0 !important; gap: 5px; font-size: 8.5pt !important; border: none !important; break-inside: avoid; }
            .checklist-item input[type="checkbox"] { width: 10px; height: 10px; margin-top: 2px; }
            .checklist-item label, .checklist-item.checked label { color: #000 !important; text-decoration: none; opacity: 1; }
            .guion-marca-print {
                display: block !important; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
                background-repeat: repeat; background-size: 460px 300px; opacity: 0.16;
                -webkit-print-color-adjust: exact; print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar"><div class="top-bar-inner">📜 Guion Maestro de Sesión</div></div>
    <div class="container" id="app"></div>

    <script>
    /* =========================================================
       Contenido del guion — basado en Guion_Maestro_EC1375_Video_Modelo.docx
       proporcionado por Diego. Cada sección conserva el orden e
       intercalado exacto de ACCIÓN/DIÁLOGO del documento original.
    ========================================================= */
    let GUION_SECCIONES = []; /* contenido en Supabase — publicar_contenido.py */

    const CHECKLIST_ITEMS = [
        'Preparación y condiciones del espacio', 'Lavado de manos', 'Cubrebocas quirúrgico de triple capa',
        'Tapete sanitizante', 'Gel antibacterial', 'Termómetro digital', 'Recepción cordial',
        'Presentación con nombre completo y función', 'Nombre completo del usuario', 'Asiento previamente sanitizado',
        'Explicación inicial del servicio', 'Discreción y confidencialidad', 'Protección de datos personales',
        'Aviso de Privacidad y firma de enterado', 'Identificación oficial vigente', 'Ficha de registro',
        'Autorización para exploración y signos vitales', 'Peso', 'Estatura', 'Oxímetro: SpO2 y pulso',
        'Limpieza del sensor del oxímetro', 'Observación de cabeza, cuello, tórax, extremidades y pelvis',
        'Frecuencia respiratoria durante un minuto', 'Presión arterial', 'Registro de las mediciones',
        'Verificación de que no exista impedimento', 'Explicación de la técnica',
        'Beneficios/bondades/ventajas y alcance', 'Posibles reacciones, sensaciones y efectos', 'Objetivo',
        'Vestimenta recomendada', 'Resolución de dudas', 'Consentimiento informado antes del servicio',
        'Firma de aceptación', 'Atención tradicional/complementaria', 'Aviso de finalización',
        'Preguntar cómo se siente', 'Resolver dudas posteriores', 'Explicar efectos dentro de las siguientes 24 horas',
        'Incorporación conforme a higiene de columna', 'Privacidad para vestirse', 'Encuesta de satisfacción',
        'Comentarios del usuario', 'Programa de seguimiento', 'Objetivos por sesión',
        'Propuesta y acuerdo de fechas y horarios', 'Recomendaciones', 'Actividades/tareas/ejercicios para casa',
        'Medio de contacto', 'Datos del Centro de Atención', 'Confirmación de dudas resueltas', 'Agradecimiento y despedida'
    ];

    /* Protocolo de apertura de la grabación (24 sep, auditoría legal): 60
       segundos al inicio del video que hacen casi imposible presentar el video
       de otra persona o de otro lugar como propio. Textos modelo: validar con
       el evaluador. Se guardan en el mismo estado del checklist (apertura-N). */
    const PROTOCOLO_APERTURA = [
        'Con la grabación ya corriendo, muestro mi INE a la cámara (frente, a buena distancia y enfocada) y digo mi nombre completo.',
        'Digo la fecha de hoy y el domicilio del espacio donde estoy (el mismo que declaro en Documentos de Sesión).',
        'Hago un recorrido lento con la cámara por el espacio: entrada, camilla o área de trabajo y material.',
        'La persona que voy a atender dice a la cámara su nombre y que acepta que la sesión se grabe para mi evaluación.',
        'No corto ni pauso la grabación desde aquí hasta la despedida.'
    ];

    function loadAutodiagnosticoResult() {
        try {
            const saved = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null');
            if (!saved || !saved.personalData || !saved.personalData.nombre) return null;
            const answers = saved.answers || {};
            return { personalData: saved.personalData, completo: Object.keys(answers).length === 142 };
        } catch (e) { return null; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function checkboxRow(key, label, extraClass) {
        return `
            <div class="checklist-item ${extraClass || ''}" id="ci-${key}">
                <input type="checkbox" id="chk-${key}" onchange="toggleChecklistItem('${key}')">
                <label for="chk-${key}">${escapeHtml(label)}</label>
            </div>`;
    }

    /* Video de ejemplo por sección — mismo patrón de "toca para reproducir"
       de ruta-alineacion.html (embed de youtube-nocookie al hacer clic, sin
       cargar el iframe de entrada). La mayoría son Shorts verticales de
       https://www.youtube.com/playlist?list=PLOZTSHcCf2OI (cuenta de
       YouTube de Paideia Tech) — se suben por sección según se van
       grabando, así que no todas tienen video todavía. Excepción: la
       sección 14 (Atención tradicional/complementaria) usa un video
       horizontal más largo ("pesado", no Short) — `videoWide: true` cambia
       el aspect-ratio del embed de 9:16 a 16:9 (ver CSS .video-ejemplo.wide). */
    function renderVideoEjemplo(s) {
        if (s.videoId) {
            return `
                <div class="video-ejemplo${s.videoWide ? ' wide' : ''}" id="video-${s.num}">
                    <div class="ph" onclick="playVideoEjemplo(${s.num}, '${s.videoId}')">
                        <div class="ic">▶</div>
                        <div class="nm">Ejemplo de esta sección</div>
                        <div class="ins">Toca para reproducir</div>
                    </div>
                </div>`;
        }
        return `<div class="video-proximamente">🎬 Video de ejemplo — próximamente, se está subiendo a la cuenta de YouTube de Paideia Tech.</div>`;
    }

    function playVideoEjemplo(num, videoId) {
        const box = document.getElementById(`video-${num}`);
        if (!box) return;
        box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1&autoplay=1" title="Ejemplo de la sección ${num}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
    }

    function renderItem(item) {
        if (item.t === 'accion') return `<div class="item-accion"><span class="tag">ACCIÓN</span><span>${escapeHtml(item.x)}</span></div>`;
        if (item.t === 'dialogo') return `<div class="item-dialogo">"${escapeHtml(item.x)}"</div>`;
        if (item.t === 'usuario') return `<div class="item-usuario">USUARIO: "${escapeHtml(item.x)}"</div>`;
        if (item.t === 'nota') return `<div class="item-nota">💡 ${escapeHtml(item.x)}</div>`;
        if (item.t === 'subtitulo') return `<div class="subtitulo">${escapeHtml(item.x)}</div>`;
        if (item.t === 'lista') return `<ul class="item-lista">${item.x.map(li => `<li>${escapeHtml(li)}</li>`).join('')}</ul>`;
        if (item.t === 'checklist') return `<div class="mini-checklist">${item.x.map((label, i) => checkboxRow(`${item.key}-${i}`, label)).join('')}</div>`;
        return '';
    }

    function renderGuionContent() {
        const toc = GUION_SECCIONES.map(s => `<a href="#seccion-${s.num}">${s.num}. ${escapeHtml(s.titulo)}</a>`).join('');
        const secciones = GUION_SECCIONES.map(s => `
            <div class="guion-section" id="seccion-${s.num}">
                <h3><span class="num-badge">${s.num}</span> ${escapeHtml(s.titulo)}</h3>
                ${s.items.map(renderItem).join('')}
                ${s.checkpoint ? renderVideoEjemplo(s) + checkboxRow(`checkpoint-${s.num}`, '🎬 Video de esta sección grabado', 'section-checkpoint') : (s.videoId ? renderVideoEjemplo(s) : '')}
            </div>
        `).join('');

        const checklistHtml = CHECKLIST_ITEMS.map((label, i) => checkboxRow(`final-${i}`, label)).join('');

        return `
            <div class="hero">
                <div class="hero-icon">📜</div>
                <h1 class="hero-title">Guion Maestro de Sesión</h1>
                <p class="hero-subtitle">Ténlo abierto en otra pestaña o impreso durante tu sesión con el usuario</p>
            </div>

            <div class="card">
                <p class="desc"><strong>Objetivo:</strong> guiarte para cubrir todos los criterios que evalúa el estándar durante tu atención simulada — qué hacer (ACCIÓN) y qué decir (en cursiva). Puedes cambiar la redacción del diálogo siempre que no omitas el criterio.</p>
            </div>

            <details class="toc">
                <summary>📑 Índice — ir directo a una sección</summary>
                <div class="toc-list">${toc}</div>
            </details>

            <div class="card" id="protocolo-apertura">
                <h2>🎬 Antes de empezar: protocolo de apertura (60 segundos)</h2>
                <p class="desc" style="margin-bottom:12px;">Es lo primero que debe verse en tu video. Le demuestra al Centro Evaluador que la sesión es tuya, en el lugar que declaraste y con una persona que aceptó ser grabada. <strong>Un video sin esta apertura puede no ser aceptado.</strong></p>
                <div class="mini-checklist">${PROTOCOLO_APERTURA.map((label, i) => checkboxRow(`apertura-${i}`, label)).join('')}</div>
            </div>

            ${secciones}

            <div class="card" id="checklist-card">
                <h2>✅ Lista de control antes de terminar</h2>
                <p class="desc" style="margin-bottom:14px;">Marca cada punto conforme lo vayas cubriendo durante la sesión — tu avance se guarda en este dispositivo.</p>
                <div class="checklist-progress">
                    <span id="checklistProgressText">0 / ${CHECKLIST_ITEMS.length}</span>
                    <button class="btn btn-secondary" style="padding:6px 14px;font-size:0.78rem;" onclick="resetChecklist()">Reiniciar</button>
                </div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div></div>
                ${checklistHtml}
            </div>

            <a href="documentos-sesion.html" class="btn btn-primary btn-full" style="margin-top:10px;">📋 Ir a Documentos de Sesión →</a>
        `;
    }

    function loadChecklistState() {
        try { return JSON.parse(localStorage.getItem('guionChecklistState') || '{}'); } catch (e) { return {}; }
    }
    function saveChecklistState(state) {
        localStorage.setItem('guionChecklistState', JSON.stringify(state));
    }
    function updateChecklistProgress() {
        const state = loadChecklistState();
        const total = CHECKLIST_ITEMS.length;
        const done = CHECKLIST_ITEMS.filter((_, i) => state['final-' + i]).length;
        const progressText = document.getElementById('checklistProgressText');
        const progressBar = document.getElementById('progressBarFill');
        if (progressText) progressText.textContent = `${done} / ${total}`;
        if (progressBar) progressBar.style.width = `${Math.round((done / total) * 100)}%`;
    }
    function toggleChecklistItem(key) {
        const state = loadChecklistState();
        state[key] = !state[key];
        saveChecklistState(state);
        document.getElementById('ci-' + key).classList.toggle('checked', !!state[key]);
        updateChecklistProgress();
    }
    function resetChecklist() {
        if (!confirm('¿Reiniciar TODA la lista de control (incluye preparación del espacio y checkpoints de video)?')) return;
        saveChecklistState({});
        applyChecklistState();
    }
    function applyChecklistState() {
        const state = loadChecklistState();
        document.querySelectorAll('#app input[type="checkbox"][id^="chk-"]').forEach(cb => {
            const key = cb.id.slice(4);
            const checked = !!state[key];
            cb.checked = checked;
            const row = document.getElementById('ci-' + key);
            if (row) row.classList.toggle('checked', checked);
        });
        updateChecklistProgress();
    }

    /* 18 sep (pedido de Diego): imprimir o guardar el guion en PDF, con el
       nombre del candidato como marca de agua en cada hoja. */
    function marcaImpresionSvg(nombre, correo, fecha) {
        const x = v => String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300">' +
            '<g transform="rotate(-28 230 150)" font-family="Helvetica,Arial,sans-serif" fill="#0f1428">' +
            '<text x="230" y="140" text-anchor="middle" font-size="22" font-weight="700">' + x(nombre) + '</text>' +
            '<text x="230" y="166" text-anchor="middle" font-size="12">' + x(correo) + ' · ' + x(fecha) + '</text></g></svg>';
        return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
    }
    function prepararImpresion(nombre, correo) {
        let capa = document.querySelector('.guion-marca-print');
        if (!capa) { capa = document.createElement('div'); capa.className = 'guion-marca-print'; capa.setAttribute('aria-hidden', 'true'); document.body.appendChild(capa); }
        const fecha = new Date().toLocaleDateString('es-MX', { timeZone: 'America/Mexico_City', day: '2-digit', month: '2-digit', year: 'numeric' });
        capa.style.backgroundImage = marcaImpresionSvg(nombre, correo, fecha);
    }
    let detallesAbiertosAntes = [];
    window.addEventListener('beforeprint', () => {
        detallesAbiertosAntes = [...document.querySelectorAll('details')].filter(d => !d.open);
        detallesAbiertosAntes.forEach(d => { d.open = true; });
    });
    window.addEventListener('afterprint', () => { detallesAbiertosAntes.forEach(d => { d.open = false; }); detallesAbiertosAntes = []; });
    function imprimirGuion() { window.print(); }

    async function render() {
        const app = document.getElementById('app');
        const result = loadAutodiagnosticoResult();

        if (!result || !result.completo) {
            app.innerHTML = `
                <div class="hero"><div class="hero-icon">📜</div><h1 class="hero-title">Guion Maestro de Sesión</h1></div>
                <div class="blocked-box">
                    <p><strong>Primero necesitas completar tu Autodiagnóstico</strong></p>
                    <a href="autodiagnostico.html" class="btn btn-primary">📋 Ir al Autodiagnóstico</a>
                </div>`;
            return;
        }

        const session = await Auth.getSession();
        if (!session) {
            app.innerHTML = `
                <div class="hero"><div class="hero-icon">🔐</div><h1 class="hero-title">Guion Maestro de Sesión</h1></div>
                <div class="blocked-box">
                    <p><strong>Verifica tu correo para continuar</strong></p>
                    <a href="panel.html" class="btn btn-primary">🔐 Iniciar sesión</a>
                </div>`;
            return;
        }

        await Auth.isBypassSession();
        /* 18 sep: la sesión grabada se habilita con Alineación. */
        const autorizado = Auth._isBypassSession || await Auth.isPhaseAuthorized(session.user.email, 'alineacion');
        if (!autorizado) {
            app.innerHTML = `
                <div class="hero"><div class="hero-icon">📜</div><h1 class="hero-title">Guion Maestro de Sesión</h1></div>
                <div class="pay-box">
                    <p>Este guion es tu apoyo para la sesión grabada, que se habilita con tu pago de <strong>Alineación</strong>.</p>
                    <a href="alineacion.html" class="btn btn-primary btn-full" style="margin-top:16px;">Ir a mi Alineación →</a>
                </div>`;
            return;
        }

        app.innerHTML = renderGuionContent();
        const nombreMarca = (result && result.personalData && result.personalData.nombre) || session.user.email;
        prepararImpresion(nombreMarca, session.user.email);
        const heroGuion = app.querySelector('.hero');
        (heroGuion || app).insertAdjacentHTML(heroGuion ? 'afterend' : 'afterbegin',
            `<button type="button" class="btn btn-secondary btn-full btn-imprimir-guion" onclick="imprimirGuion()">🖨️ Imprimir o guardar en PDF</button>
             <p class="no-print" style="font-size:0.78rem;color:var(--text);margin:-10px 0 18px;">En la ventana de impresión elige "Guardar como PDF". Cada hoja lleva tu nombre como marca de agua.</p>`);
        SalaEvidencias.montarDespuesDelHero(app);
        applyChecklistState();

        /* Shell CRM: el guion es recurso de la fase de Evaluación; se marca
           "estás aquí" en Plan de Evaluación (desde donde se enlaza). */
        try {
            const flowSteps = await FlowStatus.getSteps();
            CrmShell.mount({ currentPageId: 'plan-evaluacion', steps: flowSteps, title: '📜 Guion Maestro' });
        } catch (e) {
            console.warn('No se pudo calcular el progreso para el shell:', e);
            CrmShell.mount({ currentPageId: 'plan-evaluacion', steps: [], degraded: true, title: '📜 Guion Maestro' });
        }
    }

    window.addEventListener('load', async () => {
        /* Proyecto 4: el guion vive en Supabase (contenido_ec1375, fase
           Evaluación); el bloque inline, si aún existe, es respaldo. */
        try { GUION_SECCIONES = await Contenido.cargar('guion:secciones', { fallback: GUION_SECCIONES.length ? GUION_SECCIONES : null }); }
        catch (eCont) { document.getElementById('app').innerHTML = Contenido.errorHtml(eCont); return; }
        render().catch(e => {
            console.error('Error en render():', e);
            document.getElementById('app').innerHTML = `
                <div class="hero"><div class="hero-icon">⚠️</div><h1 class="hero-title">Algo salió mal</h1></div>
                <div class="blocked-box">
                    <p>No pudimos cargar esta página. Intenta recargarla — si el problema sigue, escríbenos por WhatsApp.</p>
                    <button class="btn btn-primary" onclick="window.location.reload()">🔄 Recargar</button>
                    <p style="margin-top:14px;font-size:0.85rem;"><a href="https://wa.me/528115026729" style="color:var(--primary);" target="_blank">Escribir por WhatsApp</a></p>
                </div>`;
        });
    });
    </script>
