<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guion Maestro de Sesión - Paideia Tech</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --dark: #050a1a;
            --dark-light: #0f1428;
            --primary: #0088FF;
            --primary-light: #00CCFF;
            --accent: #FFD700;
            --text: #D0D0D0;
            --text-bright: #FFFFFF;
            --danger: #FF3333;
            --success: #00FF88;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a1530 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container { max-width: 780px; margin: 0 auto; padding: 24px 20px; }

        .top-bar {
            position: sticky; top: 0; background: var(--dark);
            border-bottom: 1px solid var(--dark-light); padding: 16px 20px; z-index: 100;
        }
        .top-bar-inner { max-width: 780px; margin: 0 auto; font-size: 0.95rem; color: var(--text-bright); font-weight: 700; }

        .hero { text-align: center; padding: 20px 0 24px; }
        .hero-icon { font-size: 3rem; margin-bottom: 14px; }
        .hero-title { font-size: 1.6rem; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; }
        .hero-subtitle { font-size: 0.95rem; color: var(--text); }

        .card { background: var(--dark-light); border-radius: 12px; padding: 22px; margin-bottom: 18px; }
        .card h2 { font-size: 1.05rem; color: var(--text-bright); margin-bottom: 10px; }
        .card p.desc { font-size: 0.85rem; color: var(--text); }

        .blocked-box, .pay-box {
            border-radius: 12px; padding: 28px; text-align: center;
        }
        .blocked-box { background: rgba(255, 215, 0, 0.08); border: 1px solid var(--accent); }
        .pay-box { background: linear-gradient(135deg, rgba(0,136,255,0.15), rgba(0,204,255,0.05)); border: 2px solid var(--primary); }
        .blocked-box p, .pay-box p { color: var(--text); margin-bottom: 18px; }

        .btn {
            padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease; text-align: center;
            display: inline-block; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-full { width: 100%; margin-bottom: 12px; }

        /* Tabla de contenidos */
        .toc { background: var(--dark-light); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .toc summary { cursor: pointer; font-weight: 700; color: var(--text-bright); font-size: 0.95rem; }
        .toc-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 14px; }
        .toc-list a {
            color: var(--primary-light); text-decoration: none; font-size: 0.82rem;
            padding: 4px 0; display: block;
        }
        .toc-list a:hover { text-decoration: underline; }

        /* Secciones del guion */
        .guion-section {
            background: var(--dark-light); border-radius: 12px; padding: 22px;
            margin-bottom: 16px; scroll-margin-top: 70px;
        }
        .guion-section h3 {
            color: var(--accent); font-size: 1.05rem; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .guion-section .num-badge {
            background: var(--primary); color: white; width: 26px; height: 26px;
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.8rem; flex-shrink: 0;
        }
        .subtitulo { font-size: 0.85rem; font-weight: 700; color: var(--primary-light); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.3px; }
        .item-accion {
            display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px;
            font-size: 0.88rem; color: var(--text-bright);
        }
        .item-accion .tag {
            background: rgba(0,136,255,0.2); color: var(--primary-light); font-size: 0.68rem;
            font-weight: 700; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; margin-top: 2px;
        }
        .item-dialogo {
            background: var(--dark); border-left: 3px solid var(--primary); border-radius: 0 6px 6px 0;
            padding: 8px 12px; margin-bottom: 8px; font-size: 0.88rem; font-style: italic; color: var(--text);
        }
        .item-usuario {
            background: rgba(255,255,255,0.03); border-left: 3px solid rgba(255,255,255,0.25); border-radius: 0 6px 6px 0;
            padding: 8px 12px; margin-bottom: 8px; font-size: 0.85rem; font-style: italic; color: rgba(255,255,255,0.55);
            margin-left: 16px;
        }
        .item-nota {
            background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.3); border-radius: 8px;
            padding: 10px 12px; margin: 10px 0; font-size: 0.82rem; color: var(--accent);
        }
        .item-lista { font-size: 0.85rem; color: var(--text); margin: 4px 0 10px 20px; }
        .item-lista li { margin-bottom: 4px; }

        /* Checklist final */
        .checklist-item {
            display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.85rem;
        }
        .checklist-item input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
        .checklist-item label { color: var(--text); cursor: pointer; }
        .checklist-item.checked label { color: var(--success); text-decoration: line-through; opacity: 0.7; }
        .mini-checklist { margin: 6px 0 10px; }
        .mini-checklist .checklist-item { padding: 6px 0; font-size: 0.85rem; }
        .section-checkpoint {
            margin-top: 16px; padding: 10px 12px !important; background: rgba(255,215,0,0.06);
            border: 1px solid rgba(255,215,0,0.25); border-radius: 8px;
        }
        .section-checkpoint label { color: var(--accent) !important; font-weight: 700; }
        .section-checkpoint.checked { background: rgba(0,255,136,0.08); border-color: var(--success); }
        .section-checkpoint.checked label { color: var(--success) !important; }
        .checklist-progress {
            font-size: 0.85rem; color: var(--text-bright); font-weight: 700; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .progress-bar-bg { background: var(--dark); border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 16px; }
        .progress-bar-fill { background: var(--success); height: 100%; transition: width 0.3s ease; }

        @media (max-width: 500px) {
            .toc-list { grid-template-columns: 1fr; }
        }
    </style>
</head>

            { t: 'dialogo', x: 'Para darle seguimiento, ¿cuál es el medio de contacto que le resulta más conveniente: teléfono, celular, correo electrónico o alguna plataforma digital?' },
            { t: 'accion', x: 'Registrar el medio de contacto.' },
            { t: 'dialogo', x: 'Le proporciono también los datos de nuestro Centro de Atención Tradicional y Complementaria y nuestro medio de atención telefónica para cualquier duda relacionada con su servicio.' }
        ]},
        { num: 19, titulo: 'Cierre y despedida', checkpoint: true, items: [
            { t: 'subtitulo', x: 'Verificar el Plan de Seguimiento' },
            { t: 'lista', x: ['Fechas y horarios.', 'Medio de contacto.', 'Número de sesiones, frecuencia y duración.', 'Plan de sesión.', 'Nombre y firma/huella del usuario y de quien otorga el servicio.'] },
            { t: 'subtitulo', x: 'Verificar el Plan de Sesión' },
            { t: 'lista', x: ['Número de sesión, fecha, hora de inicio y término.', 'Registro de signos vitales.', 'Actividades/intervenciones/atención.', 'Notas de evolución.', 'Pronóstico del número de sesiones.', 'Actividades, tareas o ejercicios para casa.'] },
            { t: 'dialogo', x: 'Con esto concluimos su atención del día de hoy. Muchas gracias por su asistencia, por su disposición y por la confianza.' },
            { t: 'dialogo', x: 'Nos vemos en su próxima sesión el [FECHA] a las [HORA]. Que tenga un excelente día.' }
        ]}
    ];

    const CHECKLIST_ITEMS = [
        'Preparación y condiciones del espacio', 'Lavado de manos', 'Cubrebocas quirúrgico de triple capa',
        'Tapete sanitizante', 'Gel antibacterial', 'Termómetro digital', 'Recepción cordial',
        'Presentación con nombre completo y función', 'Nombre completo del usuario', 'Asiento previamente sanitizado',
        'Explicación inicial del servicio', 'Discreción y confidencialidad', 'Protección de datos personales',
        'Aviso de Privacidad y firma de enterado', 'Identificación oficial vigente', 'Ficha de registro',
        'Autorización para exploración y signos vitales', 'Peso', 'Estatura', 'Oxímetro: SpO2 y pulso',
        'Limpieza del sensor del oxímetro', 'Observación de cabeza, cuello, tórax, extremidades y pelvis',
        'Frecuencia respiratoria durante un minuto', 'Presión arterial', 'Registro de las mediciones',
        'Verificación de que no exista impedimento', 'Explicación de la técnica',
        'Beneficios/bondades/ventajas y alcance', 'Posibles reacciones, sensaciones y efectos', 'Objetivo',
        'Vestimenta recomendada', 'Resolución de dudas', 'Consentimiento informado antes del servicio',
        'Firma de aceptación', 'Atención tradicional/complementaria', 'Aviso de finalización',
        'Preguntar cómo se siente', 'Resolver dudas posteriores', 'Explicar efectos dentro de las siguientes 24 horas',
        'Incorporación conforme a higiene de columna', 'Privacidad para vestirse', 'Encuesta de satisfacción',
        'Comentarios del usuario', 'Programa de seguimiento', 'Objetivos por sesión',
        'Propuesta y acuerdo de fechas y horarios', 'Recomendaciones', 'Actividades/tareas/ejercicios para casa',
        'Medio de contacto', 'Datos del Centro de Atención', 'Confirmación de dudas resueltas', 'Agradecimiento y despedida'
    ];

    function loadAutodiagnosticoResult() {
        try {
            const saved = JSON.parse(localStorage.getItem('autodiagnosticoData') || 'null');
            if (!saved || !saved.personalData || !saved.personalData.nombre) return null;
            const answers = saved.answers || {};
            return { personalData: saved.personalData, completo: Object.keys(answers).length === 142 };
        } catch (e) { return null; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function checkboxRow(key, label, extraClass) {
        return `
            <div class="checklist-item ${extraClass || ''}" id="ci-${key}">
                <input type="checkbox" id="chk-${key}" onchange="toggleChecklistItem('${key}')">
                <label for="chk-${key}">${escapeHtml(label)}</label>
            </div>`;
    }

    function renderItem(item) {
        if (item.t === 'accion') return `<div class="item-accion"><span class="tag">ACCIÓN</span><span>${escapeHtml(item.x)}</span></div>`;
        if (item.t === 'dialogo') return `<div class="item-dialogo">"${escapeHtml(item.x)}"</div>`;
        if (item.t === 'usuario') return `<div class="item-usuario">USUARIO: "${escapeHtml(item.x)}"</div>`;
        if (item.t === 'nota') return `<div class="item-nota">💡 ${escapeHtml(item.x)}</div>`;
        if (item.t === 'subtitulo') return `<div class="subtitulo">${escapeHtml(item.x)}</div>`;
        if (item.t === 'lista') return `<ul class="item-lista">${item.x.map(li => `<li>${escapeHtml(li)}</li>`).join('')}</ul>`;
        if (item.t === 'checklist') return `<div class="mini-checklist">${item.x.map((label, i) => checkboxRow(`${item.key}-${i}`, label)).join('')}</div>`;
        return '';
    }

    function renderGuionContent() {
        const toc = GUION_SECCIONES.map(s => `<a href="#seccion-${s.num}">${s.num}. ${escapeHtml(s.titulo)}</a>`).join('');
        const secciones = GUION_SECCIONES.map(s => `
            <div class="guion-section" id="seccion-${s.num}">
                <h3><span class="num-badge">${s.num}</span> ${escapeHtml(s.titulo)}</h3>
                ${s.items.map(renderItem).join('')}
                ${s.checkpoint ? checkboxRow(`checkpoint-${s.num}`, '🎬 Video de esta sección grabado', 'section-checkpoint') : ''}
            </div>
        `).join('');

        const checklistHtml = CHECKLIST_ITEMS.map((label, i) => checkboxRow(`final-${i}`, label)).join('');

        return `
            <div class="hero">
                <div class="hero-icon">📜</div>
                <h1 class="hero-title">Guion Maestro de Sesión</h1>
                <p class="hero-subtitle">Ténlo abierto en otra pestaña o impreso durante tu sesión con el usuario</p>
            </div>

            <div class="card">
                <p class="desc"><strong>Objetivo:</strong> guiarte para cubrir todos los criterios que evalúa el estándar durante tu atención simulada — qué hacer (ACCIÓN) y qué decir (en cursiva). Puedes cambiar la redacción del diálogo siempre que no omitas el criterio.</p>
            </div>

            <details class="toc">
                <summary>📑 Índice — ir directo a una sección</summary>
                <div class="toc-list">${toc}</div>
            </details>

            ${secciones}

            <div class="card" id="checklist-card">
                <h2>✅ Lista de control antes de terminar</h2>
                <p class="desc" style="margin-bottom:14px;">Marca cada punto conforme lo vayas cubriendo durante la sesión — tu avance se guarda en este dispositivo.</p>
                <div class="checklist-progress">
                    <span id="checklistProgressText">0 / ${CHECKLIST_ITEMS.length}</span>
                    <button class="btn btn-secondary" style="padding:6px 14px;font-size:0.78rem;" onclick="resetChecklist()">Reiniciar</button>
                </div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div></div>
                ${checklistHtml}
            </div>

            <a href="documentos-sesion.html" class="btn btn-primary btn-full" style="margin-top:10px;">📋 Ir a Documentos de Sesión →</a>
        `;
    }

    function loadChecklistState() {
        try { return JSON.parse(localStorage.getItem('guionChecklistState') || '{}'); } catch (e) { return {}; }
    }
    function saveChecklistState(state) {
        localStorage.setItem('guionChecklistState', JSON.stringify(state));
    }
    function updateChecklistProgress() {
        const state = loadChecklistState();
        const total = CHECKLIST_ITEMS.length;
        const done = CHECKLIST_ITEMS.filter((_, i) => state['final-' + i]).length;
        const progressText = document.getElementById('checklistProgressText');
        const progressBar = document.getElementById('progressBarFill');
        if (progressText) progressText.textContent = `${done} / ${total}`;
        if (progressBar) progressBar.style.width = `${Math.round((done / total) * 100)}%`;
    }
    function toggleChecklistItem(key) {
        const state = loadChecklistState();
        state[key] = !state[key];
        saveChecklistState(state);
        document.getElementById('ci-' + key).classList.toggle('checked', !!state[key]);
        updateChecklistProgress();
    }
    function resetChecklist() {
        if (!confirm('¿Reiniciar TODA la lista de control (incluye preparación del espacio y checkpoints de video)?')) return;
        saveChecklistState({});
        applyChecklistState();
    }
    function applyChecklistState() {
        const state = loadChecklistState();
        document.querySelectorAll('#app input[type="checkbox"][id^="chk-"]').forEach(cb => {
            const key = cb.id.slice(4);
            const checked = !!state[key];
            cb.checked = checked;
            const row = document.getElementById('ci-' + key);
            if (row) row.classList.toggle('checked', checked);
        });
        updateChecklistProgress();
    }

    async function render() {
        const app = document.getElementById('app');
        const result = loadAutodiagnosticoResult();

        if (!result || !result.completo) {
            app.innerHTML = `
                <div class="hero"><div class="hero-icon">📜</div><h1 class="hero-title">Guion Maestro de Sesión</h1></div>
                <div class="blocked-box">
                    <p><strong>Primero necesitas completar tu Autodiagnóstico</strong></p>
                    <a href="autodiagnostico.html" class="btn btn-primary">📋 Ir al Autodiagnóstico</a>
                </div>`;
            return;
        }

        const session = await Auth.getSession();
        if (!session) {
            app.innerHTML = `
                <div class="hero"><div class="hero-icon">🔐</div><h1 class="hero-title">Guion Maestro de Sesión</h1></div>
                <div class="blocked-box">
                    <p><strong>Verifica tu correo para continuar</strong></p>
                    <a href="recuperar.html" class="btn btn-primary">🔐 Iniciar sesión</a>
                </div>`;
            return;
        }

        const autorizado = await Auth.isPhaseAuthorized(session.user.email, 'evaluacion');
        if (!autorizado) {
            app.innerHTML = `
                <div class="hero"><div class="hero-icon">📜</div><h1 class="hero-title">Guion Maestro de Sesión</h1></div>
                <div class="pay-box">
                    <p>Este guion es material de apoyo para tu sesión de <strong>Evaluación</strong> — antes de continuar necesitas completar ese pago.</p>
                    <a href="documentos-sesion.html" class="btn btn-primary btn-full" style="margin-top:16px;">Ir a pagar Evaluación →</a>
                </div>`;
            return;
        }

        app.innerHTML = renderGuionContent();
        applyChecklistState();
    }

    window.addEventListener('load', () => {
        render().catch(e => {
            console.error('Error en render():', e);
            document.getElementById('app').innerHTML = `
                <div class="hero"><div class="hero-icon">⚠️</div><h1 class="hero-title">Algo salió mal</h1></div>
                <div class="blocked-box">
                    <p>No pudimos cargar esta página. Intenta recargarla — si el problema sigue, escríbenos por WhatsApp.</p>
                    <button class="btn btn-primary" onclick="window.location.reload()">🔄 Recargar</button>
                    <p style="margin-top:14px;font-size:0.85rem;"><a href="https://wa.me/528136071342" style="color:var(--primary);" target="_blank">Escribir por WhatsApp</a></p>
                </div>`;
        });
    });
    </script>
</body>
</html>
